/* ------------------------------------------------------------
   Niveaulijst op het beginscherm
   ------------------------------------------------------------
   Het demo-niveau zit in dit bestand. Alle andere niveaus zijn losse
   JSON-bestanden uit de builder in de map Levels/. Zie Levels/README.md.
   ------------------------------------------------------------ */
const LEVELS_DIR="Levels/";
/* Het hoofdmenu is de echte voordeur; deze speler blijft daarnaast ook
   zelfstandig werken (open je dit bestand direct, dan zie je gewoon zijn
   eigen lijst). Kom je vanuit het menu binnen (via ?level= of ?upload=1),
   dan wijst "terug naar menu" voortaan naar buiten toe, niet naar deze
   eigen lijst. */
const HUB_URL="../menu/index.html";
let vanuitMenu=false;
const PLAYER_APP_VERSION="0.9.21";

/* Alle geladen niveaus (demo + Levels-map + handmatig ge\u00efmporteerde
   bestanden), op volgorde van hun kaart in de lijst. showLevelDetail() en
   startLevel() werken via deze index, niet via losse closures per kaart. */
let loadedLevels=[];
let currentLevelIndex=-1;

function levelStatsLine(raw){
  const c=raw.content||{}, g=raw.puzzle.grid;
  const clues=(Array.isArray(raw.clues)?raw.clues:(c.clues||[])).filter(x=>x&&(x.text||x.storyText));
  const stukken=[g.columns+"\u00d7"+g.rows, raw.puzzle.people.placements.length+" personen", clues.length+" regels"];
  return stukken.join(" \u2022 ");
}
/* De moeilijkheid uit het bestand, als hij is meegestuurd. */
const GRAAD_WOORD={1:"Instap",2:"Licht",3:"Gemiddeld",4:"Pittig",5:"Zwaar"};
function levelGraad(raw){
  const d=raw&&raw.difficulty;
  return (d && d.graad>=1 && d.graad<=5) ? d : null;
}
function makeLevelCard(raw,index){
  const c=raw.content||{};
  const card=document.createElement("button");
  card.type="button"; card.className="level-card";
  card.setAttribute("aria-label","Bekijk "+(c.title||"dit niveau"));
  const h=document.createElement("h2"); h.textContent=c.title||"Naamloos niveau";
  const p=document.createElement("p"); p.textContent=c.intro||"Geen introtekst in dit niveau.";
  const stats=document.createElement("div"); stats.className="stats"; stats.textContent=levelStatsLine(raw);
  card.appendChild(h); card.appendChild(p); card.appendChild(stats);
  /* Het niveau uit het bestand, als bolletjes onder de tekst. */
  const gr=levelGraad(raw);
  if(gr){
    const nv=document.createElement("div"); nv.className="niveau-rij";
    nv.title=gr.uitleg||"";
    nv.innerHTML='<span class="nv-lbl">Niveau '+gr.graad+'</span>'
      +[1,2,3,4,5].map(n=>'<i class="'+(n<=gr.graad?'aan':'')+'"></i>').join("");
    card.appendChild(nv);
  }
  /* Het genre als klein embleem op de kaart. De kiezer zelf blijft neutraal;
     pas wie het level opent, stapt het thema binnen. */
  const th=raw.puzzle.theme;
  if(THEMA_PAKKETTEN[th]){
    const chip=document.createElement("span"); chip.className="genre-chip";
    chip.textContent=raw.puzzle.themeLabel||THEMA_PAKKETTEN[th].label;
    card.appendChild(chip);
  }
  card.addEventListener("click",function(){ showLevelDetail(index); });
  return card;
}
/* Zoekt de niveaubestanden op twee manieren, zodat je een bestand alleen maar
   in de map hoeft te zetten: eerst het lijstje Levels/index.json (nodig op
   GitHub Pages, dat geen mapinhoud toont), daarna de mapinhoud die een lokale
   webserver wel toont. Dubbele namen vallen vanzelf weg. */
async function discoverLevelFiles(){
  const names=new Set();
  const add=function(n){
    const f=String(n||"").split("?")[0].split("#")[0].replace(/^.*[\\\/]/,"");
    if(f && /\.json$/i.test(f) && f.toLowerCase()!=="index.json") names.add(f);
  };
  try{
    const r=await fetch(LEVELS_DIR+"index.json",{cache:"no-store"});
    if(r.ok){
      const j=await r.json();
      (Array.isArray(j)?j:((j&&j.levels)||[])).forEach(function(e){
        add(typeof e==="string"?e:(e&&e.file));
      });
    }
  }catch(e){}
  try{
    const r=await fetch(LEVELS_DIR,{cache:"no-store"});
    if(r.ok && /html/i.test(r.headers.get("content-type")||"")){
      const html=await r.text();
      const re=/href\s*=\s*["']([^"']+)["']/gi;
      let m; while((m=re.exec(html))) add(decodeURIComponent(m[1]));
    }
  }catch(e){}
  return Array.from(names).sort(function(a,b){ return a.localeCompare(b,"nl"); });
}
/* Zelfde sleutel als het menu gebruikt om een geüpload level heel eventjes
   klaar te zetten: alleen op dit apparaat, in deze browser, nooit ergens
   naartoe verstuurd. */
const UPLOAD_HANDOFF_KEY="clueboard:uploadLevel";

/* Kwam je vanuit het menu met een specifiek level (?level=<bestandsnaam
   zonder .json>) of met een net geüpload level (?upload=1)? Dan slaat de
   speler zijn eigen lijst over en opent meteen dat ene level, alsof je net
   op die kaart had geklikt. Zonder zo'n vlag verandert er niets: de speler
   toont gewoon zijn eigen lijst, precies als vanouds. */
async function bootVanUrl(){
  const qs=new URLSearchParams(location.search);
  const upload=qs.get("upload");
  const id=qs.get("level");
  if(!upload&&!id) return false;

  let raw=null, fout=null, bron="";
  try{
    if(upload){
      const ruw=localStorage.getItem(UPLOAD_HANDOFF_KEY);
      if(!ruw) fout="Er staat nu geen zelf geüpload level klaar. Ga terug naar het menu en upload het opnieuw.";
      else { raw=JSON.parse(ruw); bron="Eigen upload"; localStorage.removeItem(UPLOAD_HANDOFF_KEY); }
    } else {
      /* Bestandsnamen beginnen sinds kort met nummer en versie en houden hun
         spaties en hoofdletters ("2v3 De Watermolen"). De oude filter liet
         alleen letters, cijfers en streepjes door en sloopte precies die
         namen. Wat hier weg moet zijn de padtekens: geen mappen, geen ".."
         omhoog. De rest mag blijven staan. */
      const veiligeNaam=String(id).replace(/[\\/]/g,"").replace(/\.\./g,"").trim();
      if(!veiligeNaam) fout="Ongeldige levelnaam in de link.";
      else{
        const r=await fetch(LEVELS_DIR+veiligeNaam+".json",{cache:"no-store"});
        if(!r.ok) fout="Dit level ('"+veiligeNaam+"') is niet gevonden in de map Levels.";
        else { raw=await r.json(); bron=veiligeNaam+".json"; }
      }
    }
  }catch(e){ fout="Het levelbestand kon niet gelezen worden."; }

  if(!fout&&raw){
    const err=validateLevel(raw);
    if(err) fout="Ongeldig niveau: "+err;
  }
  if(fout){ toast(fout); return false; }

  vanuitMenu=true;
  loadedLevels=[{raw,source:bron}];
  currentLevelIndex=0;
  showLevelDetail(0);
  return true;
}

/* Groepeert geladen levels op hun verborgen levelId en houdt per groep
   alleen de hoogste versie over. Geen levelId? Dan is de bestandsnaam de
   groep, zodat oudere bestanden gewoon zichtbaar blijven. */
function nieuwsteVersies(items){
  const groepen=new Map();
  items.forEach(e=>{
    const id=(e.raw&&typeof e.raw.levelId==="string"&&e.raw.levelId)?e.raw.levelId:null;
    const sleutel=id?("id:"+id):("naam:"+e.source);
    const versie=(e.raw&&typeof e.raw.levelVersion==="number")?e.raw.levelVersion:0;
    const huidig=groepen.get(sleutel);
    if(!huidig||versie>huidig.versie) groepen.set(sleutel,{entry:e,versie});
  });
  return Array.from(groepen.values()).map(x=>x.entry);
}
async function renderLevelList(){
  const list=$("#levelList");
  list.innerHTML=""; loadedLevels=[];
  const note=document.createElement("div");
  note.className="level-note";
  note.textContent="Zoeken naar niveaus in de map Levels\u2026";
  list.appendChild(note);

  const alles=[{raw:buildDemoLevel(),source:"Ingebouwd oefenlevel"}];
  let files=[], broken=0;
  try{ files=await discoverLevelFiles(); }catch(e){ files=[]; }
  for(const name of files){
    let raw=null;
    try{
      const r=await fetch(LEVELS_DIR+name,{cache:"no-store"});
      if(!r.ok) continue;
      raw=await r.json();
    }catch(e){ broken++; continue; }
    if(validateLevel(raw)){ broken++; continue; }
    alles.push({raw,source:name});
  }
  /* Van elk level (herkenbaar aan zijn verborgen levelId) alleen de nieuwste
     versie tonen. Oudere exportbestanden mogen gewoon in de map blijven
     staan — de speler laat ze alleen niet meer zien. Een bestand zonder
     levelId (van vóór deze functie) is altijd zijn eigen groep, op
     bestandsnaam, zodat oudere levels gewoon blijven werken. */
  const zichtbaar=nieuwsteVersies(alles);
  /* Licht bovenaan, zwaar onderaan; levels zonder niveau sluiten de rij. */
  zichtbaar.sort((a,b)=>{
    const ga=(levelGraad(a.raw)||{}).graad||99, gb=(levelGraad(b.raw)||{}).graad||99;
    return ga-gb;
  });
  loadedLevels=zichtbaar;
  zichtbaar.forEach((e,i)=>list.insertBefore(makeLevelCard(e.raw,i),note));
  const found=zichtbaar.length-1;
  if(found){
    note.textContent=found+(found===1?" niveau":" niveaus")+" uit de map Levels."
      +(broken?" "+broken+" bestand(en) overgeslagen: geen geldig niveau.":"");
  }else if(location.protocol==="file:"){
    note.textContent="Niveaus uit de map Levels verschijnen hier zodra je de player via een webserver of GitHub Pages opent.";
  }else{
    note.textContent="Nog geen niveaus in de map Levels. Zet er JSON-bestanden uit de builder in en ververs deze pagina.";
  }
  hydrateIcons(list);
}
function loadFile(file){
  const rd=new FileReader();
  rd.onload=()=>{
    let raw;
    try{ raw=JSON.parse(rd.result); }
    catch(e){ toast("Kon het bestand niet lezen: geen geldige JSON."); return; }
    const err=validateLevel(raw);
    if(err){ toast("Ongeldig niveau: "+err); return; }
    const list=$("#levelList");
    const index=loadedLevels.length;
    loadedLevels.push({raw,source:file.name});
    if(list){
      const card=makeLevelCard(raw,index);
      list.insertBefore(card,list.firstChild);
      hydrateIcons(card);
    }
    toast("Niveau geladen: "+((raw.content&&raw.content.title)||file.name));
    showLevelDetail(index);
  };
  rd.onerror=()=>toast("Bestand kon niet gelezen worden.");
  rd.readAsText(file);
}

/* ------------------------------------------------------------
   Level-detail: slachtoffer + verdachten, v\u00f3\u00f3rdat het bord opent.
   De schuldige wordt hier nooit apart gelabeld \u2014 dat zou de puzzel
   verklappen \u2014 dus iedereen buiten het slachtoffer heet "Verdachte".
   ------------------------------------------------------------ */
function detailPeople(raw){
  const p=raw.puzzle, content=raw.content||{};
  const cp=content.people||{};
  const victimId=(raw.solution&&raw.solution.victimId)||p.people.victimId||null;
  const people=p.people.placements.map(pl=>{
    const c=cp[pl.id]||{};
    const name=c.name||pl.name||pl.id;
    return {id:pl.id, name:name, letter:String(name).trim().charAt(0).toUpperCase()||"?", isVictim:pl.id===victimId};
  });
  return {victim:people.find(pe=>pe.isVictim)||null, suspects:people.filter(pe=>!pe.isVictim)};
}
/* Bordbrede regels (bv. toegang tot een ruimte) bevatten geen puzzeloplossing
   en mogen dus getoond worden; per-persoon regels blijven verborgen tot in-game. */
/* De standaardzin over edelen, dorpelingen en ridders die de bouwer bij
   elk bord met voorbehouden gebieden meegeeft. */
function isAlgemeneRegel(tekst){
  return /^Edelen staan altijd in een gebied voor edelen/i.test(String(tekst||"").trim());
}
function getBoardRules(raw){
  const content=raw.content||{};
  const src=(Array.isArray(raw.clues)&&raw.clues.length)?raw.clues:(content.clues||[]);
  return src.filter(c=>c && !c.personId && (c.text||c.storyText));
}
/* Genoeg model om portretten te kunnen tekenen voordat het level start:
   kleuren, letters en standen, meer heeft personPortrait niet nodig. */
function modelVoorDetail(raw){
  const p=raw.puzzle, content=raw.content||{}, cp=content.people||{};
  const victimId=(raw.solution&&raw.solution.victimId)||p.people.victimId||null;
  const mensen=p.people.placements.map((pl,i)=>{
    const c=cp[pl.id]||{};
    const standing=c.role||pl.standing||null;
    return { id:pl.id, index:i, name:c.name||pl.name||pl.id,
             gender:c.gender||pl.gender||null,
             standing:standing||null, standingLabel:roleLabel(standing),
             colorLetter:c.nameLetter||null,
             hairStyle:c.hairStyle||null, hairColor:c.hairColor||null,
             attributes:(c.attributes&&typeof c.attributes==="object")?c.attributes:null,
             color:null, letter:"" };
  });
  const m={ victimId, people:mensen, peopleById:new Map(), theme:p.theme||"" };
  assignPersonColors(m);
  assignPersonLetters(mensen);
  mensen.forEach(x=>m.peopleById.set(x.id,x));
  m.victim=mensen.find(x=>x.id===victimId)||null;
  m.suspects=mensen.filter(x=>x.id!==victimId);
  const src=(Array.isArray(raw.clues)&&raw.clues.length)?raw.clues:(content.clues||[]);
  const vc=src.find(c=>c && c.personId===victimId && (c.text||c.storyText));
  m.victimClue=vc?(vc.text||vc.storyText):"";
  return m;
}

function showLevelDetail(levelIndex){
  const entry=loadedLevels[levelIndex];
  if(!entry) return;
  currentLevelIndex=levelIndex;
  const raw=entry.raw, c=raw.content||{};
  const err=validateLevel(raw);
  if(err){ toast("Ongeldig niveau: "+err); return; }

  /* Zelfde zaak als waar je in zat: gewoon verder, zonder intro. */
  if(M && currentRaw===raw){
    showScreen("game"); paintBoard();
    if(!revealed) startTimer();
    return;
  }

  /* Het bord staat al klaar achter het vel; de klok loopt pas als het vel weg is. */
  applySkin(raw.puzzle && raw.puzzle.theme);
  pendingLevel=raw; currentRaw=raw;
  M=buildModel(raw);
  notes=new Map(); placed=new Map();
  accused=null; accusedResult=null; revealed=false; elapsed=0;
  stopTimer(); $("#timerVal").textContent="0:00";
  renderBoard();
  setMode("note"); setTab("board");
  showScreen("game");

  const gr=levelGraad(raw);
  $("#introZaak").textContent=raw.levelNumber?("Zaak "+raw.levelNumber):(raw.demo?"Voorbeeldzaak":"");
  $("#introTitel").textContent=c.title||"Naamloos niveau";
  $("#introGraad").innerHTML=gr
    ? '<span class="stippen">'+[1,2,3,4,5].map(n=>'<i class="'+(n<=gr.graad?"aan":"")+'"></i>').join("")+'</span>'
      +'<span class="woord">'+esc(GRAAD_WOORD[gr.graad]||("Niveau "+gr.graad))+'</span>'
    : "";
  $("#introTekst").textContent=c.intro||"";
  $("#introTekst").hidden=!c.intro;

  $("#introKaart").innerHTML=miniKaart();
  $("#introWatermerk").innerHTML=bordWatermerk();

  /* Bordregels: de eigen regels van dit bord als gouden strook, de vaste
     rolregel als grijze voetnoot. */
  const regels=getBoardRules(raw).slice()
    .sort((a,b)=>(isAlgemeneRegel(a.text||a.storyText)?1:0)-(isAlgemeneRegel(b.text||b.storyText)?1:0));
  $("#introBordregels").innerHTML=regels.map(r=>{
    const t=r.text||r.storyText, alg=isAlgemeneRegel(t);
    return '<div class="bordregel'+(alg?' algemeen':'')+'"><span class="ic">'+AssetBank.ui(alg?"compass":"badge")+'</span><span>'+esc(t)+'</span></div>';
  }).join("");

  /* Wie erbij was, precies zoals ze straks op het bord staan: dezelfde
     schijf, dezelfde letter, hetzelfde rolteken. */
  const allen=(M.victimId?[M.peopleById.get(M.victimId)]:[]).concat(M.people.filter(p=>p.id!==M.victimId)).filter(Boolean);
  /* Om en om drie en twee op een rij. Een blijvend raster van drie liet bij
     acht of negen personen een losse staart achter; zo is elke rij op zich
     gecentreerd. Een rij die niet vol raakt staat dus ook netjes midden. */
  const rijen=[]; { let i=0, maat=3;
    while(i<allen.length){ rijen.push(allen.slice(i,i+maat)); i+=maat; maat = maat===3?2:3; } }
  const fiche=pe=>{
    const isV=pe.id===M.victimId;
    return '<div class="deelnemer'+(isV?' slachtoffer':'')+'">'+bordFiche(pe)
      +'<div class="naam">'+esc(pe.name)+'</div>'
      +'<div class="rol">'+(isV?'Slachtoffer':esc(pe.standingLabel||''))+'</div></div>';
  };
  $("#introDeelnemers").innerHTML=rijen
    .map(rij=>'<div class="deelnemer-rij">'+rij.map(fiche).join("")+'</div>').join("");
  /* Level- en spelerversie horen bij het foutspoor, niet in het dossier: ze
     staan daarom vast linksonder in #versieVoet en scrollen niet meer mee. */
  { const vv=$("#versieVoet");
    if(vv) vv.textContent=[
      raw.levelVersion?("Level "+(raw.levelNumber?raw.levelNumber+"v":"v")+raw.levelVersion):"",
      "Player "+PLAYER_APP_VERSION].filter(Boolean).join(" · "); }

  introOpen=true;
  { const vv=$("#versieVoet"); if(vv) vv.hidden=true; }
  openModal("#modalIntro");
  /* Vel begint altijd bovenaan, ook als je hetzelfde level opnieuw opent. */
  const sc=$("#introScroll"); if(sc) sc.scrollTop=0;
  introWenkStart();
}
/* Dezelfde markering als op het bord: schijf in de kleur van de persoon,
   contour van het bord, de letter erin en het rolteken rechtsonder. */
/* Een klein kaartje van het bord: alleen de vorm en de kleuren van de
   ruimtes, in dezelfde stijl als de bordjes in de uitleg. */
/* Hetzelfde bord als miniKaart, maar kaal: alleen de vorm, geen kamerkleuren.
   Dit is het watermerk achter de titel; de kleuren komen pas bij het kaartje
   verderop in het dossier. */
function bordWatermerk(){
  if(!M||!M.bounds) return "";
  const b=M.bounds;
  /* Vakjes van hoogstens 46px: op een klein bord zou een vaste breedte
     enorme blokken geven die de tekst onleesbaar maken. */
  const wrap=$("#introWatermerk");
  if(wrap) wrap.style.setProperty("--wm-breedte", Math.min(420, b.cols*46)+"px");
  let h='<div class="wm-kaart" style="grid-template-columns:repeat('+b.cols+',1fr)">';
  for(let r=b.minR;r<=b.maxR;r++) for(let c=b.minC;c<=b.maxC;c++){
    const t=M.tiles.get("c"+c+"r"+r);
    if(!t){ h+='<span class="wm-c leeg"></span>'; continue; }
    const soort = t.status==="blocked" ? " blok" : t.status==="occupiable" ? " op" : "";
    h+='<span class="wm-c'+soort+'"></span>';
  }
  return h+"</div>";
}
function miniKaart(){
  if(!M||!M.bounds) return "";
  const b=M.bounds, licht=document.documentElement.dataset.thema==="licht";
  let h='<div class="mini-kaart" style="grid-template-columns:repeat('+b.cols+',1fr);width:'
    +Math.min(190,Math.max(96,b.cols*17))+'px">';
  for(let r=b.minR;r<=b.maxR;r++) for(let c=b.minC;c<=b.maxC;c++){
    const t=M.tiles.get("c"+c+"r"+r);
    if(!t){ h+='<span class="mk-c leeg"></span>'; continue; }
    const room=M.rooms.get(t.roomId);
    const rk=(room&&room.color)?room.color:"#DCE3EF";
    const kleur=licht?mixHex(rk,"#FFFFFF",.3):mixHex(rk,"#2E2122",.42);
    h+='<span class="mk-c'+(t.status==="blocked"?" blok":"")+'" style="background:'+kleur+'"></span>';
  }
  return h+"</div>";
}
function bordFiche(pe){
  const rol=(pe.standing && rolDoetErToe(pe.standing)) ? rolBadge(pe.standing) : "";
  const letter=pe.letter||pe.name.charAt(0).toUpperCase();
  return '<span class="bord-fiche'+(pe.id===M.victimId?" victim":"")+'" style="--pc:'+esc(pe.color||"#888")+'">'
    +'<span class="init" data-len="'+letter.length+'" style="color:'+inkOnColor(pe.color||"#888")+'">'+esc(letter)+'</span>'
    +(rol?'<span class="role-badge">'+rol+'</span>':'')
    +'</span>';
}
let introOpen=false;
/* Een duwtje om verder te lezen. Het verschijnt pas als je een paar tellen
   stil blijft staan terwijl er wél meer onder de vouw staat: zo blijft het
   dossier de hoofdzaak en is de knop onderaan toch geen verstopte deur. */
let wenkTimer=null;
function introWenkStop(){
  const w=$("#introWenk"); if(w) w.hidden=true;
  if(wenkTimer){ clearTimeout(wenkTimer); wenkTimer=null; }
}
/* De maatstaf is niet "valt er te scrollen" maar "zie je de knop al": bij een
   kort dossier steekt die er soms maar een paar pixels onderuit, en dan zou de
   wenk er bovenop komen te liggen. */
function knopInBeeld(){
  const sc=$("#introScroll"), b=$("#btnBeginLevel");
  if(!sc||!b) return true;
  /* Al zichtbaar zodra de bovenkant van de knop binnen het venster valt: dan
     zie je hem staan en heb je geen duwtje nodig. */
  return b.getBoundingClientRect().top < sc.getBoundingClientRect().bottom - 8;
}
function introWenkStart(){
  introWenkStop();
  const sc=$("#introScroll"), w=$("#introWenk");
  if(!sc||!w) return;
  wenkTimer=setTimeout(()=>{
    wenkTimer=null;
    if(!knopInBeeld() && sc.scrollTop<8) w.hidden=false;
  },2200);
}
/* Het vel weg en spelen: via de knop onderaan of een tik ernaast. */
function sluitIntro(){
  if(!introOpen) return;
  introOpen=false;
  { const vv=$("#versieVoet"); if(vv) vv.hidden=false; }
  introWenkStop();
  closeModal($("#modalIntro"));
  if(!revealed) startTimer();
  setTimeout(fitBoard,0);
}

function startLevel(raw){
  const err=validateLevel(raw);

    showScreen("game");
    paintBoard();

  }
  currentRaw=raw;
  M=buildModel(raw);
  notes=new Map(); placed=new Map();
  accused=null; accusedResult=null; revealed=false; elapsed=0;
  $("#timerVal").textContent="0:00";

}

/* ============================================================
   Hoe speel je
   ------------------------------------------------------------
   Vijf regels uitleggen in lopende tekst werkt niet: "één persoon per rij en
   per kolom" is in één blik te zien en in drie zinnen niet. Daarom staat bij
   elke regel een bordje van vier bij vier waarop het klopt, en bij elke
   handeling een tegel die laat zien wat er gebeurt.
   ============================================================ */

/* Een bordje uit een korte notatie. Per teken één vakje:
     .  vrije vloer      #  object, hier kan niemand staan
     x  kruisje          A  een persoon (hoofdletter)
     a  notitieletter (kleine letter)                        */
function helpBord(regels, opt){
  const o = opt || {};
  const pk = AssetBank.manifest.personColors || {};
  const kleur = l => (l.toUpperCase()==="V" ? (pk.victim||"#EF6F3C") : pk[l.toUpperCase()]) || "#8A93A6";
  let h = '<div class="hb'+(o.klein ? " klein" : "")+'" style="grid-template-columns:repeat('
        + regels[0].length + ',1fr)">';
  regels.forEach((rij, y) => {
    [...rij].forEach((c, x) => {
      const licht = (o.licht || []).some(p => p[0] === x && p[1] === y);
      const geb   = (o.gebied || []).find(p => p[0] === x && p[1] === y);
      const tik   = (o.tik || []).some(p => p[0] === x && p[1] === y);
      const druk  = (o.druk || []).some(p => p[0] === x && p[1] === y);
      let inner = "", cls = "hb-c" + (licht ? " licht" : "") + (geb ? " gebied " + geb[2] : "")
                + (tik ? " tik" : "") + (druk ? " druk" : "");
      if (c === "#"){ cls += " blok"; }
      else if (c === "_"){ cls += " leeg"; }
      else if (c === "x" || c === "X"){
        const vertraag = (o.golf ? x * 150 : 0);
        inner = '<b class="kruis' + (c === "X" ? " komt" : "") + '"'
              + (vertraag ? ' style="animation-delay:' + vertraag + 'ms"' : "") + '>\u00d7</b>';
      }
      else if (/[A-Z]/.test(c)){
        inner = '<i style="background:' + kleur(c) + ';color:' + letterInkt(kleur(c)) + '">' + c + '</i>';
      } else if (/[a-z]/.test(c)){
        inner = '<u style="color:' + leesbaar(kleur(c)) + '">' + c.toUpperCase() + '</u>';
      }
      h += '<span class="' + cls + '">' + inner + '</span>';
    });
  });
  return h + "</div>";
}

/* Wit of donker op deze kleur? */
function letterInkt(hex){
  return contrastMet(hex, "#FFFFFF") >= contrastMet(hex, BOARD_INK) ? "#FFFFFF" : BOARD_INK;
}

/* De rollen die in de bouwer te kiezen zijn, elk als klein portret met de
   vorm die erbij hoort. Zo herkent de speler ze straks op het bord terug. */

  }).join("") + '</div>';
}

const HELP_SETS={regels:[],spelen:[]};
let HELP_STAPPEN=HELP_SETS.regels;
let helpSet="regels";
let helpStap=0;
function zetHelpSet(k){
  if(!HELP_SETS[k]) return;
  helpSet=k; HELP_STAPPEN=HELP_SETS[k]; helpStap=0;
  $$("#helpKeuze button").forEach(b=>b.classList.toggle("aan",b.dataset.set===k));
  tekenHelp();
}
function tekenHelp(){
  const n=HELP_STAPPEN.length; if(!n) return;
  helpStap=Math.max(0,Math.min(n-1,helpStap));
  const st=HELP_STAPPEN[helpStap];
  $("#helpTeller").textContent="Stap "+(helpStap+1)+" van "+n;
  $("#helpKop").textContent=st.kop;
  $("#helpBeeld").innerHTML=st.beeld||"";
  $("#helpBeeld").hidden=!st.beeld;
  $("#helpTekst").innerHTML=st.tekst;
  $("#helpBolletjes").innerHTML=HELP_STAPPEN.map((_,i)=>'<i class="'+(i===helpStap?"aan":"")+'"></i>').join("");
  $("#helpTerug").disabled=helpStap===0;
  const laatste=helpStap===n-1;
  $("#helpVerder").textContent="Volgende";
  $("#helpVerder").disabled=laatste;
}

/* Vanuit het open radiaal menu wegslepen sluit het: je hoeft niet precies
   naast de ring te mikken. */
(function(){
  const rad=$("#radial"); if(!rad) return;
  let sx=0, sy=0, bezig=false;
  rad.addEventListener("pointerdown",e=>{ if(e.target.closest(".rbtn")) return; sx=e.clientX; sy=e.clientY; bezig=true; });
  rad.addEventListener("pointermove",e=>{
    if(!bezig) return;
    if(Math.hypot(e.clientX-sx,e.clientY-sy)>44){ bezig=false; haptic(8); closeRadial(); }
  });
  rad.addEventListener("pointerup",()=>{ bezig=false; });
  rad.addEventListener("pointercancel",()=>{ bezig=false; });
})();
/* Vegen over de schakelaar Notitie/Plaats wisselt ook; een veeg die op een
   knop eindigt mag daarna niet nog eens als klik tellen. */
(function(){
  const bar=$("#modeBar"); if(!bar) return;
  let sx=0, sy=0, bezig=false, laatsteVeeg=0;
  bar.addEventListener("pointerdown",e=>{ sx=e.clientX; sy=e.clientY; bezig=true; });
  bar.addEventListener("pointerup",e=>{
    if(!bezig) return; bezig=false;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)>=28 && Math.abs(dy)<40){ laatsteVeeg=Date.now(); setMode(dx>0?"place":"note"); if(tab!=="board") setTab("board"); haptic(10); }
  });
  bar.addEventListener("pointercancel",()=>{ bezig=false; });
  bar.addEventListener("click",e=>{ if(Date.now()-laatsteVeeg<400){ e.stopPropagation(); e.preventDefault(); } },true);
})();

/* Het omlaag slepen om het vel te sluiten is vervallen. Het hoorde bij de
   greep bovenaan, en die is weg nu het vel het hele scherm vult; bovendien
   sloeg het gebaar het dossier over, terwijl je dat juist eerst hoort te
   lezen. De weg naar binnen is de knop onderaan. */
(function(){
  const sc=$("#introScroll"), w=$("#introWenk");
  if(!sc||!w) return;
  sc.addEventListener("scroll",()=>{
    /* Zodra je zelf begint te lezen is het duwtje overbodig. */
    if(!w.hidden) w.hidden=true;
    if(wenkTimer && sc.scrollTop>8){ clearTimeout(wenkTimer); wenkTimer=null; }
  },{passive:true});
  /* Draait het scherm of klapt het toetsenbord weg, dan kan de knop alsnog in
     beeld komen; laat de wenk dan niet blijven hangen. */
  window.addEventListener("resize",()=>{ if(!w.hidden && knopInBeeld()) w.hidden=true; });
  w.addEventListener("click",()=>{
    introWenkStop();
    const doel=sc.scrollHeight-sc.clientHeight;
    try{ sc.scrollTo({top:doel,behavior:"smooth"}); }catch(_){}
    /* Niet elke browser voert smooth scrollen op een container daadwerkelijk
       uit. Kwam je niet in beweging, spring er dan gewoon heen: bij de knop
       uitkomen is belangrijker dan de animatie. */
    setTimeout(()=>{ if(sc.scrollTop<doel-4) sc.scrollTop=doel; },420);
  });
})();

/* Wissen kan niet ongedaan gemaakt worden, dus er komt altijd een vraag
   tussen. Eerst tellen wat er weggaat, dan pas vragen. */
function bevestig(titel,tekst,doen){
  $("#bevestigTitel").textContent=titel;
  $("#bevestigTekst").textContent=tekst;
  const oud=$("#bevestigJa");
  const nieuw=oud.cloneNode(true);
  oud.parentNode.replaceChild(nieuw,oud);
  nieuw.addEventListener("click",()=>{ closeModal($("#modalBevestig")); doen(); });
  openModal("#modalBevestig");
}
$("#btnWisKruisjes").addEventListener("click",()=>{
  let n=0; notes.forEach(x=>{ if(x.cross) n++; });
  if(!n){ toast("Er staan geen kruisjes."); return; }
  bevestig("Kruisjes wissen?", n===1?"Het kruisje op het bord gaat weg.":"Alle "+n+" kruisjes op het bord gaan weg.",()=>{
    notes.forEach(x=>{ x.cross=false; });
    paintBoard(); haptic(12); toast(n===1?"1 kruisje gewist.":n+" kruisjes gewist.");
  });
});
$("#btnWisLetters").addEventListener("click",()=>{
  let n=0; notes.forEach(x=>{ if(x.marks&&x.marks.size) n+=x.marks.size; });
  if(!n){ toast("Er staan geen letters."); return; }
  bevestig("Letters wissen?", n===1?"De letter die je genoteerd hebt gaat weg.":"Alle "+n+" genoteerde letters gaan weg.",()=>{
    notes.forEach(x=>{ if(x.marks) x.marks.clear(); });
    paintBoard(); haptic(12); toast(n===1?"1 letter gewist.":n+" letters gewist.");
  });
});
$("#btnRestart").addEventListener("click",()=>{
  if(placed.size===0 && notes.size===0){ toast("Er is nog niets om te wissen."); return; }
  bevestig("Opnieuw beginnen?","Alle letters, kruisjes en pionnen gaan weg. Je begint deze zaak met een leeg bord.",()=>{
    closeModal($("#modalSettings")); restart();
  });
});
