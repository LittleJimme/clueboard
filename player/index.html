  font:800 12px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;text-shadow:none;
}
body.in-game .view-switch:active{transform:translateY(1px);box-shadow:none}
body.in-game .vs-ic{width:18px;height:18px;display:flex}
body.in-game .vs-ic svg{width:100%;height:100%}
body.in-game .vs-swap{width:13px;height:13px;display:flex;opacity:.55;margin-left:-1px}
body.in-game .vs-swap svg{width:100%;height:100%}
body.in-game .mode-switch button .lbl{display:none}
body.in-game .mode-switch{max-width:none;width:auto}
body.in-game .mode-switch button{padding:0 19px;height:44px;min-width:62px}
body.in-game .mode-switch button svg{width:20px;height:20px}
body.in-game.op-regels .mode-switch{opacity:.45;transition:opacity .2s}
body.in-game .mode-switch{transition:opacity .2s}
/* Te smal voor woorden: dan alleen de pictogrammen. */
@media (max-width:360px){
  body.in-game .view-switch .vs-txt{display:none}
  body.in-game .view-switch{padding:0 12px;gap:6px;min-width:0}
}

/* ── Panelen ── */
body.in-game .sheet{background:var(--kaart);border:1px solid var(--lijn);color:var(--inkt);box-shadow:var(--sch2)}
body.in-game .sheet h3{font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--inkt);letter-spacing:0}
body.in-game .sheet p,body.in-game .sheet ol,body.in-game .set-uitleg{color:var(--inkt-2)}
body.in-game .set-kop{margin:14px 2px 7px;font:800 10.5px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dof)}
body.in-game .set-kop:first-of-type{margin-top:2px}
body.in-game .set-row,body.in-game .vis-row{
  background:var(--kaart-2);border:1px solid var(--lijn);color:var(--inkt);box-shadow:none;font-size:13.5px;
}
body.in-game .set-row{min-height:50px;padding:9px 12px;margin-bottom:6px}
body.in-game .set-hoofd{
  width:100%;height:48px;margin:2px 0 12px;border-radius:999px;background:var(--goud);color:var(--goud-op);border:1px solid var(--goud-diep);
  display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:18px;box-shadow:var(--sch1)}
body.in-game .set-hoofd .vraag-ic{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:22px;line-height:1}
body.in-game .set-duo{display:grid;grid-template-columns:1fr 1fr;gap:6px}
body.in-game .set-duo .set-row{min-height:46px;padding:8px 9px;margin:0;gap:7px}
body.in-game .set-duo .set-row .set-tekst b{font-size:13px}
body.in-game .set-duo .schuif{width:32px;height:19px}
body.in-game .set-duo .schuif i{width:15px;height:15px}
/* De basisregel verschuift het bolletje met left; hier alleen die waarde
   bijstellen, niet er nog een transform overheen leggen. */
body.in-game .set-duo .set-row[aria-pressed="true"] .schuif i{left:15px;transform:none}
body.in-game .set-acties{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
body.in-game .set-actie{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:62px;border-radius:12px;
  background:var(--kaart-2);border:1px solid var(--lijn);color:var(--inkt);font:700 11.5px var(--font-ui)}
body.in-game .set-actie .ic{width:20px;height:20px;color:var(--inkt-2)}
body.in-game .set-actie .ic svg{width:100%;height:100%}
body.in-game .set-actie.danger{color:#E58472;border-color:rgba(229,132,114,.35)}
body.in-game .set-actie.danger .ic{color:#E58472}
body.in-game #modalSettings .sheet{padding:10px 16px calc(16px + env(safe-area-inset-bottom));max-height:86vh}
body.in-game #modalSettings .sheet-kop h3{font-size:22px}
body.in-game .set-row .set-tekst{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left}
body.in-game .set-row .set-tekst b{font-size:14px;font-weight:800;color:inherit}
body.in-game .set-row .set-tekst small{font-size:12px;line-height:1.35;font-weight:600;color:var(--dof)}
body.in-game .set-row .vraag-ic{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:19px;color:var(--goud)}
body.in-game .vis-raster{display:grid;grid-template-columns:1fr 1fr;gap:6px}
body.in-game .vis-raster .vis-row{margin:0;min-height:40px;font-size:12.5px}
body.in-game .vis-raster .vis-row.breed{grid-column:1 / -1}
body.in-game .vis-row{border:1px solid var(--goud-lijn);background:var(--goud-zacht);transition:background .15s,border-color .15s,opacity .15s}
body.in-game .vis-row .oog{color:var(--goud)}
/* Uit is duidelijk zonder het oogje te hoeven lezen: vlak weg, streepjesrand,
   naam doorgehaald. */
body.in-game .vis-row.uit{background:none;border:1px dashed var(--lijn);opacity:.75}
body.in-game .vis-row.uit>span:first-child{text-decoration:line-through;text-decoration-thickness:1px}
body.in-game .vis-row.uit .oog,body.in-game .vis-row.uit>span:first-child{color:var(--dof)}
body.in-game .set-row.danger{color:#E58472;border-color:rgba(229,132,114,.35)}
body.in-game .schuif{background:var(--lijn)}
body.in-game .set-row[aria-pressed="true"] .schuif{background:var(--goud)}
body.in-game .schuif i{background:var(--kaart)}
body.in-game .thema-keuze{display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--kaart-2);border:1px solid var(--lijn);margin-bottom:6px}
body.in-game .thema-keuze button{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;
  border:0;border-radius:999px;background:none;color:var(--dof);font:700 12.5px var(--font-ui);letter-spacing:.04em;
}
body.in-game .thema-keuze button svg{width:16px;height:16px}
body.in-game .thema-keuze button.aan{background:var(--inkt);color:var(--grond)}
body.in-game .modal .backdrop{background:rgba(0,0,0,.42)}
/* Meldingen en de hintvraag: hetzelfde papier, dezelfde gouden knop als de
   rest van het spel. Het oude zegel is weg. */
body.in-game .sheet.melding{max-width:380px;padding:24px 22px 20px;border-radius:22px}
body.in-game .sheet.melding .melding-beeld{
  width:58px;height:58px;margin:0 auto 12px;background:var(--goud-zacht);border:1px solid var(--goud-lijn);border-radius:999px;
  display:flex;align-items:center;justify-content:center;color:var(--goud);filter:none}
body.in-game .sheet.melding .melding-beeld svg{width:26px;height:26px}
body.in-game .sheet.melding h3{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0 0 8px}
body.in-game .sheet.melding p{font-size:15px;line-height:1.55;color:var(--inkt-2)}
body.in-game .sheet.melding p b{color:var(--inkt);font-weight:800}
body.in-game .sheet.melding .row{margin-top:16px;gap:10px}
body.in-game .modal:not(.sheet-modal) .btn{
  background:var(--goud);color:var(--goud-op);border:1px solid var(--goud-diep);border-radius:999px;
  font-family:var(--font-display);font-weight:600;font-size:16.5px;letter-spacing:0;height:46px;padding:0 18px;
  box-shadow:var(--sch1);text-shadow:none;flex:1}
body.in-game .modal:not(.sheet-modal) .btn.ghost{background:var(--kaart-2);color:var(--inkt);border:1px solid var(--lijn);box-shadow:none}
body.in-game .modal:not(.sheet-modal) .btn:active{transform:translateY(1px);box-shadow:none}
/* De skin legt op elk vak een kamerwaas in ::after; het geselecteerde vak
   moet daar bovenuit komen, dus hier met meer gewicht. */
body.in-game .tile.selected::after{
  opacity:1;border:1.5px solid var(--goud);background:rgba(255,236,190,.5);
  box-shadow:0 0 0 2px rgba(201,147,47,.32),0 0 18px 4px rgba(201,147,47,.42),inset 0 0 14px rgba(255,255,255,.45);
}
/* Het gekozen vakje: een dunne gouden lijn, geen dikke rand of gloed. */
body.in-game .tile.selected::after{border:1px solid rgba(201,147,47,.75);background:rgba(255,236,190,.28);box-shadow:none}
body.in-game #radial .bd-kader{border:2px solid var(--goud);border-radius:9px;
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 14px 2px rgba(201,147,47,.3)}
/* In de ring draagt elke knop zijn kleur op de rand én in het naamplaatje. */
body.in-game .rbtn{border:3px solid var(--pc);box-shadow:0 0 0 2px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.4)}
body.in-game .rbtn .lbl{
  background:var(--pc);color:var(--pc-tekst,#fff);padding:3px 9px;border-radius:999px;text-shadow:none;
  font-size:var(--rlbl,13px);font-weight:800;letter-spacing:.01em;bottom:calc(var(--rbtn,68px)*-.58);
  box-shadow:0 2px 6px rgba(0,0,0,.4)}
body.in-game .rbtn.taken .lbl{opacity:.85}
body.in-game .radial-obj{
  position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:10px;z-index:2;pointer-events:none;
  padding:9px 18px 9px 13px;border-radius:16px;background:var(--kaart);color:var(--inkt);border:1px solid var(--lijn);
  box-shadow:var(--sch2);white-space:nowrap;max-width:92vw;
  animation:objIn .22s cubic-bezier(.2,.8,.3,1) both}
@keyframes objIn{from{opacity:0;transform:translate(-50%,-42%)}to{opacity:1;transform:translate(-50%,-50%)}}
body.in-game .radial-obj .ic{width:26px;height:26px;color:var(--inkt-2)}
body.in-game .radial-obj .ic svg{width:100%;height:100%}
body.in-game .radial-obj .wat{display:flex;flex-direction:column;line-height:1.12;min-width:0}
body.in-game .radial-obj .wat b{font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:0;color:var(--inkt)}
body.in-game .radial-obj .wat i{font-style:normal;margin-top:2px;font:800 9.5px var(--font-ui);
  letter-spacing:.14em;text-transform:uppercase;color:var(--dof)}
#grid .tile{touch-action:none}
/* Waar niemand kan staan ligt een lichte donkere waas; net iets rustiger
   dan in het Lab, zodat het object zelf de aandacht houdt. */
body.in-game .blockmask{background:rgba(29,20,16,.2)}
body.in-game .rbtn.util{background:var(--goud);color:var(--goud-op);border:1px solid var(--goud-diep);box-shadow:var(--sch2)}
body.in-game .rbtn.util.remove{background:#C8503F;color:#fff;border-color:#8F3226}
body.in-game .rbtn.util[disabled]{opacity:.35}
/* Instellingen klappen van boven open, onder de kop; de legenda komt van
   onder, bij zijn eigen knop. */
body.in-game .sheet-modal.van-boven{align-items:flex-start;top:var(--kop-h,64px);bottom:0}
body.in-game .sheet-modal.van-boven .sheet{border-radius:0 0 22px 22px;transform:translateY(-100%);box-shadow:0 10px 40px rgba(0,0,0,.3)}
body.in-game .sheet-modal.van-boven.open .sheet{transform:translateY(0)}
body.in-game .sheet-modal .sheet{max-width:560px}
/* Geen zichtbaarheids-overgangen meer (die gaven een knipper): het paneel
   staat er of niet, en schuift met één beweging binnen. De legenda komt van
   onder en dekt de voetbalk; de instellingen komen van boven. */
body.in-game .sheet-modal{display:none;visibility:visible;transition:none;bottom:0}
body.in-game .sheet-modal.open{display:flex}
body.in-game .sheet-modal .sheet{transform:none;transition:none}
body.in-game .sheet-modal.open .sheet{animation:sheetOmhoog .3s cubic-bezier(.2,.8,.3,1) both}
body.in-game .sheet-modal.van-boven.open .sheet{animation:sheetOmlaag .3s cubic-bezier(.2,.8,.3,1) both}
@keyframes sheetOmhoog{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetOmlaag{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
body.in-game #modalLegend .sheet{max-height:82vh;padding:10px 18px calc(16px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0}
.sheet-greep{width:38px;height:4px;border-radius:2px;background:var(--lijn);margin:0 auto 10px}
/* Een paneel dat van boven komt heeft zijn greep onderaan. */
body.in-game .sheet-modal.van-boven .sheet-greep{order:9;margin:12px auto 0}
body.in-game .sheet-modal.van-boven .sheet{display:flex;flex-direction:column}
.sheet-kop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sheet-kop h3{margin:0}
.sheet-sluit{width:34px;height:34px;border-radius:999px;border:1px solid var(--lijn);background:var(--kaart-2);color:var(--dof);
  display:flex;align-items:center;justify-content:center;padding:0}
.sheet-sluit svg{width:16px;height:16px}
body.in-game .legend-sep{color:var(--dof);margin:16px 0 8px}
body.in-game .legend-row{border-bottom:1px solid var(--lijn-zacht);padding:9px 0}
body.in-game .legend-row .name{color:var(--inkt);font-family:var(--font-display);font-weight:600;font-size:16px}
body.in-game .legend-row .badge.rol{border-color:transparent}
body.in-game .legend-obj .name{color:var(--inkt-2);font-weight:700}
body.in-game .legend-objgrid{gap:8px 4px}

/* ── Regels: leesbaar en op orde ── */
/* Geen raster maar een gewone kolom: het raster gaf de rijen de
   minimumhoogte van de kaarten in plaats van hun inhoud, waardoor de
   bordregelkaart dichtviel en de kaarten over elkaar heen schoven. */
body.in-game #cluesList{padding:10px 12px 22px;gap:7px;display:flex;flex-direction:column;align-items:stretch}
body.in-game #cluesList>*{flex:0 0 auto}
/* Compact: portret links met de naam eronder, de regel rechts, en rechts
   een dun pijltje dat zegt dat er meer achter zit. Weinig lucht, zodat een
   bord met acht personen zonder scrollen te overzien is. */
body.in-game .clue-card{flex-direction:row;align-items:center;text-align:left;gap:8px;
  padding:9px 30px 9px 8px;border-left:4px solid var(--pc,var(--lijn));border-radius:12px;min-height:76px;
  transition:transform .22s cubic-bezier(.2,.8,.3,1);touch-action:pan-y}
body.in-game .clue-card:hover{transform:none;box-shadow:var(--sch1)}
body.in-game .clue-card:active{transform:none}
body.in-game .clue-card.sleept{transition:none}
body.in-game .clue-card.met-merk .lijf{padding-top:16px}
body.in-game .clue-card::before{display:none}
body.in-game .clue-card .kop{padding:0;margin:0;flex:0 0 60px;width:60px;display:flex;justify-content:center;align-items:center}
body.in-game .clue-card .lijf .name{font-size:14px;line-height:1.15;text-align:left;word-break:break-word}

body.in-game .clue-card .lijf{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:2px 0}
body.in-game .clue-card .tag{margin:0}
body.in-game .clue-card .txt{margin-top:2px}
body.in-game .clue-card .notitie-merk{top:6px;right:26px;left:auto;bottom:auto;padding:1px 5px 1px 3px}
body.in-game .clue-card .memo-merk{position:absolute;top:6px;right:26px;z-index:2;width:18px;height:18px;border-radius:999px;
  background:var(--goud);color:var(--goud-op);display:flex;align-items:center;justify-content:center}
body.in-game .clue-card .memo-merk .ic{width:11px;height:11px}
body.in-game .clue-card .memo-merk .ic svg{width:100%;height:100%}
body.in-game .clue-card .memo-merk + .notitie-merk,body.in-game .clue-card .notitie-merk + .memo-merk{right:50px}
body.in-game .clue-card .tick{top:8px;left:52px;right:auto;bottom:auto;z-index:2;width:17px;height:17px}
body.in-game .clue-card .info{position:absolute;right:0;top:0;bottom:0;width:30px;border:0;border-radius:0 12px 12px 0;
  color:var(--dof);opacity:.6;display:flex;align-items:center;justify-content:center;background:none;padding:0;transition:opacity .15s}
body.in-game .clue-card .info:active{opacity:1}
body.in-game .clue-card.open-klaar .info{opacity:1;color:var(--goud)}
body.in-game .clue-card.open-klaar{box-shadow:var(--sch2)}
body.in-game .clue-card .info svg{width:14px;height:14px;transform:rotate(-90deg)}
body.in-game .clue-card.board{padding-right:30px;min-height:0;align-items:flex-start}
body.in-game .clue-card.board .info{border-radius:0 12px 12px 0}
/* Bordregels springen eruit: in het licht dieper goud, in het donker lichter. */
body.in-game .clue-card.board{background:rgba(201,147,47,.22);border-color:rgba(201,147,47,.55)}
html[data-thema="licht"] body.in-game .clue-card.board{background:rgba(145,96,8,.14);border-color:rgba(145,96,8,.4)}
body.in-game .clue-card.board .txt{color:var(--inkt)}
/* Persoonsvenster: een volle pagina met portret, achtergrond, de regels en
   een plattegrondje dat aanwijst waar hij staat. */
body.in-game #modalClue .sheet{max-width:460px;max-height:88vh;padding:18px 18px 16px;text-align:left;overflow:auto}
body.in-game #modalClue .sheet::-webkit-scrollbar{width:0}
.pd-sluit{position:absolute;top:12px;right:12px;z-index:2}
.pd-label{margin:16px 0 6px;text-align:left;font:800 10px var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--dof)}
.pd-schild{flex:0 0 auto;width:56px;height:56px;display:flex;align-items:center;justify-content:center}
.pd-schild .ic{width:40px;height:40px;color:var(--goud)}
.pd-schild .ic svg{width:100%;height:100%}
/* Voetnoot: het plattegrondje klein, met de plek ernaast. Een gimmick die
   fijn is om even te zien, niet iets om mee te werken. */
.pd-voet{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--lijn-zacht)}
.pd-plek-tekst b{display:block;font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.15;color:var(--inkt)}
.pd-plek-tekst span{display:block;margin-top:2px;font:700 11.5px var(--font-ui);color:var(--dof)}
.mini-bord{display:grid;gap:1.5px;flex:0 0 auto;width:72px}
.mb-c{position:relative;aspect-ratio:1;border-radius:3px;background:var(--kaart-2);box-shadow:inset 0 0 0 1px rgba(120,100,70,.16);
  display:flex;align-items:center;justify-content:center;font:800 7.5px var(--font-ui)}
.mb-c.leeg{background:none!important;box-shadow:none}
/* Een geblokkeerd vakje houdt zijn kamerkleur, maar valt terug: daar hoeft
   niemand meer te kijken. */
.mb-c.blok{opacity:.45}
.mb-c.blok::before{content:"";position:absolute;inset:22%;border-radius:2px;background:var(--dof);opacity:.85}
.mb-c.hier,.mb-c.noot{box-shadow:inset 0 0 0 1px rgba(120,100,70,.16)}
.mb-c.noot::after{content:"";width:34%;height:34%;border-radius:50%;background:var(--goud);opacity:.85}
.mb-c.hier{background:var(--goud)!important;color:var(--goud-op);opacity:1;z-index:1;box-shadow:0 0 0 1.5px var(--goud)}
.pd-kop{display:flex;align-items:center;gap:14px;padding:4px 40px 0 0}
.pd-portret{flex:0 0 auto;display:flex;justify-content:center;padding:10px 6px 10px 2px}
.pd-wie{flex:1;min-width:0}
.pd-naam{margin:0;font-family:var(--font-display);font-weight:600;font-size:31px;line-height:1.05;letter-spacing:-.01em;color:var(--inkt)}
.pd-rol{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.pd-omschrijving{margin:10px 0 0;color:var(--inkt-2);font-size:14px;line-height:1.55}
.pd-hint{margin:8px 0 0;display:inline-flex;align-items:flex-start;gap:6px;padding:0;border:0;background:none;
  color:var(--inkt-2);font:600 12px var(--font-ui);line-height:1.4;max-width:100%;text-align:left}
.pd-hint .ic{width:14px;height:14px;color:var(--goud);flex:0 0 auto;margin-top:1px}
.pd-hint .ic svg{width:100%;height:100%}
.pd-regels{display:flex;flex-direction:column;gap:6px;text-align:left}
.pd-regel{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--kaart-2);border:1px solid var(--lijn);
  font-size:16px;line-height:1.45;color:var(--inkt);font-weight:500}
.pd-regel .ic{width:17px;height:17px;color:var(--goud);margin-top:3px;flex:0 0 auto}
.pd-notitie{
  width:100%;min-height:44px;height:44px;resize:none;overflow:hidden;padding:11px 12px;border-radius:12px;border:1px solid var(--lijn);
  background:var(--kaart-2);color:var(--inkt);font:500 14.5px/1.45 var(--font-ui);
  -webkit-user-select:text;user-select:text;outline:none;transition:border-color .15s;
}
.pd-notitie:focus{border-color:var(--goud)}
.pd-notitie::placeholder{color:var(--dof);opacity:.8}
.pd-regel .ic svg{width:100%;height:100%}
.pd-regel.leeg{color:var(--dof);font-style:italic}
body.in-game #modalClue .row{margin-top:14px}
body.in-game #modalClue .btn{background:var(--goud);color:var(--goud-op);border:1px solid var(--goud-diep);border-radius:999px;
  font-family:var(--font-display);font-weight:600;font-size:17px;height:46px;box-shadow:var(--sch1);text-shadow:none;width:100%}
body.in-game .clue-card.board .name{display:flex;align-items:center;gap:6px}
body.in-game .clue-card.board .name .ic{width:15px;height:15px;color:var(--goud)}
body.in-game .clue-card.board .name .ic svg{width:100%;height:100%}
body.in-game .clue-row.victim{margin-top:4px;padding:9px 12px;border-left:4px solid #E58472;border-radius:12px;gap:10px;background:var(--kaart)}
body.in-game .clue-row.victim .av{width:38px;height:38px;border-radius:10px}
body.in-game .clue-row.victim .txt{font-size:14.5px;margin-top:2px}
body.in-game .clue-row .who b{font-size:16px}
body.in-game .badge.victim{background:rgba(229,132,114,.14);border-color:rgba(229,132,114,.4);color:#E58472}
/* Een gekleurde naam op een donkere kaart leest slecht; in het donker
   blijft de kleur bij de streep en het portret, de tekst wordt inkt. */
html:not([data-thema="licht"]) body.in-game .txt b.pn{color:var(--inkt)!important}
body.in-game .clue-card,body.in-game .clue-row{
  background:var(--kaart);border:1px solid var(--lijn);box-shadow:var(--sch1);color:var(--inkt);
}
body.in-game .clue-card{border-left:4px solid var(--pc,var(--lijn))}
body.in-game .clue-card.board{border-left:4px solid var(--goud)}
body.in-game .clue-row.victim{border-left:4px solid #E58472}
body.in-game .clue-card .name{font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.1;letter-spacing:0;color:var(--inkt)}
body.in-game .clue-card .txt,body.in-game .clue-row .txt{font-size:15px;line-height:1.42;color:var(--inkt-2);font-weight:500;margin-top:3px}
body.in-game .clue-card .txt.meer .regel + .regel{border-top:1px solid var(--lijn)}
body.in-game .clue-card.done,body.in-game .clue-row.done{background:var(--kaart-2);opacity:.7}
body.in-game .clue-card.victim,body.in-game .clue-row.victim{border-color:rgba(224,112,90,.45)}
body.in-game .clue-row .who b{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--inkt)}
body.in-game .clue-card .txt b,body.in-game .clue-row .txt b,body.in-game .sheet p b{
  color:var(--inkt);background:linear-gradient(180deg,rgba(0,0,0,0) 60%,var(--goud-zacht) 60%)}
/* De bordregels: één duidelijk blok bovenaan, over de volle breedte, met het
   goud als teken dat dit over het hele bord gaat. */
body.in-game .clue-card.board{
  grid-column:1 / -1;flex-direction:column;align-items:flex-start;text-align:left;padding:10px 30px 8px 12px;
  background:var(--goud-zacht);border:1px solid var(--goud-lijn);border-left:4px solid var(--goud);
}
body.in-game .clue-card.board .lijf{padding-top:0;gap:0;width:100%}
body.in-game .clue-card.board::before{background:var(--goud)}
body.in-game .clue-card.board .kop{display:none}
body.in-game .clue-card.board .name{
  color:var(--goud);font:800 11px var(--font-ui);letter-spacing:.14em;text-transform:uppercase}
body.in-game .clue-card.board .txt{margin-top:6px;font-size:15.5px;color:var(--inkt);width:100%}
body.in-game .clue-card.board .txt .regel{display:block;padding:4px 0 4px 15px;position:relative}
body.in-game .clue-card.board .txt .regel.algemeen{color:var(--dof);font-size:13px;font-weight:600}
body.in-game .clue-card.board .txt .regel.algemeen b{color:var(--dof);background:none;font-weight:800}
body.in-game .clue-card.board .txt .regel.algemeen::before{background:var(--dof);opacity:.6}
body.in-game .clue-card.board .txt .regel::before{
  content:"";position:absolute;left:0;top:13px;width:7px;height:7px;border-radius:50%;background:var(--goud)}
body.in-game .clue-card.board .txt.meer .regel + .regel{border-top:1px solid var(--goud-lijn);margin-top:0;padding-top:6px}
/* ── Uitleg in stappen ── */
#modalHelp .sheet{height:min(640px,90vh);display:flex;flex-direction:column;position:relative}
.stap-vel .sluit{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:999px;border:1px solid var(--lijn);
  background:var(--kaart-2);color:var(--dof);font-size:14px;display:flex;align-items:center;justify-content:center;padding:0}
.stap-teller{flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dof);margin-bottom:6px}
#helpKop{flex:0 0 auto;margin:0 36px 10px 0;font-size:26px}
.help-keuze{flex:0 0 auto;display:flex;gap:4px;padding:3px;margin:0 40px 12px 0;border-radius:999px;
  background:var(--kaart-2);border:1px solid var(--lijn)}
.help-keuze button{flex:1;height:32px;border-radius:999px;color:var(--dof);font:700 12px var(--font-ui);
  letter-spacing:.04em;white-space:nowrap}
.help-keuze button.aan{background:var(--inkt);color:var(--grond)}
.stap-beeld{flex:0 0 210px;display:flex;align-items:center;justify-content:center;
  background:var(--kaart-2);border:1px solid var(--lijn-zacht);border-radius:16px;padding:12px;margin-bottom:14px;overflow:hidden}
.stap-beeld[hidden]{display:none}
.stap-beeld>*{max-width:100%;max-height:100%}
.stap-tekst{flex:1;min-height:0;overflow:auto;color:var(--inkt-2);font-size:14.5px;line-height:1.6}
.stap-tekst p{margin:0 0 9px}
.stap-tekst p:last-child{margin-bottom:0}
.stap-tekst b{color:var(--inkt)}
.stap-tekst .help-lijst{font-size:14px;line-height:1.6;color:var(--inkt-2)}
.stap-voet{flex:0 0 auto;display:flex;align-items:center;gap:8px;margin-top:14px}
.stap-bolletjes{display:flex;flex-wrap:wrap;gap:4px;flex:1;justify-content:center;min-width:0}
.stap-bolletjes i{width:6px;height:6px;border-radius:50%;background:var(--lijn);font-style:normal;transition:background .2s;cursor:pointer}
.stap-bolletjes i.aan{background:var(--goud)}
.stap-voet .btn{padding:9px 14px;font-size:14px;white-space:nowrap;flex:0 0 auto}
.stap-voet #helpTerug{width:40px;padding:0;font-size:18px;line-height:1}
.stap-voet .btn[disabled]{opacity:.35}
body.in-game .stap-voet .btn,body.in-game #modalIntro .btn,body.in-end .btn{
  background:var(--goud);color:var(--goud-op);border:1px solid var(--goud-diep);box-shadow:var(--sch1);text-shadow:none;
  font-family:var(--font-display);font-weight:600;letter-spacing:0;border-radius:999px}
body.in-game .stap-voet .btn.ghost,body.in-end .btn.ghost{background:var(--kaart-2);color:var(--inkt);border:1px solid var(--lijn)}
body.in-game .stap-voet .btn:active,body.in-game #modalIntro .btn:active,body.in-end .btn:active{transform:translateY(1px);box-shadow:none}

/* ── Introscherm van een level, in de stijl van het menu ── */
body.laden{background:var(--grond)}
body.laden .screen{visibility:hidden}
body.in-game #screen-game.active{animation:schermIn .2s ease-out both}
@keyframes schermIn{from{opacity:0}to{opacity:1}}
body.in-end{background:var(--grond);color:var(--inkt)}
body.in-end::after{opacity:.045}
/* Titel en zwaarte staan vast; de rest schuift eronder door, met een zacht
   verloop aan de bovenkant in plaats van een harde snede. */

.uitslag-merk{text-align:center;font-family:var(--font-display);font-weight:600;font-size:14px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--dof)}
/* De rolvorm zegt al wat iemand is en de regel erboven telt de rollen; de
   banderol eronder zou het een derde keer zeggen. */

/* ── Het introvel over het bord ── */
body.in-game #modalIntro{top:0;bottom:0}
body.in-game #modalIntro .backdrop{background:rgba(0,0,0,.5)}
body.in-game #modalIntro .sheet{
  height:100%;max-height:none;border-radius:0;padding:calc(10px + env(safe-area-inset-top)) 20px calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;will-change:transform;box-shadow:none;position:relative}
body.in-game #modalIntro .intro-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;text-align:center;padding:2px 0 6px;
  /* De schuifbalk zou dwars door de cover lopen; het duwtje onderin zegt al
     dat er meer is. */
  scrollbar-width:none;-ms-overflow-style:none;
  /* De rest van het dossier komt door een verloop in beeld in plaats van
     langs een harde rand. De knop krijgt hieronder extra ruimte mee, zodat
     hij bij volledig doorscrollen bóven dit verloop uitkomt. */
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 84px),transparent);
  mask-image:linear-gradient(to bottom,#000 calc(100% - 84px),transparent)}
body.in-game #modalIntro .intro-scroll::-webkit-scrollbar{width:0;height:0;display:none}
/* ── De cover ──
   De eerste schermvulling draagt alleen de zaak zelf: nummer, titel, niveau
   en de intro. Het blok staat laag, met lucht erboven, zoals een titelpagina.
   Alles wat je nodig hebt om te spelen begint pas ná de haarlijn, dus je
   scrolt bewust door van "welke zaak is dit" naar "wat weet ik". */
body.in-game #modalIntro .intro-kop{
  box-sizing:border-box;position:relative;
  /* Weer een volle schermvulling: voor het scrollen hoor je alleen de titel
     en de ondertitel te zien. De ruimte die daardoor onder de tekst overblijft
     is geen gat meer maar draagt het bordwatermerk. */
  min-height:100%;
  /* Geen volle schermvulling met het blok onderaan meer: dat zette de titel
     te laag en liet bovendien een gat vallen tussen de tekst en de haarlijn.
     Nu bepaalt alleen de bovenruimte de plek, en volgt de rest er direct op.
     Meeschalend met de schermhoogte, want 140px is op een korte telefoon
     zonde van de ruimte. */
  padding:clamp(36px,17vh,132px) 0 clamp(28px,6vh,52px);
  /* Een heel zachte warme gloed achter de titel, zodat de rust eromheen als
     titelpagina leest en niet als een gat. */
  background:radial-gradient(ellipse 82% 48% at 50% 44%,rgba(201,147,47,.10),transparent 72%);
}
html[data-thema="licht"] body.in-game #modalIntro .intro-kop{
  background:radial-gradient(ellipse 82% 48% at 50% 44%,rgba(145,96,8,.07),transparent 72%);
}
/* De terugknop zweeft linksboven op het vel. Absoluut geplaatste kinderen
   rekenen vanaf de rand van het vel, niet vanaf zijn padding, dus de
   veilige zone van de telefoon moet er hier zelf bij. */
body.in-game #modalIntro .intro-terug{
  position:absolute;z-index:4;
  /* Exact de plek en maat van btnGameBack in de spelkop (14 / 17, 40x40),
     zodat de knop niet verspringt zodra het introvel sluit. Deze knop hangt
     aan #modalIntro zelf, dat het hele scherm beslaat. */
  left:14px;top:calc(17px + env(safe-area-inset-top));
  width:40px;height:40px;border-radius:999px;padding:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--kaart-2);color:var(--inkt);border:1px solid var(--lijn);
  box-shadow:var(--sch1);
}
body.in-game #modalIntro .intro-terug .ic,
body.in-game #modalIntro .intro-terug svg{width:19px;height:19px}
body.in-game #modalIntro .intro-terug:active{transform:translateY(1px);box-shadow:none}
/* De plattegrond van het level, heel licht achter de titel. Geen kamerkleuren
   hier: alleen de vorm. Vakjes waar niemand op kan staan zijn juist donkerder
   dan de ondergrond, zodat de vorm van het bord leesbaar blijft. Veel zwakker
   dan het kaartje verderop, dat wél de kamers toont. */
body.in-game #modalIntro .intro-watermerk{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  z-index:0;pointer-events:none;width:min(88%,var(--wm-breedte,420px));
}
/* Het dossier schuift over de plattegrond heen. */
body.in-game #modalIntro .intro-scroll{position:relative;z-index:1}
.wm-kaart{display:grid;gap:4px;width:100%}
/* Drie soorten vakjes, van donker naar licht:
     .blok  niet bezetbaar, donkerder dan de ondergrond
     (basis) vrije vloer, waar iemand kan staan
     .op    een object waar je juist wél op kunt staan, een tikje lichter
   En daarbuiten .leeg: alleen de omtrek, zodat het raster doorloopt maar de
   vorm van het level het enige is dat vult. */
.wm-c{aspect-ratio:1;border-radius:4px;background:rgba(240,232,226,.05)}
.wm-c.op{background:rgba(240,232,226,.11)}
.wm-c.blok{background:rgba(0,0,0,.2)}
.wm-c.leeg{background:none;box-shadow:inset 0 0 0 1px rgba(240,232,226,.05)}
html[data-thema="licht"] .wm-c{background:rgba(38,36,29,.038)}
html[data-thema="licht"] .wm-c.op{background:rgba(38,36,29,.075)}
html[data-thema="licht"] .wm-c.blok{background:rgba(38,36,29,.14)}
/* Moet mee in het thema: html[data-thema] .wm-c weegt zwaarder dan .wm-c.leeg,
   dus zonder deze regel kleurden de vakjes buiten het bord alsnog en verloor
   de plattegrond zijn vorm. */
html[data-thema="licht"] .wm-c.leeg{background:none;box-shadow:inset 0 0 0 1px rgba(38,36,29,.04)}
.intro-zaak{font:800 12px var(--font-ui);letter-spacing:.28em;text-transform:uppercase;color:var(--goud);margin-bottom:14px;min-height:14px}
.intro-titel{margin:0;font-family:var(--font-display);font-weight:600;font-size:clamp(34px,10vw,54px);line-height:1.04;letter-spacing:-.015em;color:var(--inkt);text-wrap:balance}
.intro-graad{display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:18px}
.intro-graad .stippen{display:inline-flex;gap:5px}
.intro-graad .stippen i{width:7px;height:7px;border-radius:50%;background:var(--lijn);font-style:normal}
.intro-graad .stippen i.aan{background:var(--goud)}
.intro-graad .woord{font:800 11px var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--goud)}
/* Taps toelopend in plaats van een blokje: leest als een pennenstreek. */
.intro-scheiding{width:64px;height:2px;margin:26px auto 22px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--goud) 28%,var(--goud) 72%,transparent)}
/* Een em-maat alleen helpt niet op een telefoon: 34em is daar breder dan het
   scherm, dus liep de tekst alsnog van rand tot rand. De procentmaat knijpt
   hem ook op een smal scherm in, zodat er marge overblijft. */
/* p.intro-tekst en niet .intro-tekst: de algemene regel .sheet p weegt
   zwaarder en zette hier zowel margin:0 (waardoor het blok links bleef staan
   in plaats van te centreren) als font-size:14px. */
.sheet p.intro-tekst{
  margin:0 auto;max-width:min(30em,86%);
  color:var(--inkt-2);
  /* Een schreefletter leest als lopende tekst in plaats van als interface;
     de intro is altijd maar een paar zinnen. */
  font-family:var(--font-display);font-weight:500;
  font-size:20px;line-height:1.5;letter-spacing:0;
}
body.in-game #modalIntro .intro-dossier{
  position:relative;
  /* Doorzichtig aan de bovenkant, daaronder de kaartkleur: de plattegrond
     vervaagt zo onder het dossier in plaats van langs een rand te stoppen. */
  background:linear-gradient(to bottom,transparent 0,var(--kaart) 96px);
}
/* De overgang naar het dossier: één haarlijn die aan beide kanten wegvalt,
   zodat hij scheidt zonder een streep door de bladzijde te trekken. */
.intro-breuk{height:1px;margin:0 0 28px;
  background:linear-gradient(90deg,transparent,var(--lijn),transparent)}
/* Ligt de telefoon plat of is het scherm laag, dan is een volle schermvulling
   aan cover verspilling: minder lucht, kleinere kop. */
@media (max-height:620px){
  body.in-game #modalIntro .intro-kop{min-height:0;padding:18px 0 22px}
  .intro-watermerk{display:none}
  .intro-titel{font-size:clamp(28px,7vw,38px)}
  .intro-scheiding{margin:18px auto 16px}
}
/* Meer lucht tussen de drie blokken onder de haarlijn: bordregels, wie
   erbij waren, en het kaartje van het bord. Ze stonden op elkaar geplakt. */
.intro-kaart{display:flex;justify-content:center;margin:34px 0 18px}
.mini-kaart{display:grid;gap:2px}
.mk-c{position:relative;aspect-ratio:1;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(90,70,40,.16)}
.mk-c.leeg{background:none!important;box-shadow:none}
.mk-c.blok{opacity:.5}
.mk-c.blok::before{content:"";position:absolute;inset:24%;border-radius:2px;background:var(--dof);opacity:.85}
.intro-bordregels{display:flex;flex-direction:column;gap:10px;text-align:left}
.bordregel{display:flex;gap:10px;align-items:flex-start;background:rgba(201,147,47,.2);border:1px solid rgba(201,147,47,.5);border-left:4px solid var(--goud);
  border-radius:14px;padding:11px 13px;font-size:14.5px;font-weight:600;line-height:1.5;color:var(--inkt)}
html[data-thema="licht"] .bordregel{background:rgba(145,96,8,.13);border-color:rgba(145,96,8,.38);border-left-color:var(--goud)}
.bordregel .ic{width:18px;height:18px;color:var(--goud);margin-top:2px;flex:0 0 auto}
.bordregel .ic svg{width:100%;height:100%}
.bordregel.algemeen{background:none;border:0;padding:2px 6px;color:var(--dof);font-weight:600;font-size:13px}
.bordregel.algemeen .ic{color:var(--dof)}
/* Dezelfde markering als op het bord. */
/* Rijen van drie en twee om en om. Een doorlopend raster van drie hield bij
   acht of negen personen een losse staart over; zo staat elke rij gecentreerd
   en oogt het blok rustiger. */
.deelnemers{display:flex;flex-direction:column;gap:20px;padding:36px 0 4px}
.deelnemer-rij{display:flex;justify-content:center;gap:8px}
.deelnemer{display:flex;flex-direction:column;align-items:center;gap:5px;width:76px;text-align:center}
.bord-fiche{
  position:relative;width:46px;height:46px;border-radius:999px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;background:var(--pc);
  border:2.5px solid var(--board-ink);
  box-shadow:0 2px 6px rgba(21,26,51,.34),0 0 0 1.5px rgba(255,255,255,.35);
}
.bord-fiche .init{font:700 20px var(--font-display);line-height:1;letter-spacing:-.01em}
.bord-fiche .init[data-len="2"]{font-size:15px}
.bord-fiche .init[data-len="3"]{font-size:12px}
.bord-fiche .role-badge{position:absolute;right:-15%;bottom:-13%;width:15px;height:21.5px;
  display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 1px 2px rgba(21,26,51,.35))}
.bord-fiche .role-badge svg{width:100%;height:100%;display:block;overflow:visible}
.deelnemer.slachtoffer .bord-fiche{transform:rotate(-6deg)}
.deelnemer .naam{font-family:var(--font-display);font-weight:600;font-size:13.5px;line-height:1.1;color:var(--inkt)}
.deelnemer .rol{font:800 9px var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--dof);min-height:11px}
.deelnemer.slachtoffer .rol{color:#E58472}
/* De knop hangt niet meer vast onder het vel maar staat onderaan IN de
   schuifkolom: je leest eerst het dossier en pakt de zaak daarna op. */
/* Onderaan doorgescrold hoort de knop niet tegen de rand te plakken: deze
   staart is ruwweg nog een knophoogte extra, plus het verloop hierboven. */
body.in-game #modalIntro .rij-knoppen{display:flex;margin:24px 0 clamp(96px,16vh,140px)}
body.in-game #modalIntro .btn{width:100%;height:50px;font-size:18px}
/* Het duwtje om verder te lezen. Zweeft boven de kolom, dus buiten de
   scrollstroom; [hidden] moet expliciet winnen van de display:flex hierboven. */
.scroll-wenk{
  position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:38px;height:38px;border-radius:999px;padding:0;z-index:3;
  display:flex;align-items:center;justify-content:center;
  background:var(--goud);color:var(--goud-op);border:1px solid var(--goud-diep);
  /* De ring in de kaartkleur zet de knop vrij van wat er toevallig achter
     ligt; op een laag scherm belandt hij anders zo op een portret. */
  box-shadow:0 4px 14px rgba(0,0,0,.3),0 0 0 7px var(--kaart);
  animation:wenkOp .3s ease both, wenkWip 1.7s ease-in-out .3s infinite;
}
.scroll-wenk[hidden]{display:none}
.scroll-wenk .ic,.scroll-wenk svg{width:19px;height:19px}
@keyframes wenkOp{from{opacity:0}to{opacity:1}}
@keyframes wenkWip{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,5px)}}
@media (prefers-reduced-motion:reduce){
  .scroll-wenk{animation:wenkOp .3s ease both}
}

/* ── Eindscherm als slide ── */
body.in-end #screen-end{padding:0;justify-content:flex-start;overflow:hidden;display:flex;flex-direction:column}
.uitslag{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  max-width:520px;width:100%;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 22px 18px;
  text-align:center;animation:uitslagIn .5s cubic-bezier(.2,.8,.3,1) both}
/* De knop blijft staan: je hoeft niet langs de hele lijst te scrollen om
   verder te kunnen. */
.uitslag-voet{flex:0 0 auto;max-width:520px;width:100%;margin:0 auto;
  padding:12px 22px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--lijn-zacht);background:var(--grond)}
.uitslag-voet .btn{width:100%}
@keyframes uitslagIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.uitslag-beeld{position:relative;width:128px;height:128px;margin:22px auto 14px}
.uitslag-beeld svg{width:100%;height:100%;transform:rotate(-90deg)}
.uitslag-beeld .ring-achter{fill:none;stroke:var(--lijn);stroke-width:8}
.uitslag-beeld .ring-voor{fill:none;stroke:var(--goud);stroke-width:8;stroke-linecap:round;
  transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.3,1) .25s}
.uitslag.lose .ring-voor{stroke:#E58472}
.ring-icoon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--goud)}
.ring-icoon svg{width:46px;height:46px}
.uitslag.lose .ring-icoon{color:#E58472}
body.in-end #endTitle{margin:0;font-family:var(--font-display);font-weight:600;font-size:clamp(30px,8vw,40px);line-height:1.1;color:var(--inkt)}
.uitslag-sub{margin:8px 0 0;color:var(--inkt-2);font-size:15px}
.uitslag-cijfers{display:flex;justify-content:center;gap:34px;margin:20px 0 18px}
.uitslag-cijfers .cijfer b{display:block;font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1;
  color:var(--inkt);font-variant-numeric:tabular-nums}
.uitslag-cijfers .cijfer span{display:block;margin-top:6px;font:800 10.5px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dof)}
.uitslag-lijst{display:flex;flex-direction:column;gap:6px;text-align:left}
.uitslag-rij{display:flex;align-items:center;gap:11px;background:var(--kaart);border:1px solid var(--lijn);border-radius:14px;
  padding:8px 12px 8px 8px;animation:uitslagIn .4s cubic-bezier(.2,.8,.3,1) both}
.uitslag-rij .av{width:38px;height:38px;border-radius:11px;overflow:hidden;flex:0 0 auto}
.uitslag-rij .av svg{width:100%;height:100%;display:block}
.uitslag-rij .wie{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.uitslag-rij .wie b{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--inkt)}
.uitslag-rij .wie small{font-size:12px;color:var(--dof);font-weight:600;margin-top:1px}
.uitslag-rij .oordeel{font:800 10.5px var(--font-ui);letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:999px}
.uitslag-rij.goed .oordeel{background:var(--goud-zacht);color:var(--goud);border:1px solid var(--goud-lijn)}
.uitslag-rij.fout .oordeel{background:rgba(229,132,114,.14);color:#E58472;border:1px solid rgba(229,132,114,.4)}
.uitslag-rij.open{border-style:dashed}
body.in-end .result-actions{margin-top:22px;gap:10px}
body.in-end .btn{height:48px;font-size:17px}

body.in-game .list-sep{color:var(--dof);margin:6px 2px 0;font-size:10px}
body.in-game .list-sep::after{background:linear-gradient(90deg,var(--lijn),transparent)}
body.in-game .badge{background:var(--kaart-2);border-color:var(--lijn);color:var(--dof)}
body.in-game .clue-card .tick{background:var(--kaart-2);border-color:var(--lijn)}
body.in-game .clue-card.done .tick{
  background:var(--goud);border-color:var(--goud);color:var(--goud-op);box-shadow:none;transform:none;width:20px;height:20px}
body.in-game .clue-card.done .tick svg{display:block}
body.in-game .clue-card.done::before{background:var(--goud)}
</style>

<!-- Het intro van een zaak: een vel dat over het bord heen komt, zodat je
     het level er al klein achter ziet. Je leest eerst het dossier en scrollt
     naar beneden om de zaak op te pakken — vandaar dat "Begin de zaak"
     onderaan in de schuifkolom staat en niet vastgeprikt onder het vel. -->
<div class="modal sheet-modal" id="modalIntro">
  <div class="backdrop" data-close></div>
  <!-- Het introvel dekt het hele scherm af, dus de terugknop in de spelkop is
       hier onbereikbaar. Zonder deze knop zit je bij het openen van een zaak
       vast: je kunt alleen nog beginnen. Hij hangt bewust aan het venster en
       niet aan het vel, want het vel begint lager op het scherm. -->
  <button class="intro-terug" id="btnIntroBack" type="button"
          aria-label="Terug naar het menu" title="Terug naar het menu">
    <span class="ic" data-icon="back"></span>
  </button>
  <div class="sheet intro-vel" id="introVel">
    <!-- De plattegrond hangt aan het vel en niet aan de schuifkolom: hij staat
         stil terwijl het dossier eroverheen schuift. Meebewegen op de
         scrollpositie trilde, want die wordt op een andere draad bijgehouden
         dan het tekenen. -->
    <div class="intro-watermerk" id="introWatermerk" aria-hidden="true"></div>
    <div class="intro-scroll" id="introScroll">
      <!-- De cover: zaaknummer, titel, niveau en de intro. Alleen wie de zaak
           is, verder niets, zodat je hem eerst op je in laat werken. -->
      <div class="intro-kop">
        <div class="intro-zaak" id="introZaak"></div>
        <h2 class="intro-titel" id="introTitel">—</h2>
        <div class="intro-graad" id="introGraad"></div>
        <div class="intro-scheiding"></div>
        <p class="intro-tekst" id="introTekst"></p>
      </div>
      <!-- Het dossier schuift als één vlak over de plattegrond heen. De
           bovenrand loopt van doorzichtig naar de kaartkleur, zodat de
           plattegrond eronder vervaagt in plaats van te worden afgesneden. -->
      <div class="intro-dossier">
        <div class="intro-breuk"></div>
        <div class="intro-bordregels" id="introBordregels"></div>
        <div class="deelnemers" id="introDeelnemers"></div>
        <div class="intro-kaart" id="introKaart"></div>
        <div class="rij-knoppen"><button class="btn" id="btnBeginLevel">Begin de zaak</button></div>
      </div>
    </div>
    <!-- Duwtje om verder te lezen: verschijnt pas als je een paar tellen niet
         scrolt terwijl er wél meer onder staat, en verdwijnt zodra je begint. -->
    <button class="scroll-wenk" id="introWenk" type="button" hidden aria-label="Verder lezen">
      <span class="ic" data-icon="chevron"></span>
    </button>
  </div>
</div>

/* ── Assetbank ──────────────────────────────────────────
   Eén bron voor iconen, tekeningen en objectkennis: assets/manifest.json.
   Het blok hierboven wordt erin gebakken door assets/tools/build_assets.py.
   Voeg nooit een icoon of objectsoort rechtstreeks hier toe — pas de bank aan
   en draai het script. Dezelfde code staat in de builder, zodat beide precies
   hetzelfde tonen. */
/* Het versienummer achter een tekening houdt de cache van de browser vers.
   Rechtstreeks vanaf schijf (file://) kan dat juist niet: daar hoort een query
   niet bij het adres maar bij de bestandsnaam, en dan wordt er niets gevonden. */
function assetBust(v){
  return (location.protocol === 'file:') ? '' : ('?v=' + (v || 1));
}
const ART_DIR = "../assets/art/objects/";
const THEME_DIR = "../assets/themes/";

/* ══════════════════════════════════════════════════════
   Skins
   ------------------------------------------------------
   Een level draagt zijn thema al (puzzle.theme); de speler kleedt zich daar
   nu ook naar. Eén registratie per skin -- alles wat er visueel bijhoort staat
   in CSS onder body[data-skin="..."], zodat een nieuw thema er later bijkomt
   zonder één regel spel-logica te raken. De indeling van de schermen is voor
   elke skin gelijk: alleen materialen, letters en texturen wisselen.

   De levelkiezer blijft altijd neutraal; pas wie een level opent, stapt het
   thema binnen.
   ══════════════════════════════════════════════════════ */
const THEMA_PAKKETTEN = {
  medieval: { label: "Middeleeuwen" }
};

document.addEventListener("DOMContentLoaded",()=>applySkin(""));
/* ── Licht of donker ──────────────────────────────────
   Het chroom van het spel volgt dezelfde keuze als het hoofdmenu, met
   dezelfde sleutel: wie in het menu donker kiest, speelt donker. */
const THEMA_SLEUTEL="clueboard:menuThema";
const THEMA_KLEUR={donker:"#231819",licht:"#F1EFE8"};
function zetThema(naam){
  const t=THEMA_KLEUR[naam]?naam:"donker";
  document.documentElement.dataset.thema=t;
  try{ localStorage.setItem(THEMA_SLEUTEL,t); }catch(e){}
  $$("#themaKeuze [data-thema]").forEach(b=>b.classList.toggle("aan",b.dataset.thema===t));
  zetThemaKleur();
}
/* De statusbalk van de telefoon kleurt mee, maar alleen in het spel. */
function zetThemaKleur(){
  const m=$("#themeColorMeta"); if(!m) return;
  const t=document.documentElement.dataset.thema||"donker";
  m.content=document.body.classList.contains("in-game")?THEMA_KLEUR[t]:"#EDF1F8";

function validateLevel(raw){
  if(!raw || typeof raw!=="object") return "Geen geldig JSON-object.";
  if(raw.format && raw.format!=="clueboard-level") return "Onbekend format: "+raw.format+".";
  const p=raw.puzzle;
  if(!p) return "Veld 'puzzle' ontbreekt.";
  if(!p.grid || !p.grid.columns || !p.grid.rows) return "Veld 'puzzle.grid' is onvolledig.";
  if(!Array.isArray(p.tiles) || !p.tiles.length) return "Veld 'puzzle.tiles' ontbreekt of is leeg.";
  if(!p.people || !Array.isArray(p.people.placements) || !p.people.placements.length)
    return "Veld 'puzzle.people.placements' ontbreekt.";
  if(!raw.solution || !Array.isArray(raw.solution.placements) || !raw.solution.placements.length)
    return "Veld 'solution.placements' ontbreekt — dit level is niet compleet.";
  return null;
}

/* De kleur van een persoon hangt aan de beginletter van zijn naam, niet aan
   zijn plek in de lijst. Anne is dus altijd blauw, in welk level dan ook en
   op welke positie ook — dat maakt de kleuren herkenbaar over levels heen.
   Het slachtoffer heet altijd iets met een V en is altijd rood. De lijst
   staat in de bank; hier wordt hij alleen uitgelezen. */
const PERSON_COLORS=AssetBank.manifest.personColors||{};
const VICTIM_COLOR=PERSON_COLORS.victim||"#C0392B";
function colorForLetter(letter){
  return PERSON_COLORS[String(letter||"").charAt(0).toUpperCase()] || "#4A5568";
}
/* De pionkleuren komen uit een gedempt palet met zowel lichte als donkere
   tinten; de letter erop wordt dus per kleur donker of wit, wat het beste
   leest. Zo blijft elke pion leesbaar zonder dat het palet ingeperkt wordt. */
const BOARD_INK=AssetBank.manifest.ink||"#1D2036";
function luminantie(hex){
  const h=String(hex||"").replace("#","");
  if(h.length<6) return 1;
  const f=v=>{ v/=255; return v<=0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); };
  return 0.2126*f(parseInt(h.slice(0,2),16))
       + 0.7152*f(parseInt(h.slice(2,4),16))
       + 0.0722*f(parseInt(h.slice(4,6),16));
}
function contrastMet(a,b){
  const la=luminantie(a), lb=luminantie(b);
  return (Math.max(la,lb)+0.05)/(Math.min(la,lb)+0.05);
}
/* Een kleur die op wit te lezen blijft. De lichtste spelerskleuren -- het
   bleekgroen en het lila -- verdwijnen als tekst zo goed als in het papier;
   die worden hier naar de bordinkt toe gemengd tot ze genoeg contrast hebben.
   Donkere kleuren blijven ongemoeid. */
const LEESBAAR = {};
function leesbaar(kleur, doel){
  const eis = doel || 4.2;
  const sleutel = kleur + "|" + eis;
  if (LEESBAAR[sleutel]) return LEESBAAR[sleutel];
  let uit = kleur;
  for (let i = 0; i < 12 && contrastMet(uit, "#FFFFFF") < eis; i++)
    uit = mixHex(uit, BOARD_INK, .12);
  return (LEESBAAR[sleutel] = uit);
}

function inkOnColor(bg){
  return contrastMet(bg,BOARD_INK)>=contrastMet(bg,"#FFFFFF") ? BOARD_INK : "#FFFFFF";
}
/* Rolnamen komen uit de bank, net als de rolpicto's. */
const ROLE_LABELS=(function(){
  const out={};
  AssetBank.roles().forEach(function(r){ out[r.standing]=r.label; });
  return out;
})();
function roleLabel(r){ return r ? (ROLE_LABELS[r]||String(r).charAt(0).toUpperCase()+String(r).slice(1)) : null; }

/* Slachtoffer of verdachte staat nergens meer als woord op het bord: het
   slachtoffer is rood en dat is genoeg. De dader blijft tot het einde gewoon
   een verdachte, anders verklap je de puzzel meteen. */
function personRole(p){ return (p && M && p.id===M.victimId) ? "victim" : "suspect"; }

/* Het slachtoffer krijgt het rood en slaat geen paletkleur op: zo houden de
   verdachten dezelfde kleur, ook als het slachtoffer ergens midden in de lijst
   staat, en blijft de toewijzing gelijk tussen twee sessies. */
function assignPersonColors(m){
  m.people.forEach(p=>{
    if(p.id===m.victimId){ p.color=VICTIM_COLOR; return; }
    const eerste=String(p.name||"").trim().charAt(0).toUpperCase();
    /* Een naam buiten de lijst houdt de kleur van de plek die de builder hem
       gaf, zodat hij niet ineens grijs wordt. */
    p.color = PERSON_COLORS[eerste] || PERSON_COLORS[p.colorLetter] || "#4A5568";
  });
}

/* Twee personen met dezelfde beginletter zijn op het bord niet te
   onderscheiden, en in de notities al helemaal niet. Iedereen krijgt daarom
   het kortste begin van zijn naam dat uniek is: Duncan en Dorothy worden Du
   en Do, terwijl Alice gewoon A blijft. */
const LETTER_MAX=4;
function assignPersonLetters(people){
  const naam=p=>String(p.name||"").trim();
  people.forEach(p=>{
    const n=naam(p);
    if(!n){ p.letter="?"; return; }
    p.letter=null;
    for(let len=1;len<=Math.min(LETTER_MAX,n.length);len++){
      const pre=n.slice(0,len).toLowerCase();
      if(people.filter(q=>naam(q).slice(0,len).toLowerCase()===pre).length===1){
        p.letter=n.charAt(0).toUpperCase()+n.slice(1,len);
        break;
      }
    }
  });
  /* Namen die na vier tekens nog gelijk lopen krijgen een cijfer: langer wordt
     op een pion toch onleesbaar. */
  const teller={};
  people.filter(p=>!p.letter).forEach(p=>{
    const c=(naam(p).charAt(0)||"?").toUpperCase();
    teller[c]=(teller[c]||0)+1;
    p.letter=c+teller[c];
  });
}

function buildModel(raw){
  applySkin(raw.puzzle && raw.puzzle.theme);
  const p=raw.puzzle, content=raw.content||{};
  const M={
    raw, title:content.title||"Naamloos niveau", intro:content.intro||"",
    columns:p.grid.columns, rows:p.grid.rows,
    theme:p.theme||"", themeLabel:p.themeLabel||"",
    tiles:new Map(), rooms:new Map(), objects:new Map(),
    people:[], peopleById:new Map(),
    victimId:(raw.solution&&raw.solution.victimId)||p.people.victimId||null,
    culpritId:(raw.solution&&raw.solution.culpritId)||null,
    solution:new Map(), clues:[], boardClues:[], victimClue:null
  };
  (p.rooms||[]).forEach(r=>M.rooms.set(r.id,r));
  (p.objects||[]).forEach(o=>M.objects.set(o.id,o));
  p.tiles.forEach(t=>M.tiles.set(t.id,t));

  const cp=content.people||{};
  p.people.placements.forEach((pl,i)=>{
    const c=cp[pl.id]||{};
    const standing=c.role||pl.standing||null;
    const name=c.name||pl.name||pl.id;
    M.people.push({
      id:pl.id, index:i, name:name,
      gender:c.gender||pl.gender||null,
      standing:standing||null, standingLabel:roleLabel(standing),
      colorLetter:c.nameLetter||null,
      description:c.description||"",
      hairStyle:c.hairStyle||null, hairColor:c.hairColor||null,
      attributes:(c.attributes&&typeof c.attributes==="object")?c.attributes:null,
      color:null, letter:""
    });
  });
  assignPersonColors(M);
  assignPersonLetters(M.people);
  M.people.forEach(pe=>M.peopleById.set(pe.id,pe));
  raw.solution.placements.forEach(s=>M.solution.set(s.personId,s.tileId));

  const src=(Array.isArray(raw.clues)&&raw.clues.length)?raw.clues:(content.clues||[]);
  src.filter(c=>c&&(c.text||c.storyText)).forEach(c=>{
    const item={id:c.id, personId:c.personId||null, text:c.text||c.storyText};
    if(item.personId && item.personId===M.victimId && !M.victimClue) M.victimClue=item;
    else if(item.personId) M.clues.push(item);
    else M.boardClues.push(item);
  });
  assignGenericObjectIcons(M);
  M.bounds=boardBounds(M);
  return M;
}

/* De werkelijke omvang van het bord: het kleinste vak dat alle bestaande
   tegels omsluit. Een niveau kan een raster van 12x12 opgeven terwijl er maar
   een strook van 7x9 in gebruik is; alles wat met het bord rekent gaat daarom
   hierop uit en niet op grid.columns/grid.rows. */
function boardBounds(m){
  let minC=Infinity,maxC=-Infinity,minR=Infinity,maxR=-Infinity,n=0;
  m.tiles.forEach(t=>{
    if(t.column<minC)minC=t.column; if(t.column>maxC)maxC=t.column;
    if(t.row<minR)minR=t.row;       if(t.row>maxR)maxR=t.row;
    n++;
  });
  if(!n) return {minC:1,maxC:m.columns,minR:1,maxR:m.rows,cols:m.columns,rows:m.rows,regular:true};
  const cols=maxC-minC+1, rows=maxR-minR+1;
  /* Regelmatig = elk vak binnen die omvang heeft ook echt een tegel. Zo niet,
     dan is het bord uitgesneden en verdient het een eigen contour. */
  return {minC,maxC,minR,maxR,cols,rows,regular:n===cols*rows};
}

/* ============================================================
   3. Characters — de V4-stijl, opgebouwd uit lagen
   ------------------------------------------------------------
   Eén tekening voor iedereen, ingekleurd op het moment zelf: de zachte
   ID-tint en het shirt volgen de kleur van de persoon, kapsel en haarkleur
   komen uit het level (of, ontbreken ze, uit een vaste terugval op naam en
   geslacht). Geen ogen, neus of mond; alleen het slachtoffer krijgt twee
   kruisogen. Het gezicht heeft een exact verticale splitsing in een lichte
   en een donkere helft.
   Later kunnen echte rasterlagen dit vervangen: mountAsset() hangt een
   geladen tekening over deze SVG heen en verbergt hem (.has-art). De
   veldnamen hairStyle, hairColor en attributes zijn het contract dat dan
   blijft gelden.
   ============================================================ */
const SKINS=["#F3D2B6","#E8BE99","#C99B71","#9C6B45"];
function hashCode(str){
  let h=0; str=String(str);
  for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))|0;
  return Math.abs(h);
}
function haarStijlen(){ return AssetBank.manifest.hairStyles||[]; }
function haarKleuren(){ return AssetBank.manifest.hairColors||[]; }
function haarKleurHex(id){ const k=haarKleuren().find(h=>h.id===id); return k?k.hex:"#4A3226"; }
/* Welke kapsels mag dit geslacht dragen? De laatste zes zijn alleen voor
   vrouwen; een man krijgt ze nooit, ook niet uit de terugval. */
function haarStijlenVoor(gender){
  const alle=haarStijlen();
  return gender==="female" ? alle : alle.filter(h=>h.gender!=="female");
}
/* Dezelfde terugval in speler en bouwer: staat er niets in het level, dan
   kiezen beide uit naam en geslacht hetzelfde kapsel en dezelfde kleur. Oude
   levels zonder deze velden zien er zo overal hetzelfde uit. */
function kapselStandaard(name,gender){
  const h=hashCode(String(name||"")+"|"+(gender||"x"));
  const stijlen=haarStijlenVoor(gender), kleuren=haarKleuren();
  return {
    hairStyle: stijlen.length ? stijlen[h%stijlen.length].id : "short-crop",
    hairColor: kleuren.length ? kleuren[Math.floor(h/97)%kleuren.length].id : "deep-brown"
  };
}
/* Wat er in het level staat wint, mits het bestaat en bij het geslacht past;
   anders de terugval. Een vrouwenkapsel op een man valt zo ook stil terug. */
function persoonKapsel(person){
  const std=kapselStandaard(person.name,person.gender);
  const geldig=haarStijlenVoor(person.gender).some(h=>h.id===person.hairStyle);
  return {
    hairStyle: geldig ? person.hairStyle : std.hairStyle,
    hairColor: haarKleuren().some(k=>k.id===person.hairColor) ? person.hairColor : std.hairColor
  };
}

/* De zestien kapsels op de hoofdgeometrie hieronder (hoofd: ellips cx50 cy44

/* Het slachtoffer kijkt niet meer: twee kruisjes, en verder niets. */
function kruisogen(){
  const x=cx=>'<path d="M'+(cx-3)+' 41l6 6M'+(cx+3)+' 41l-6 6" stroke="#2A2118" stroke-width="2.4" stroke-linecap="round" fill="none"/>';
  return x(42)+x(58);
}

function characterSvg(person,opt){
  const o=opt||{};
  const kleur=person.color||"#5B6672";
  const tint=o.bg||mixHex(kleur,"#FFFFFF",.86);
  const h=hashCode(person.name||"");
  const huid=SKINS[h%SKINS.length];
  const oor=mixHex(huid,"#000000",.10);
  const kap=persoonKapsel(person);
  const haar=HAAR[kap.hairStyle]||HAAR["short-crop"];
  const hk=haarKleurHex(kap.hairColor);
  const dood=(o.dood!==undefined) ? !!o.dood : !!(M && person && person.id===M.victimId);
  /* Eigen clip-id per tekening: staan er meerdere op één pagina, dan wijst
     url(#id) anders altijd naar de eerste. */
  const uid="ch"+(characterSvg._n=(characterSvg._n||0)+1);
  let s='<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
    +'<defs><clipPath id="'+uid+'"><ellipse cx="50" cy="44" rx="19" ry="22"/><rect x="42" y="56" width="16" height="18"/></clipPath></defs>'
    /* Zachte ID-tint als ondergrond. */
    +'<rect width="100" height="100" fill="'+tint+'"/>';
  if(haar.achter) s+='<path d="'+haar.achter+'" fill="'+hk+'"/>';
  /* Neutrale romp met iets bredere schouders, in de kleur van de persoon. */
  s+='<path d="M8 100C8 82 22 72 40 70H60C78 72 92 82 92 100Z" fill="'+kleur+'"/>'
    +'<rect x="42" y="56" width="16" height="18" fill="'+huid+'"/>'
    +'<ellipse cx="31" cy="46" rx="3.6" ry="5.2" fill="'+oor+'"/><ellipse cx="69" cy="46" rx="3.6" ry="5.2" fill="'+oor+'"/>'
    +'<ellipse cx="50" cy="44" rx="19" ry="22" fill="'+huid+'"/>'
    /* De splitsing: rechterhelft van gezicht en hals een tikje donkerder,
       precies door het midden. */
    +'<rect x="50" y="20" width="22" height="56" fill="#000" opacity=".085" clip-path="url(#'+uid+')"/>';
  if(haar.voor) s+='<path d="'+haar.voor+'" fill="'+hk+'"/>';
  if(haar.knot) s+='<circle cx="'+haar.knot.cx+'" cy="'+haar.knot.cy+'" r="'+haar.knot.r+'" fill="'+hk+'"/>';
  if(haar.lijn) s+='<path d="'+haar.lijn+'" stroke="'+mixHex(hk,"#000000",.25)+'" stroke-width="1.4" stroke-linecap="round" fill="none"/>';
  if(dood) s+=kruisogen();
  return s+'</svg>';
}

/* ============================================================
   4. Objecticonen
   ============================================================ */
/* De pictogrammen zelf staan in de bank (assets/icons/objects/) en zijn
   ingebakken door het buildscript; hier staat alleen nog wat de player
   ermee doet. */
/* Genereert een uniek, deterministisch icoon voor objecttypes die niet in de bekende lijst staan,
   zodat elk type gegarandeerd zijn eigen pictogram houdt in plaats van een gedeeld symbool. */
const GENERIC_ICON_SHAPES=[
  '<circle cx="12" cy="12" r="8.5"/>',
  '<rect x="4" y="4" width="16" height="16" rx="3.4"/>',
  '<path d="M12 3.4l8.4 16.2H3.6z"/>',
  '<path d="M12 2.6l8.2 4.8v9.2L12 21.4l-8.2-4.8V7.4z"/>',
  '<path d="M12 2.6l2.9 6.6 7.1.5-5.5 4.8 1.7 6.9-6.2-3.8-6.2 3.8 1.7-6.9L2 9.7l7.1-.5z"/>',
  '<rect x="3" y="8" width="18" height="8" rx="4"/>',
  '<path d="M12 3.2l7 4v9.6l-7 4-7-4V7.2z"/>',
  '<circle cx="12" cy="12" r="8.2" stroke-dasharray="3.4 3"/>'
];
/* Kent de bank deze objectsoort? Zo niet, dan krijgt hij een algemene vorm met
   zijn beginletter, zodat twee onbekende soorten nooit hetzelfde beeld delen. */
function isKnownObjectKind(kindLower){
  return !!AssetBank.meta(kindLower);
}
/* Wijst elk onbekend objecttype in het huidige niveau een eigen vorm toe (op
   alfabetische volgorde, dus stabiel bij elke render), zodat twee verschillende
   onbekende types nooit dezelfde vorm delen, ook niet als hun naam met dezelfde
   letter begint (zoals "Shrub" en "Stones"). */
function assignGenericObjectIcons(model){
  const seen=new Set(), customLabels=[];
  model.objects.forEach(o=>{
    const label=o.kind||o.name; if(!label) return;
    const key=label.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    if(!isKnownObjectKind(key)) customLabels.push(label);
  });
  customLabels.sort((a,b)=>a.localeCompare(b));
  const map=new Map();
  customLabels.forEach((label,i)=>map.set(label.toLowerCase(),i%GENERIC_ICON_SHAPES.length));
  model.customIconAssign=map;
}
function objIconSvg(inner){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '
    +'stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">'+inner+'</svg>';
}
function genericObjectIcon(label){
  const key=String(label||"object");
  const assigned=M&&M.customIconAssign&&M.customIconAssign.get(key.toLowerCase());
  const idx=(assigned!==undefined)?assigned:(hashCode(key)%GENERIC_ICON_SHAPES.length);
  const shape=GENERIC_ICON_SHAPES[idx];
  const letter=key.trim().charAt(0).toUpperCase()||"?";
  return objIconSvg(shape
    +'<text x="12" y="15.6" font-size="9.5" font-weight="800" text-anchor="middle" '
    +'stroke="none" fill="currentColor" font-family="Manrope, sans-serif">'+esc(letter)+'</text>');
}
/* Hoe noem je dit object tegenover de speler? Staat er maar één bed in het
   landhuis, dan is het "het bed"; staan er twee, dan pas "bed 1" en "bed 2",
   geteld in leesvolgorde binnen die ruimte. De naam uit de bouwer telt hier
   niet mee: die nummert over het hele bord en zegt dus "Stoel 3" waar de
   speler maar één stoel ziet. */
function objectAanduiding(o){
  if(!o) return "";
  const soort=o.kindLabel||o.kind||"Object";
  const zelfde=[];
  M.objects.forEach(x=>{
    if(x.roomId!==o.roomId) return;
    if((x.kindLabel||x.kind)!==soort) return;
    zelfde.push(x);
  });
  if(zelfde.length<2) return soort;
  const plek=x=>{
    const t=(x.tiles||[]).map(id=>M.tiles.get(id)).filter(Boolean);
    if(!t.length) return [0,0];
    return [Math.min.apply(null,t.map(q=>q.row)), Math.min.apply(null,t.map(q=>q.column))];
  };
  zelfde.sort((a,b)=>{ const pa=plek(a), pb=plek(b); return (pa[0]-pb[0])||(pa[1]-pb[1]); });
  const n=zelfde.findIndex(x=>x.id===o.id);
  return soort+" "+(n<0?1:n+1);
}
function objectIcon(kind){
  const known=AssetBank.icon(kind);
  if(known) return known;
  return genericObjectIcon(kind);
}

/* ------------------------------------------------------------
   Materiaalvlak per objecttype: een getextureerd oppervlak boven op
   de vloertextuur van de ruimte. Blocked krijgt een dieper, verzadigder
   vlak met arcering; occupiable blijft licht en open.
   ------------------------------------------------------------ */
const OBJECT_MATERIALS=[
  {test:k=>/(bed|chair|stoel|kruk|table|tafel|bench|bank|shelf|kast|book|boeken|door|deur|crate|krat|box|kist|chest|barrel|vat|easel|ezel|catapult|katapult|cart|wagen)/.test(k), color:"#C79A62"},
  {test:k=>/(statue|beeld|bust|stone|steen|rock|boulder|rubble|puin|gravel|well|put|debris)/.test(k), color:"#AEB4C0"},
  {test:k=>/(plant|bush|struik|shrub|bonsai|pot|flower|bloem|tree|boom|cactus|hedge|haag)/.test(k), color:"#84B47C"},
  {test:k=>/(carpet|tapijt|rug|mat|curtain|gordijn|hay|hooi|sack|zak)/.test(k), color:"#C58FA4"},
  {test:k=>/(gate|poort|hek|anvil|aambeeld|sword|zwaard|wapen|armour|car|auto|bike|fiets|lamp|lantaarn)/.test(k), color:"#9FAAB9"},
  {test:k=>/(water|lily|pond|vijver|boat|boot|ship|oil|olie|mud|modder|puddle|plas)/.test(k), color:"#7FB0CD"},
  {test:k=>/(horse|paard|cow|koe|pig|varken|boar|zwijn|wolf|bear|beer|dog|hond|shark|haai|fish|vis)/.test(k), color:"#C79878"},
  {test:k=>/(fire|haard|hearth|oven|forge|candle|kaars|torch|fakkel)/.test(k), color:"#DFA457"},
  {test:k=>/(window|raam|mirror|spiegel|tv|scherm|screen|camera|glass|glas)/.test(k), color:"#A6C2D6"},
  {test:k=>/(sand|zand|dune|path|pad|road|weg|dirt|aarde)/.test(k), color:"#C7AC7D"}
];
function hexToRgb(hex){
  const h=String(hex).replace("#","");
  const n=h.length===3?h.split("").map(c=>c+c).join(""):h;
  return [parseInt(n.substr(0,2),16),parseInt(n.substr(2,2),16),parseInt(n.substr(4,2),16)];
}
function mixHex(a,b,t){
  const A=hexToRgb(a), B=hexToRgb(b);
  const c=A.map((v,i)=>Math.round(v+(B[i]-v)*t));
  return "#"+c.map(v=>("0"+v.toString(16)).slice(-2)).join("");
}
function objectBaseColor(kind){
  const k=String(kind||"").toLowerCase();
  const hit=OBJECT_MATERIALS.find(m=>m.test(k));
  if(hit) return hit.color;
  /* Onbekend type: eigen, rustige tint die stabiel blijft per naam. */
  const hue=hashCode(k||"object")%360;
  return hslToHex(hue,26,68);
}
function hslToHex(h,s,l){
  const S=s/100, L=l/100;
  const c=(1-Math.abs(2*L-1))*S, x=c*(1-Math.abs((h/60)%2-1)), m=L-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  const to=v=>("0"+Math.round((v+m)*255).toString(16)).slice(-2);
  return "#"+to(r)+to(g)+to(b);
}
/* De vier kleurlagen van een objectvlak, als losse waarden. */
function objectSurfaceVars(kind,type){
  const base0=objectBaseColor(kind);
  const base=(type==="blocked")?mixHex(base0,"#151A33",.10):mixHex(base0,"#FFFFFF",.34);
  return {
    "--obj-base":base,
    "--obj-hi":mixHex(base,"#FFFFFF",.32),
    "--obj-lo":mixHex(base,"#151A33",.18),
    "--obj-edge":mixHex(base,"#151A33",.36)
  };
}
/* Zet de kleurvariabelen voor het objectvlak op één tegel. */
function applyObjectSurface(el,kind,type){
  const v=objectSurfaceVars(kind,type);
  Object.keys(v).forEach(k=>el.style.setProperty(k,v[k]));
}
/* Zelfde vlak als inline stijl, voor de legenda. */
function objectSurfaceStyle(kind,type){
  const v=objectSurfaceVars(kind,type);
  return Object.keys(v).map(k=>k+":"+v[k]).join(";");
}

/* Eigen melding in de stijl van het spel; moet echt worden weggeklikt. */
function meld(titel, tekst, opt){
  const o=opt||{};
  $("#meldTitel").textContent=titel;
  if(o.html) $("#meldTekst").innerHTML=tekst; else $("#meldTekst").textContent=tekst;
  const beeld=$("#modalMelding .melding-beeld");
  if(beeld) beeld.innerHTML=icon(o.icoon||"warning",{sw:2});
  const m=$("#modalMelding"); m.classList.toggle("hint",!!o.hint);
  openModal("#modalMelding");
}
let kruisVertraging=new Map();   // tileId -> ms, alleen voor de eerstvolgende tekenbeurt
let kruisEerder=new Set();       // kruisjes die al getekend zijn: niet opnieuw laten opspringen
function easyKruisjes(tileId,opt){
  const t=M.tiles.get(tileId); if(!t) return;
  const anim=!!(opt&&opt.anim);
  /* De hele rij en de hele kolom, ook de geblokkeerde vakjes: die kunnen
     toch al niet, en zonder kruisje lijkt de rij niet af. Alleen een vakje
     waar al iemand staat blijft leeg. */
  M.tiles.forEach(tt=>{
    if(tt.id===tileId) return;
    if(tt.row!==t.row && tt.column!==t.column) return;
    if(personOnTile(tt.id)) return;
    if(!noteFor(tt.id).cross && anim){
      const afstand=Math.abs(tt.row-t.row)+Math.abs(tt.column-t.column);
      kruisVertraging.set(tt.id,afstand*55);
    }
    noteFor(tt.id).cross=true;
  });
}
/* Iemand weg van een vakje: de kruisjes die zijn rij en kolom dichtzetten
   gaan mee, behalve waar een andere pion ze nog rechtvaardigt. */
function kruisjesWeg(tileId){
  const t=M.tiles.get(tileId); if(!t) return;
  M.tiles.forEach(tt=>{
    if(tt.row!==t.row && tt.column!==t.column) return;
    const n=notes.get(tt.id); if(!n||!n.cross) return;
    let anderDekt=false;
    placed.forEach((pt)=>{ const o=M.tiles.get(pt); if(o && o.id!==tileId && (o.row===tt.row||o.column===tt.column)) anderDekt=true; });
    if(!anderDekt) n.cross=false;
  });
}
let placed=new Map();    // personId -> tileId
let accused=null, accusedResult=null, revealed=false;
let justPlaced=null;   // pion die net geplaatst is: krijgt eenmalig de land-animatie
let startTime=0, elapsed=0, timerId=null;

function noteFor(tileId){
  if(!notes.has(tileId)) notes.set(tileId,{marks:new Map(),cross:false});
  return notes.get(tileId);
}
function personOnTile(tileId){
  for(const [pid,tid] of placed) if(tid===tileId) return pid;
  return null;
}
/* ============================================================
   5b. Zichtbaarheid — wat er op het bord getoond wordt
   Blijft bewaard tussen sessies, zodat een speler zijn voorkeur maar een
   keer hoeft te kiezen.
   ============================================================ */
const VIS_KEY="clueboard_visibility";
const VIS_DEFAULTS={notes:true, crosses:true, roomLabels:true, roles:true};
let visibility=Object.assign({},VIS_DEFAULTS);

function loadVisibility(){
  try{
    const raw=localStorage.getItem(VIS_KEY);
    if(!raw) return;
    const v=JSON.parse(raw);
    Object.keys(VIS_DEFAULTS).forEach(k=>{ if(typeof v[k]==="boolean") visibility[k]=v[k]; });
  }catch(e){}
}
function saveVisibility(){
  try{ localStorage.setItem(VIS_KEY,JSON.stringify(visibility)); }catch(e){}
}
/* Zet de opgeslagen keuzes door naar het bord en naar de vinkjes zelf. */
function applyVisibility(){
  const b=document.body;
  b.classList.toggle("hide-notes",!visibility.notes);
  b.classList.toggle("hide-room-labels",!visibility.roomLabels);
  b.classList.toggle("hide-roles",!visibility.roles);
  const boxes={notes:$("#visNotes"), crosses:$("#visCrosses"), roomLabels:$("#visRoomLabels"),
               roles:$("#visRoles")};
  /* Open oog = zichtbaar, doorgestreept oog = verborgen. De hele rij is de
     knop, zodat je niet op een klein vierkantje hoeft te mikken. */
  Object.keys(boxes).forEach(k=>{
    const el=boxes[k]; if(!el) return;
    el.setAttribute("aria-pressed",visibility[k]?"true":"false");
    el.classList.toggle("uit",!visibility[k]);
    const oog=el.querySelector(".oog");
    /* Eén pictogram met twee standen; welke je ziet bepaalt de klasse hieronder.
       Zelf wisselen tussen twee bestanden ging mis omdat de omschakel-CSS alleen
       binnen .icon-btn gold en hier dus beide standen bleven staan. */
    if(oog && !oog.firstChild) oog.innerHTML=AssetBank.ui("eye");
  });
  /* Het oog in de knop gaat dicht zodra er iets verborgen is. */
  const btn=$("#btnVisibility");
  if(btn) btn.classList.toggle("some-hidden",
    !visibility.notes||!visibility.crosses||!visibility.roomLabels);
}
function setVisibility(key,on){
  visibility[key]=!!on;
  saveVisibility();
  applyVisibility();
  if((key==="notes"||key==="crosses") && M) paintBoard();
}

/* ============================================================
   6. Bord + muren
   ============================================================ */
const WALL_NORMAL="#14162E";
/* Eén kleur per rol, uit de bank: dezelfde kleur voor de muur van een ruimte
   waar die rol mag komen, voor de banderol in het menu en voor het badge op de
   pion. Anders hoort een muur zichtbaar bij niets. */
const ROLE_WALL=(function(){
  const out={};
  AssetBank.roles().forEach(r=>{ out[r.standing]=r.color||"#6A45A8"; });
  return out;
})();
function roleColor(standing){ return ROLE_WALL[standing]||"#6A45A8"; }
function roomWallStyle(room){
  const a=(room && Array.isArray(room.allowedStandings)) ? room.allowedStandings : null;
  if(!a || !a.length) return {colors:[WALL_NORMAL], prio:1};
  return {colors:a.map(r=>ROLE_WALL[r]||"#6A45A8"), prio:2};
}
function wallSwatchCss(colors){
  if(colors.length===1) return "background:"+colors[0];
  const n=colors.length, stops=[];
  colors.forEach((c,i)=>{ stops.push(c+" "+(i*100/n)+"%",c+" "+((i+1)*100/n)+"%"); });
  return "background:linear-gradient(90deg,"+stops.join(",")+")";
}
/* Hoort deze tegel bij een ruimte? Zo niet, dan ligt hij buiten de
   plattegrond. Bij een onregelmatig bord (L-vormig of uitgesneden) is dat het
   verschil tussen speelruimte en leeg vlak. */
function getTileRoom(column,row){
  if(!M) return null;
  const t=M.tiles.get("c"+column+"r"+row);
  if(!t || !t.roomId) return null;
  return M.rooms.get(t.roomId)||null;
}

/* ---------- Ruimtenamen plaatsen ----------
   De naam gaat op de rij aaneengesloten tegels waar hij het beste past. Dat is
   niet vanzelf de onderste of de linkse: een naam die daar niet past steekt
   buiten de ruimte of valt weg tegen de rand. We meten daarom eerst hoe breed
   de tekst werkelijk is, zoeken alle horizontale rijen tegels van de ruimte op
   en kiezen de rij met de beste score. */
const LABEL_FONT_PX=10;

function labelMeter(){
  let m=$("#labelMeter");
  if(!m){
    m=document.createElement("div");
    m.id="labelMeter";
    m.style.cssText="position:absolute;left:-9999px;top:0;visibility:hidden;"
      +"white-space:nowrap;font-weight:800;letter-spacing:.08em;"
      +"text-transform:uppercase;padding:1px 5px;border:1px solid transparent;";
    document.body.appendChild(m);
  }
  return m;
}
function measureLabel(text,px){
  const m=labelMeter();
  m.style.fontSize=px+"px";
  m.textContent=text;
  return m.offsetWidth+2;
}

/* Alle horizontale rijen aaneengesloten tegels van een ruimte. */
function roomRuns(room){
  const byRow=new Map();
  (room.tiles||[]).forEach(tid=>{
    const t=M.tiles.get(tid); if(!t) return;
    if(!byRow.has(t.row)) byRow.set(t.row,[]);
    byRow.get(t.row).push(t.column);
  });
  const runs=[];
  byRow.forEach((cols,row)=>{
    cols.sort((a,b)=>a-b);
    let start=cols[0], prev=cols[0];
    for(let i=1;i<cols.length;i++){
      if(cols[i]!==prev+1){ runs.push({row,start,len:prev-start+1}); start=cols[i]; }
      prev=cols[i];
    }
    runs.push({row,start,len:prev-start+1});
  });
  return runs;
}

function roomCentroid(room){
  let sc=0, sr=0, n=0;
  (room.tiles||[]).forEach(tid=>{
    const t=M.tiles.get(tid); if(!t) return;
    sc+=t.column; sr+=t.row; n++;
  });
  return n?{c:sc/n, r:sr/n}:{c:0,r:0};
}

function runHasObject(run){
  for(let c=run.start;c<run.start+run.len;c++){
    const t=M.tiles.get("c"+c+"r"+run.row);
    if(t && t.objectId) return true;
  }
  return false;
}

/* Hoe geschikt is deze rij voor de naam? Hoger is beter. */
function scoreRun(run,needed,cen,b){
  let s=0;
  if(run.row!==b.maxR) s+=3;                              /* niet tegen de onderrand */
  if(run.start!==b.minC && run.start+run.len-1!==b.maxC) s+=2;  /* niet tegen een zijrand */
  const mid=run.start+(run.len-1)/2;
  const span=Math.max(1,b.cols-1);
  s+=2*(1-Math.min(1,(Math.abs(mid-cen.c)+Math.abs(run.row-cen.r))/span));
  if(!runHasObject(run)) s+=1;
  s+=Math.min(3,Math.max(0,run.len-needed));
  return s;
}

function renderRoomLabels(cell){
  const host=$("#labels"); if(!host) return;
  host.innerHTML="";
  const b=M.bounds;

  M.rooms.forEach(room=>{
    const runs=roomRuns(room);
    if(!runs.length) return;
    const name=room.name||room.id;
    const cen=roomCentroid(room);

    /* Eerst op de normale grootte proberen, dan kleiner, dan over twee regels.
       Past het dan nog niet, dan gaat hij op de langste rij en klemmen we hem
       binnen het bord. */
    let px=LABEL_FONT_PX, lines=[name], run=null, needed=0;
    const pick=()=>{
      const wide=Math.max.apply(null,lines.map(l=>measureLabel(l,px)));
      needed=Math.ceil(wide/cell);
      const fit=runs.filter(r=>r.len>=needed);
      if(!fit.length) return false;
      fit.sort((x,y)=>{
        const d=scoreRun(y,needed,cen,b)-scoreRun(x,needed,cen,b);
        if(Math.abs(d)>1e-9) return d;
        if(x.row!==y.row) return x.row-y.row;
        return x.start-y.start;
      });
      run=fit[0];
      return true;
    };

    if(!pick()){
      px=LABEL_FONT_PX*0.82;
      if(!pick()){
        const words=String(name).split(/\s+/);
        if(words.length>1){
          const half=Math.ceil(words.length/2);
          lines=[words.slice(0,half).join(" "), words.slice(half).join(" ")];
          pick();
        }
      }
    }
    if(!run){
      run=runs.slice().sort((x,y)=>y.len-x.len || x.row-y.row || x.start-y.start)[0];
    }

    const el=document.createElement("div");
    el.className="room-label";
    const sp=document.createElement("span");
    sp.style.fontSize=px+"px";
    sp.style.whiteSpace=lines.length>1?"normal":"nowrap";
    sp.textContent=lines.join(" ");
    if(lines.length>1) sp.innerHTML=lines.map(esc).join("<br>");
    el.appendChild(sp);

    /* Binnen het bord houden: een naam die breder is dan zijn rij mag
       uitsteken, maar nooit buiten de contour. */
    const left=(run.start-b.minC)*cell;
    el.style.left=left+"px";
    el.style.top=((run.row-b.minR)*cell)+"px";
    el.style.width=(run.len*cell)+"px";
    el.style.height=cell+"px";
    el.dataset.tiles=Array.from({length:run.len},(_,i)=>"c"+(run.start+i)+"r"+run.row).join(" ");
    host.appendChild(el);

    const pill=sp.getBoundingClientRect().width;
    let shift=0;
    if(pill>run.len*cell){
      const over=(pill-run.len*cell)/2;
      const boardW=b.cols*cell;
      if(left-over<0) shift=over-left;
      else if(left+run.len*cell+over>boardW) shift=boardW-(left+run.len*cell+over);
    }
    el.dataset.shiftX=String(Math.round(shift));
  });
  updateLabelFloat();
}

/* Een naam die op dezelfde tegel als een pion staat, schuift omhoog. */
function updateLabelFloat(){
  const host=$("#labels"); if(!host) return;
  const b=M&&M.bounds;
  host.querySelectorAll(".room-label").forEach(el=>{
    const ids=(el.dataset.tiles||"").split(" ").filter(Boolean);
    const bezet=ids.some(id=>!!personOnTile(id));
    /* Op de bovenste rij is er geen ruimte boven de tegel; dan naar beneden. */
    const rij=ids.length?(M.tiles.get(ids[0])||{}).row:null;
    const omhoog=bezet && !(b && rij===b.minR);
