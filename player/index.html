    el.classList.toggle("floating-top",omhoog);
    el.classList.toggle("floating-down",bezet && !omhoog);
    /* 58% van de tegel: een pion beslaat er 80% van, dus de helft opschuiven
       is net niet genoeg om er helemaal onderuit te komen. */
    const h=el.offsetHeight||0;
    const dy=bezet ? (omhoog ? -0.58*h : 0.58*h) : 0;
    const dx=parseFloat(el.dataset.shiftX||"0");
    el.style.transform=(dx||dy) ? ("translate("+dx+"px,"+Math.round(dy)+"px)") : "";
  });
}

/* Vloersoort van een ruimte: uit de export, anders afgeleid van het ruimtetype. */
/* Ondergronden met een ingebouwde textuur. Elke naam die de builder meegeeft
   werkt ook zonder dat hij hier staat: dan is de tegel effen en kun je hem een
   eigen uiterlijk geven met Assets/backgrounds/floor-<naam>.svg. */
const FLOORS=["wood","stone","tile","carpet","marble","concrete","dirt","grass","gravel"];
const KIND_FLOOR={
  hall:"stone",corridor:"stone",gatehouse:"stone","great-hall":"stone",chapel:"stone",cellar:"stone",
  "wine-cellar":"stone",storage:"stone",forge:"stone",armoury:"stone",dungeon:"stone",keep:"stone",
  watchtower:"stone",terrace:"stone",
  "living-room":"wood","dining-room":"wood",library:"wood",study:"wood",bedroom:"wood",
  "music-room":"wood",attic:"wood",
  kitchen:"tile",bathroom:"tile",conservatory:"tile",
  office:"carpet","billiard-room":"carpet",
  ballroom:"marble",garage:"concrete",stable:"dirt",garden:"grass",courtyard:"gravel"
};
/* Welke ingebouwde textuur deze ruimte krijgt. Leeg = effen vlak. */
function roomFloor(room){
  if(!room) return "";
  const f=String(room.floor||"").toLowerCase();
  if(FLOORS.indexOf(f)>=0) return f;
  const k=String(room.kind||"").toLowerCase();
  return KIND_FLOOR[k]||"";
}
/* Onder welke naam de eigen vloertekening gezocht wordt. Dit is de ondergrond
   zoals de builder hem noemt, ook als er geen ingebouwde textuur voor bestaat,
   zodat je zelf nieuwe soorten ondergrond kunt toevoegen zonder de code aan te
   raken. Heeft de ruimte geen ondergrond, dan valt hij terug op het soort. */
function roomFloorArt(room){
  if(!room) return "";
  return assetSlug(room.floor) || roomFloor(room) || assetSlug(room.kind);
}
/* Markeert de zijdes waar hetzelfde object doorloopt, zodat een footprint van
   meerdere tegels als één aaneengesloten meubelstuk oogt. */
function joinSides(el,c,r,objectId){
  const same=(cc,rr)=>{
    const n=M.tiles.get("c"+cc+"r"+rr);
    return !!(n && n.objectId===objectId);
  };
  if(same(c,r-1)) el.classList.add("j-t");
  if(same(c+1,r)) el.classList.add("j-r");
  if(same(c,r+1)) el.classList.add("j-b");
  if(same(c-1,r)) el.classList.add("j-l");
}

/* Eén icoon per object in plaats van per tegel: bij een rechte footprint staat het
   icoon gecentreerd over het hele meubelstuk, bij een hoekvorm blijft het per tegel. */
/* ============================================================
   4b. Eigen tekeningen uit de Assets-map
   ------------------------------------------------------------
   Elk object, personage en vloertype mag een eigen tekening krijgen als los
   bestand in ../Assets/. Staat het bestand er niet, dan blijft het ingebouwde
   pictogram gewoon staan; er verschijnt geen foutmelding. Zie assets/README.md
   voor de bestandsnamen en het formaat.
   ============================================================ */
const ASSET_DIR="../assets/art/";
const ASSET_EXT="svg";
/* Het versienummer van de bank hangt achter elke tekening-URL, zodat een
   bijgewerkte tekening niet uit de cache van de browser blijft komen. Bump
   "version" in assets/manifest.json en draai het buildscript. */
const ASSET_VERSION=(AssetBank.manifest.version||1);

function assetSlug(s){
  return String(s||"").toLowerCase().trim()
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}
function assetUrl(folder,file,ext){
  return ASSET_DIR+folder+"/"+file+"."+(ext||ASSET_EXT)+assetBust(ASSET_VERSION);
}
/* Het thema van het niveau (medieval, modern, ...) als submap. Zo kan dezelfde
   objectsoort er per thema anders uitzien zonder dat de naam verandert. Bestaat
   de submap niet, dan wordt gewoon de gedeelde tekening gebruikt. */
function assetThemeDir(){
  const t=assetSlug(M&&M.theme);
  return t?t+"/":"";
}
/* Zet elke naam eerst in de thema-submap, daarna in de gedeelde map. */
function withThemeFallback(folder,names){
  const th=assetThemeDir(), out=[];
  /* Gerenderde themastukken zijn PNG, de getekende basis is SVG. PNG eerst:
     staat er een render, dan wint die; anders valt hij door naar de tekening.
     Het beeld wordt altijd naar zijn vak geschaald (object-fit/contain), dus
     een hogere resolutie uploaden maakt alleen scherper, nooit groter. */
  if(th) names.forEach(n=>{ out.push(assetUrl(folder,th+n,"png")); out.push(assetUrl(folder,th+n)); });
  names.forEach(n=>out.push(assetUrl(folder,n)));
  return out;
}
/* Probeert de kandidaten op volgorde. De eerste die laadt wint; lukt er geen
   enkele, dan wordt er niets toegevoegd en blijft de fallback zichtbaar. */
function mountAsset(host,candidates,flagEl,flagClass){
  if(!candidates.length) return null;
  let i=0;
  const img=document.createElement("img");
  img.alt=""; img.setAttribute("aria-hidden","true"); img.decoding="async";
  img.addEventListener("error",function(){
    i++;
    if(i<candidates.length) img.src=candidates[i]; else img.remove();
  });
  img.addEventListener("load",function(){
    if(flagEl) flagEl.classList.add(flagClass);
  });
  host.appendChild(img);
  img.src=candidates[0];
  return img;
}
/* Objecten: eerst de maatvariant (tafel-2x1), dan de gewone tekening. */
function objectAssetCandidates(kind,w,h){
  const slug=assetSlug(kind);
  if(!slug) return [];
  const names=[];
  if(w>1||h>1) names.push(slug+"-"+w+"x"+h);
  names.push(slug);
  return withThemeFallback("objects",names);
}
/* Personages: eerst op naam, dan op geslacht, dan een algemene tekening. */
function personAssetCandidates(person){
  const names=[];
  const name=assetSlug(person&&person.name);
  if(name) names.push(name);
  const g=assetSlug(person&&person.gender);
  if(g) names.push(g);
  names.push("person");
  return withThemeFallback("characters",names);
}
/* Hoeveel tekeningen er van een vloersoort klaarstaan. Staat in de bank, niet
   hier: de bestanden en dit getal horen bij elkaar. */
function floorVariantCount(id){
  const fa=AssetBank.manifest.floorArt;
  const n=fa&&fa.variants?fa.variants[id]:0;
  return Math.max(1, n||1);
}
function floorArtName(id,n){ return n<=1 ? "floor-"+id : "floor-"+id+"-"+n; }

/* Vloeren: een tegelbare tekening per vloertype, herhaald over de ruimte.
   Twee kamers met dezelfde vloer zouden in elkaar overlopen, dus krijgt elke
   volgende kamer de volgende variant: gras 1, gras 2, gras 3... Zijn er meer
   kamers dan varianten, dan begint het rijtje opnieuw. De volgorde is die van
   de kamers in het level, dus hij ligt vast en springt niet per keer. */
function applyFloorArt(){
  const perVloer=new Map();
  M.rooms.forEach(function(r){
    const f=roomFloorArt(r); if(!f) return;
    if(!perVloer.has(f)) perVloer.set(f,[]);
    perVloer.get(f).push(r.id);
  });
  perVloer.forEach(function(kamers,f){
    const aantal=floorVariantCount(f);
    kamers.forEach(function(roomId,i){
      const n=(i%aantal)+1;
      /* De genummerde variant eerst; ontbreekt die, dan de basistekening. */
      const namen=n>1?[floorArtName(f,n),"floor-"+f]:["floor-"+f];
      const urls=withThemeFallback("backgrounds",namen);
      let j=0;
      const probe=new Image();
      probe.onerror=function(){ j++; if(j<urls.length) probe.src=urls[j]; };
      probe.onload=function(){
        const url=urls[j];
        $$('#grid .tile[data-room="'+roomId+'"][data-floor-art="'+f+'"]').forEach(function(t){
          t.classList.add("has-floor-art");
          t.style.backgroundImage='url("'+url+'")';
        });
      };
      probe.src=urls[0];
    });
  });
}

function planObjectIcons(){
  const plan=new Map();
  M.objects.forEach(o=>{
    const tiles=(o.tiles||[]).map(id=>M.tiles.get(id)).filter(Boolean);
    if(!tiles.length) return;
    const rows=tiles.map(t=>t.row), cols=tiles.map(t=>t.column);
    const r0=Math.min.apply(null,rows), r1=Math.max.apply(null,rows);
    const c0=Math.min.apply(null,cols), c1=Math.max.apply(null,cols);
    const w=c1-c0+1, h=r1-r0+1;
    const line=(w===1||h===1);
    if(tiles.length>1 && line && w*h===tiles.length){
      plan.set("c"+c0+"r"+r0,{w:w,h:h});
    } else {
      tiles.forEach(t=>plan.set(t.id,{w:1,h:1}));
    }
  });
  return plan;
}

function renderBoard(){
  const grid=$("#grid"), b=M.bounds;
  grid.innerHTML="";
  $("#labels").innerHTML=""; $("#pawns").innerHTML="";
  $("#gridWrap").classList.toggle("regular",b.regular);
  grid.style.gridTemplateColumns="repeat("+b.cols+", var(--cell))";
  grid.style.gridTemplateRows="repeat("+b.rows+", var(--cell))";
  const iconPlan=planObjectIcons();

  for(let r=b.minR;r<=b.maxR;r++){
    for(let c=b.minC;c<=b.maxC;c++){
      const id="c"+c+"r"+r;
      const t=M.tiles.get(id);
      const el=document.createElement("div");
      el.className="tile";
      el.style.gridColumn=c-b.minC+1; el.style.gridRow=r-b.minR+1;
      const room=getTileRoom(c,r);
      /* Geen tegel of geen ruimte: buiten de speelruimte, grijs gemarkeerd. */
      if(!t || !room){ el.classList.add("out-of-bounds"); grid.appendChild(el); continue; }
      el.dataset.tile=id;
      el.style.backgroundColor=room.color||"#DCE3EF";
      /* Voor geklede skins: de ruimtekleur ook als waas-variabele, zodat een
         materiaalvloer (hout, gras) er zijn eigen kleur onder kan leggen en de
         ruimte tóch herkenbaar getint blijft. */
      el.style.setProperty("--roomtint",room.color||"#DCE3EF");
      /* Vloertextuur volgt het type ruimte; onbekend of leeg wordt effen. */
      const floor=roomFloor(room);
      if(floor) el.dataset.floor=floor;
      const floorArt=roomFloorArt(room);
      if(floorArt) el.dataset.floorArt=floorArt;
      /* De kamer erbij, want de vloertekening wordt per kamer gekozen. */
      el.dataset.room=room.id;
      /* Een voorbehouden gebied licht af en toe even op; alle vakjes van
         dezelfde kamer in dezelfde maat, zodat het hele gebied ademt. */
      if(roomWallStyle(room).prio>1){
        el.classList.add("edel");
        const gl=document.createElement("i"); gl.className="glans";
        let h=0; for(const ch of String(room.id)) h=(h*31+ch.charCodeAt(0))&0xffff;
        gl.style.animationDelay=(-(h%7)*1.3)+"s";
        el.appendChild(gl);
      }
      if(t.status==="blocked"){
        el.classList.add("blocked");
        /* Licht waas over elke onbegaanbare tegel; de vloer en de tekening
           blijven er gewoon doorheen te zien. */
        const mask=document.createElement("div");
        mask.className="blockmask";
        el.appendChild(mask);
      }
      if(t.status==="occupiable") el.classList.add("occupiable");
      if(t.objectId){
        const o=M.objects.get(t.objectId);
        const kind=o?(o.kind||o.name):"";
        /* Materiaalvlak van het object, met open randen waar hetzelfde object doorloopt. */
        const surf=document.createElement("div");
        surf.className="objsurf";
        applyObjectSurface(el,kind,t.status);
        el.appendChild(surf);
        joinSides(el,c,r,t.objectId);
        const plan=iconPlan.get(id);
        if(plan){
          const ic=document.createElement("div");
          ic.className="objicon";
          if(plan.w>1||plan.h>1){
            ic.style.inset="auto";
            ic.style.left="calc(var(--cell) * "+(plan.w*0.2)+")";
            ic.style.top="calc(var(--cell) * "+(plan.h*0.2)+")";
            ic.style.width="calc(var(--cell) * "+(plan.w*0.6)+")";
            ic.style.height="calc(var(--cell) * "+(plan.h*0.6)+")";
          }
          ic.innerHTML=objectIcon(kind);
          el.appendChild(ic);
          /* Eigen tekening uit assets/art/objects/, over de hele omvang van het
             object heen. Ontbreekt hij, dan blijft het pictogram hierboven. */
          const art=document.createElement("div");
          art.className="objart";
          art.style.width="calc(var(--cell) * "+plan.w+" - var(--art-pad) * 2)";
          art.style.height="calc(var(--cell) * "+plan.h+" - var(--art-pad) * 2)";
          el.appendChild(art);
          mountAsset(art,objectAssetCandidates(kind,plan.w,plan.h),el,"has-art");
        }
      }
      attachTileInput(el,id);
      grid.appendChild(el);
    }
  }
  applyFloorArt();
  paintBoard();
  fitBoard();
}

/* Muren als losse SVG-laag: vrij in dikte, kleur en stippels. */
function renderWalls(cell){
  const svg=$("#walls"), bb=M.bounds;
  const W=bb.cols*cell, H=bb.rows*cell;
  svg.setAttribute("width",W); svg.setAttribute("height",H);
  svg.setAttribute("viewBox","0 0 "+W+" "+H);

  const thin=[], walls=new Map();
  /* Randen van het bord die bij een besloten ruimte horen. De contour wordt
     als één doorlopend pad getekend en kent geen ruimtes, dus die stukken
     krijgen er hun kleur bovenop. */
  const randen=[];
  const sides=[[0,-1,"top"],[1,0,"right"],[0,1,"bottom"],[-1,0,"left"]];
  const SIDECLASS={top:"w-t",right:"w-r",bottom:"w-b",left:"w-l"};
  const wall=Math.max(3,Math.round(cell*0.095));
  /* Dezelfde dikte voor de SVG en voor de CSS die de notitieletters laat
     uitwijken; anders raken die letters bij een dikke muur toch de rand. */
  document.documentElement.style.setProperty("--wall-w",wall+"px");

  $$("#grid .tile").forEach(el=>el.classList.remove("w-t","w-r","w-b","w-l"));

  for(let r=bb.minR;r<=bb.maxR;r++) for(let c=bb.minC;c<=bb.maxC;c++){
    const t=M.tiles.get("c"+c+"r"+r); if(!t) continue;
    const x0=(c-bb.minC)*cell, y0=(r-bb.minR)*cell, x1=x0+cell, y1=y0+cell;
    const st=roomWallStyle(M.rooms.get(t.roomId));
    const el=$('#grid .tile[data-tile="c'+c+'r'+r+'"]');
    sides.forEach(sd=>{
      const nb=M.tiles.get("c"+(c+sd[0])+"r"+(r+sd[1]));
      let a,b;
      if(sd[2]==="top"){a=[x0,y0];b=[x1,y0];}
      else if(sd[2]==="right"){a=[x1,y0];b=[x1,y1];}
      else if(sd[2]==="bottom"){a=[x0,y1];b=[x1,y1];}
      else {a=[x0,y0];b=[x0,y1];}
      /* Geen buurtegel: dat is de rand van het bord en die tekent de contour
         als één doorlopende lijn, niet als losse randjes per tegel. */
      if(!nb){
        if(el) el.classList.add(SIDECLASS[sd[2]]);
        if(st.prio>1) randen.push({a,b,colors:st.colors});
      } else if(nb.roomId!==t.roomId){
        if(el) el.classList.add(SIDECLASS[sd[2]]);
        const k=[a[0],a[1],b[0],b[1]].join(",");
        const cur=walls.get(k);
        if(!cur || st.prio>cur.prio) walls.set(k,{a,b,colors:st.colors,prio:st.prio});
      } else if(sd[2]==="right"||sd[2]==="bottom"){
        thin.push({a,b});
      }
    });
  }

  let out="";
  thin.forEach(s=>{
    out+='<line x1="'+s.a[0]+'" y1="'+s.a[1]+'" x2="'+s.b[0]+'" y2="'+s.b[1]
       +'" stroke="rgba(20,22,46,.13)" stroke-width="1"/>';
  });
  Array.from(walls.values()).sort((a,b)=>a.prio-b.prio).forEach(s=>{
    out+=wallSegmentsSVG(s.a,s.b,s.colors,wall);
  });
  /* De contour bovenop, zodat hij nergens door een ruimtemuur wordt doorsneden. */
  const outline=boardOutlinePath(cell);
  if(outline){
    const t=Math.max(3,cell*0.09);
    out+='<path d="'+outline+'" fill="none" stroke="rgba(21,26,51,.22)" stroke-width="'+(t+3)
       +'" stroke-linejoin="round" stroke-linecap="round" transform="translate(0,2.5)"/>';
    out+='<path d="'+outline+'" fill="none" stroke="var(--board-ink)" stroke-width="'+t
       +'" stroke-linejoin="round" stroke-linecap="round"/>';
    /* En daar bovenop de stukken buitenrand die bij een besloten ruimte horen,
       met dezelfde dikte als de contour zodat het één doorlopende muur blijft
       en niet een streepje op een lijn. */
    randen.forEach(sd => { out+=wallSegmentsSVG(sd.a,sd.b,sd.colors,t); });
  }
  svg.innerHTML=out;
}

/* De buitenrand van het bord als één pad. We verzamelen elke zijde van een
   tegel die geen buurtegel heeft, allemaal met dezelfde draairichting, en
   rijgen ze aan elkaar tot gesloten lussen. Een bord met een gat erin levert
   zo vanzelf twee lussen op: de buitenrand en de rand van het gat. */
function boardOutlinePath(cell){
  const b=M.bounds;
  const has=(c,r)=>!!M.tiles.get("c"+c+"r"+r);
  const segs=new Map();
  const add=(ax,ay,bx,by)=>{
    const k=ax+","+ay;
    if(!segs.has(k)) segs.set(k,[]);
    segs.get(k).push([bx,by]);
  };
  let n=0;
  for(let r=b.minR;r<=b.maxR;r++) for(let c=b.minC;c<=b.maxC;c++){
    if(!has(c,r)) continue;
    const x=c-b.minC, y=r-b.minR;
    if(!has(c,r-1)){ add(x,y,x+1,y); n++; }
    if(!has(c+1,r)){ add(x+1,y,x+1,y+1); n++; }
    if(!has(c,r+1)){ add(x+1,y+1,x,y+1); n++; }
    if(!has(c-1,r)){ add(x,y+1,x,y); n++; }
  }
  let d="";
  while(n>0){
    let start=null;
    for(const [k,v] of segs){ if(v.length){ start=k; break; } }
    if(!start) break;
    const s=start.split(",").map(Number);
    let cx=s[0], cy=s[1];
    const pts=[[cx,cy]];
    for(;;){
      const list=segs.get(cx+","+cy);
      if(!list || !list.length) break;
      const nx=list.shift(); n--;
      pts.push(nx);
      cx=nx[0]; cy=nx[1];
      if(cx===s[0] && cy===s[1]) break;
    }
    if(pts.length<2) continue;
    /* Rechte stukken samenvoegen: minder punten, vloeiender hoeken. */
    const keep=[pts[0]];
    for(let i=1;i<pts.length-1;i++){
      const a=keep[keep.length-1], m=pts[i], z=pts[i+1];
      const straight=(a[0]===m[0]&&m[0]===z[0])||(a[1]===m[1]&&m[1]===z[1]);
      if(!straight) keep.push(m);
    }
    keep.push(pts[pts.length-1]);
    d+="M"+keep.map(p=>(p[0]*cell)+" "+(p[1]*cell)).join("L")+"Z";
  }
  return d;
}
/* Tekent een muursegment als aaneengesloten, effen stukjes; bij meerdere
   toegestane rollen wisselen de kleuren elkaar af, zonder open plekken. */
function wallSegmentsSVG(a,b,colors,width){
  if(colors.length===1){
    return '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]
      +'" stroke="'+colors[0]+'" stroke-width="'+width+'" stroke-linecap="square"/>';
  }
  const reps=2, n=colors.length*reps;
  let out="";
  for(let i=0;i<n;i++){
    const t0=i/n, t1=(i+1)/n;
    const x1=a[0]+(b[0]-a[0])*t0, y1=a[1]+(b[1]-a[1])*t0;
    const x2=a[0]+(b[0]-a[0])*t1, y2=a[1]+(b[1]-a[1])*t1;
    out+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2
      +'" stroke="'+colors[i%colors.length]+'" stroke-width="'+width+'" stroke-linecap="square"/>';
  }
  return out;
}

function tekenKopStand(){
  const el=$("#kopStand"); if(!el||!M) return;
  el.textContent=placed.size+"/"+M.people.length;
  /* Goud is een uitnodiging: die hoort er pas te zijn als er echt iets te
     controleren valt. */
  const knop=$("#btnCheck");
  if(knop) knop.classList.toggle("klaar",placed.size===M.people.length && M.people.length>0);
}
function paintBoard(){
  tekenKopStand();
  const pawnHost=$("#pawns"); if(pawnHost) pawnHost.innerHTML="";
  const bb=M.bounds;
  $$("#grid .tile[data-tile]").forEach(el=>{
    const id=el.dataset.tile;
    el.querySelectorAll(".note-marks,.note-cross,.pawn").forEach(n=>n.remove());

    const pid=personOnTile(id);
    el.classList.toggle("has-pawn",!!pid);
    if(pid){
      const p=M.peopleById.get(pid);
      const role=personRole(p);
      /* Kleur plus letter is alles wat de pion hoeft te zeggen; de stand komt
         er als klein pictogram bij. De volledige naam staat in het radiaal
         menu en bij de regels. */
      const pawn=document.createElement("div");
      pawn.className="pawn "+role+(pid===justPlaced?" land":"");
      pawn.style.setProperty("--pc",p.color);
      pawn.title=p.name+(p.standingLabel?" \u2014 "+p.standingLabel:"");

      const init=document.createElement("span");
      init.className="init"; init.textContent=p.letter;
      init.dataset.len=String(p.letter.length);
      init.style.color=inkOnColor(p.color);
      pawn.appendChild(init);

      /* Alleen een rolteken als die rol in dit level ergens toe doet. Staat er
         nergens een regel of een deur die dorpelingen noemt, dan is een teken
         naast elke pion alleen maar drukte. Het is dezelfde vorm als achter het
         portret -- een schild, een banier -- zodat je die twee aan elkaar
         knoopt zonder erover na te denken. */
      const rolVorm=(p.standing && rolDoetErToe(p.standing)) ? rolBadge(p.standing) : "";
      if(rolVorm){
        const badge=document.createElement("span");
        badge.className="role-badge";
        badge.title=p.standingLabel||"";
        badge.innerHTML=rolVorm;
        pawn.appendChild(badge);
      }

      if(revealed && pid===M.culpritId){
        const mk=document.createElement("span");
        mk.className="mark"; mk.innerHTML=icon("dagger",{sw:2.2});
        pawn.appendChild(mk);
      }
      /* De pion hoort op de pionnenlaag, boven de muren. Zat hij in de tegel,
         dan tilde die tegel zijn eigen ondergrond over de muur heen. */
      const tt=M.tiles.get(id);
      const slot=document.createElement("div");
      slot.className="pawn-slot";
      slot.style.left="calc(var(--cell) * "+(tt.column-bb.minC)+")";
      slot.style.top="calc(var(--cell) * "+(tt.row-bb.minR)+")";
      slot.appendChild(pawn);
      if(pawnHost) pawnHost.appendChild(slot);
    }

    /* Een geplaatste persoon overschrijft alle notities op zijn tegel; notities
       over een persoon die elders al vaststaat, zijn ook overal verborgen (niet
       verwijderd) tot die persoon weer van het bord gehaald wordt. */
    if(!pid){
      const n=notes.get(id);
      if(n){
        if(n.cross && visibility.crosses){
          const cr=document.createElement("div");
          cr.className="note-cross"+(kruisEerder.has(id)?" stil":"");
          if(kruisVertraging.has(id)) cr.style.animationDelay=kruisVertraging.get(id)+"ms";
          kruisEerder.add(id);
          /* Eén streek, geen lichte onderlaag: een groot kruis over het hele
             vakje is ook op een fors object niet te missen. */
          cr.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round">'
            +'<path d="M4 4l16 16M20 4L4 20" stroke="#DC4A46" stroke-width="2.4"/></svg>';
          el.appendChild(cr);
        }
        /* Letters blijven bewaard onder een kruis, maar tonen we niet tegelijk
           -- ook niet als het kruis zelf verborgen staat, want dan zou er iets
           anders komen te staan dan wat er genoteerd is. Haal je het kruis weg,
           dan verschijnen ze gewoon weer. */
        const marked=[];
        if(visibility.notes && !n.cross) n.marks.forEach((v,personId)=>{
          if(placed.has(personId)) return;
          const p=M.peopleById.get(personId); if(p) marked.push(p);
        });
        if(marked.length){
          const wrap=document.createElement("div"); wrap.className="note-marks";
          marked.forEach(p=>{
            const s=document.createElement("span");
            s.textContent=p.letter; s.style.color=p.color;
            wrap.appendChild(s);
          });
          el.appendChild(wrap);
        }
      }
    }
  });
  justPlaced=null;
  kruisVertraging.clear();
  /* Wat nu geen kruis meer is, mag straks weer opspringen. */
  kruisEerder.forEach(id=>{ const n=notes.get(id); if(!n||!n.cross) kruisEerder.delete(id); });
  updateLabelFloat();
  updateActionState();
}

function fitBoard(){
  if(!M) return;
  const vp=$("#boardViewport");
  /* Wat lucht om het bord: de contourmuur wordt op de rand getekend en steekt
     dus half naar buiten. */
  /* Opzij alleen ruimte voor de dikte van de buitenmuur: het bord loopt tot
     de rand van het scherm. Boven en onder houdt het wat lucht. */
  const marge = 20;
  const w=vp.clientWidth-6, h=vp.clientHeight-marge;
  if(w<=0||h<=0) return;
  /* Op de werkelijke omvang schalen, niet op het opgegeven raster: anders
     krimpt een strook van 7x9 mee met een leeg raster van 12x12. */
  const b=M.bounds;
  const cell=Math.max(22, Math.floor(Math.min(w/b.cols, h/b.rows)));
  document.documentElement.style.setProperty("--cell",cell+"px");
  renderWalls(cell);
  renderRoomLabels(cell);
}

/* ============================================================
   7. Tegel-input: tik = radiaal menu, lang indrukken = kruis
   ============================================================ */
const LONGPRESS_MS=420;
function shakeTile(el){
  haptic(30);
  el.classList.remove("shake");
  void el.offsetWidth;
  el.classList.add("shake");
  setTimeout(()=>el.classList.remove("shake"),340);
}
function attachTileInput(el,tileId){
  let timer=null, fired=false, sx=0, sy=0, moved=false, veeg=null;
  const cancel=()=>{ clearTimeout(timer); timer=null; el.classList.remove("pressing"); };
  el.addEventListener("pointerdown",e=>{
    if(revealed) return;
    /* Onder een open radiaal menu doet het vakje in het gat niets: slepen
       daarvandaan sluit het menu, en dat hoort niet ook nog een kruis te zetten. */
    if($("#radial").classList.contains("open")) return;
    fired=false; moved=false; veeg=null; sx=e.clientX; sy=e.clientY;
    try{ el.setPointerCapture(e.pointerId); }catch(x){}
    el.classList.add("pressing");
    timer=setTimeout(()=>{
      fired=true; el.classList.remove("pressing");
      toggleCross(tileId);
      /* Blijf je vasthouden en veeg je over de rij of de kolom, dan krijgen
         die vakjes hetzelfde kruis: in één beweging een hele lijn dicht. */
      const t=M.tiles.get(tileId);
      veeg={ staat:!!noteFor(tileId).cross, rij:t?t.row:null, kolom:t?t.column:null, gedaan:{} };
    },LONGPRESS_MS);
  });
  el.addEventListener("pointermove",e=>{
    if(veeg){
      /* Een duidelijke haal opzij zet de hele rij dicht, een haal omhoog of
         omlaag de hele kolom. In welke richting je gaat maakt niet uit: links
         vegen doet net zo goed de vakjes rechts van je. */
      const cel=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--cell"))||40;
      const drempel=Math.max(34,cel*0.9);
      const dx=e.clientX-sx, dy=e.clientY-sy;
      const lijnen=[];
      if(Math.abs(dx)>drempel && !veeg.gedaan.rij){ veeg.gedaan.rij=1; lijnen.push("rij"); }
      if(Math.abs(dy)>drempel && !veeg.gedaan.kolom){ veeg.gedaan.kolom=1; lijnen.push("kolom"); }
      if(!lijnen.length) return;
      let raak=0;
      M.tiles.forEach(tt=>{
        const inRij=lijnen.indexOf("rij")>=0 && tt.row===veeg.rij;
        const inKolom=lijnen.indexOf("kolom")>=0 && tt.column===veeg.kolom;
        if(!inRij && !inKolom) return;
        if(personOnTile(tt.id)) return;
        const n=noteFor(tt.id);
        if(!!n.cross!==veeg.staat){ n.cross=veeg.staat; raak++; }
      });
      if(raak){ haptic(12); paintBoard(); }
      return;
    }
    if(!timer) return;
    if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10){ moved=true; cancel(); }
  });
  el.addEventListener("pointerup",()=>{
    const wasFired=fired, wasMoved=moved;
    cancel(); veeg=null;
    if(wasFired||wasMoved||revealed) return;
    const t=M.tiles.get(tileId);
    /* Op een tegel waar niemand kan staan valt er niets te kiezen, dus er gaat
       geen menu open. Het object schudt even, dan weet je dat de tik is
       aangekomen. Een kruis komt er wel, maar net als overal pas na lang
       indrukken. */
    if(t&&t.status==="blocked"){
      shakeTile(el.querySelector(".objart")||el.querySelector(".objicon")||el);
      return;
    }
    openTileMenu(tileId,el);
  });
  el.addEventListener("pointercancel",()=>{ moved=true; cancel(); veeg=null; });
  el.addEventListener("contextmenu",e=>e.preventDefault());
}

function toggleCross(tileId){
  if(!M.tiles.get(tileId)) return;
  const n=noteFor(tileId);
  n.cross=!n.cross;
  haptic(14);
  paintBoard();
}

/* ============================================================
   8. Zoom + radiaal menu
   ============================================================ */
function resetZoom(){ $("#boardStage").style.transform=""; }

/* Waar staat dit vakje als het bord niet vergroot zou zijn? Via de
   offset-keten, want die is niet afhankelijk van de transform. Eerder werd de
   zoom even op nul gezet om te kunnen meten; dat gaf een zichtbare sprong
   zodra je een tweede vakje aantikte terwijl het bord nog ingezoomd stond. */
function basisPlek(el, stage){
  let x=0, y=0, n=el;
  while(n && n!==stage){ x+=n.offsetLeft; y+=n.offsetTop; n=n.offsetParent; }
  return { x, y, w:el.offsetWidth, h:el.offsetHeight };
}

function zoomToTile(tileEl){
  const stage=$("#boardStage"), vp=$("#boardViewport");
  const vr=vp.getBoundingClientRect();
  const sw=stage.offsetWidth, sh=stage.offsetHeight;
  /* Linkerbovenhoek van het bord zoals het zonder vergroting zou liggen. */
  let ox=0, oy=0, n=stage;
  while(n && n!==vp){ ox+=n.offsetLeft; oy+=n.offsetTop; n=n.offsetParent; }
  const s0={ x: vr.left - vp.scrollLeft + ox, y: vr.top - vp.scrollTop + oy };

  const b=basisPlek(tileEl, stage);

  /* De tegel krijgt altijd ongeveer dezelfde maat op het scherm, wat voor bord
     je ook speelt: op een klein bord wordt er dus minder ver ingezoomd dan op
     een groot. Zo staat hij ruim binnen de ring en herken je hem meteen. */
  const target=Math.min(vr.width*0.26, 116);
  const Z=Math.min(4.5, Math.max(1.2, target/Math.max(1,b.w)));

  const C={ x:s0.x+sw/2, y:s0.y+sh/2 };                 /* draaipunt */
  const P={ x:s0.x+b.x+b.w/2, y:s0.y+b.y+b.h/2 };       /* midden van de tegel */
  const V={ x:vr.left+vr.width/2, y:vr.top+vr.height/2 };
  /* Precies centreren, zonder terug te duwen als het bord daardoor buiten
     beeld steekt. Dat terugduwen zette de tegel uit het midden van de ring en
     dan is niet meer te zien welke je hebt aangetikt; de sluier eromheen maakt
     de lege ruimte naast het bord toch onzichtbaar. */
  const tx=V.x-C.x-Z*(P.x-C.x), ty=V.y-C.y-Z*(P.y-C.y);
  stage.style.transform="translate("+tx.toFixed(1)+"px,"+ty.toFixed(1)
    +"px) scale("+Z.toFixed(3)+")";
  /* De plek en de maat die het vakje straks op het scherm heeft; daar wordt
     het gat in de sluier precies op gemaakt. */
  return { x:V.x, y:V.y, w:b.w*Z, h:b.h*Z };
}

function openTileMenu(tileId,el){
  if(!M.tiles.get(tileId)) return;
  clearTimeout(radialOpenTimer);
  $$("#grid .tile").forEach(x=>x.classList.remove("selected"));
  el.classList.add("selected");
  /* Ingezoomd wil je het vakje en de kring zien, niet de kamernaam erdoorheen. */
  document.body.classList.add("radiaal-open");
  /* Eerst de sluier aanzetten en pas daarna meten: het openen legt de pagina
     vast en verschuift de indeling, en wie daarvoor meet mikt ernaast. */
  $("#radial").classList.add("open");
  const center=zoomToTile(el);
  /* Meteen mee, in dezelfde beweging als de zoom. Wachten tot het bord stil
     lag voelde als een hapering tussen je tik en het menu. */
  openRadial(center,tileId);
}
function closeRadial(){
  clearTimeout(radialOpenTimer);
  $("#radial").classList.remove("open");
  document.body.classList.remove("radiaal-open");
  /* Het objectlabel hoort bij dít vakje; laat het niet staan voor het volgende. */
  { const o=$("#radialObj"); if(o) o.hidden=true; }
  $("#radialRing").classList.remove("crowded");
  $("#radialRing").innerHTML="";
  $$("#grid .tile").forEach(x=>x.classList.remove("selected"));
  resetZoom();
}

/* Het gekozen vakje uit de sluier knippen. Buitenom het hele scherm, daarbinnen
   het vakje in de omgekeerde richting: met evenodd wordt dat een gat. */
/* Ronding van het uitgeknipte vakje en de dikte van het kader eromheen. Ze
   horen bij elkaar: het kader moet de snijrand helemaal afdekken. */
const GAT_RONDING=8, KADER_LIJN=2;

function legSluier(g){
  const bd=$("#radialBackdrop");
  if(!bd || !g) return;
  const W=window.innerWidth, H=window.innerHeight;
  /* Iets naar binnen: de muren liggen half over de rand van het vakje en
     staken anders als een reepje buiten de uitsnede. */
  const x0=Math.floor(g.x-g.w/2)+2, y0=Math.floor(g.y-g.h/2)+2;
  const x1=Math.ceil(g.x+g.w/2)-2,  y1=Math.ceil(g.y+g.h/2)-2;
  /* De uitknip krijgt dezelfde ronding als het kader. Met een rechte hoek
     stak het puntje van het vakje buiten de ronde rand van het kader uit, en
     dat zag je als een hard hoekje op de overgang naar het donker. */
  const r=Math.min(GAT_RONDING, (x1-x0)/2, (y1-y0)/2);
  const gat="M"+(x0+r)+" "+y0+
    " H"+(x1-r)+" A"+r+" "+r+" 0 0 1 "+x1+" "+(y0+r)+
    " V"+(y1-r)+" A"+r+" "+r+" 0 0 1 "+(x1-r)+" "+y1+
    " H"+(x0+r)+" A"+r+" "+r+" 0 0 1 "+x0+" "+(y1-r)+
    " V"+(y0+r)+" A"+r+" "+r+" 0 0 1 "+(x0+r)+" "+y0+" Z";
  const pad="M0 0 H"+W+" V"+H+" H0 Z "+gat;
  bd.style.clipPath="path(evenodd, '"+pad+"')";
  bd.style.webkitClipPath="path(evenodd, '"+pad+"')";

  /* Het kader ligt half over de snijrand: de helft van de lijn valt op het
     donker, de helft op het vakje. Zo is er nergens een naadje te zien tussen
     het scherpe vakje en de vervaagde omgeving. */
  const kader=$("#radialKader");
  if(kader){
    const h=KADER_LIJN/2;
    kader.style.left=(x0-h)+"px";  kader.style.top=(y0-h)+"px";
    kader.style.width=(x1-x0+KADER_LIJN)+"px";
    kader.style.height=(y1-y0+KADER_LIJN)+"px";
    kader.style.borderRadius=(r+h)+"px";
  }
}

function openRadial(center,tileId){
  const ring=$("#radialRing");
  ring.innerHTML="";
  ring.style.left=center.x+"px";
  ring.style.top=center.y+"px";
  legSluier(center);
  const t=M.tiles.get(tileId);

  const persons=M.people;
  const N=persons.length;
  /* Alle personen op een ring. De ring is zo groot als het scherm toelaat,
     met ongeveer 400px doorsnee als streefmaat; de opening onderaan is voor
     de hulpknop. */
  const SPAN=Math.PI*1.55;
  const size=Math.min(window.innerWidth,window.innerHeight);
  const radius=Math.max(94,Math.min(190,size/2-34-18));
  /* Knoppen mogen elkaar niet raken: de afstand tussen twee buren op de ring
     is de bovengrens. Bij veel personen worden ze dus vanzelf kleiner, en de
     naam en de rol eronder krimpen mee. */
  const stepAng=(N>1)?SPAN/(N-1):Math.PI;
  const chord=2*radius*Math.sin(Math.min(stepAng,Math.PI)/2);
  const btnSize=Math.max(38,Math.min(68,Math.floor(Math.min(chord-8,size*0.17))));
  ring.style.setProperty("--rbtn",btnSize+"px");
  ring.style.setProperty("--rlbl",Math.max(10,Math.min(14,Math.round(btnSize*0.21)))+"px");
  ring.style.setProperty("--rsub",Math.max(9,Math.min(12,Math.round(btnSize*0.18)))+"px");
  /* Krap in de ring: dan alleen de rol tonen, niet ook nog de stand. */
  ring.classList.toggle("crowded",btnSize<58);

  /* Staat er een object waar je op kunt zitten of liggen, dan hangt zijn naam
     boven de ring: dan weet je waar je iemand op zet. */
  const objEl=$("#radialObj");
  if(objEl){
    const o=(t&&t.objectId)?(M.objects.get?M.objects.get(t.objectId):null):null;
    if(o&&t.status==="occupiable"){
      const room=M.rooms.get(t.roomId);
      const rn=(room&&room.name)?room.name:"";
      objEl.hidden=false;
      objEl.innerHTML='<span class="ic">'+objectIcon(o.kind)+'</span>'
        +'<span class="wat"><b>'+esc(objectAanduiding(o))+'</b>'
        +(rn?'<i>in '+esc(rn)+'</i>':'')+'</span>';
      /* Ruim boven de ring, zodat het los staat van de poppetjes; past dat
         niet, dan eronder. */
      let oy=center.y-radius-btnSize/2-52;
      if(oy<64) oy=center.y+radius+btnSize/2+70;
      objEl.style.left=center.x+"px"; objEl.style.top=oy+"px";
    } else objEl.hidden=true;
  }

  persons.forEach((p,i)=>{
    const ang=(N===1)? -Math.PI/2 : (-Math.PI/2 - SPAN/2 + (i/(N-1))*SPAN);
    ring.appendChild(personButton(p,tileId,t,Math.cos(ang)*radius,Math.sin(ang)*radius));
  });

  /* De hulpknop staat in de opening onderaan de ring. */
  const util=document.createElement("button");
  util.style.left="0px"; util.style.top=Math.round(radius*0.68)+"px";
  if(mode==="place"){
    const occ=personOnTile(tileId);
    util.className="rbtn util remove";
    util.innerHTML=icon("trash",{sw:2.1});
    if(!occ) util.setAttribute("disabled","");
    util.addEventListener("click",()=>{ if(!occ) return; placed.delete(occ); if(easyMode||autoKruis) kruisjesWeg(tileId); haptic(22); paintBoard(); closeRadial(); });
  } else {
    util.className="rbtn util";
    util.innerHTML=icon("chevron",{sw:2.3});
    util.addEventListener("click",closeRadial);
  }
  ring.appendChild(util);
  $("#radial").classList.add("open");
  fitRing(ring);
}

/* Het menu moet in zijn geheel binnen het scherm vallen, naam en rolchip
   inbegrepen. We meten wat er werkelijk staat, schuiven het midden zo ver als
   nodig, en pas als dat niet genoeg is verkleinen we het geheel — tot 0.8, want
   daaronder wordt het onleesbaar. */
function fitRing(ring){
  const M0=12;
  ring.style.setProperty("--rscale",1);
  const meet=()=>{
    let l=Infinity,r=-Infinity,t=Infinity,b=-Infinity;
    Array.prototype.forEach.call(ring.children,el=>{
      const q=el.getBoundingClientRect();
      if(!q.width && !q.height) return;
      if(q.left<l)l=q.left; if(q.right>r)r=q.right;
      if(q.top<t)t=q.top;   if(q.bottom>b)b=q.bottom;
      Array.prototype.forEach.call(el.children,ch=>{
        const s=ch.getBoundingClientRect();
        if(!s.width && !s.height) return;
        if(s.left<l)l=s.left; if(s.right>r)r=s.right;
        if(s.top<t)t=s.top;   if(s.bottom>b)b=s.bottom;
      });
    });
    return {l,r,t,b,w:r-l,h:b-t};
  };
  let box=meet();
  if(!isFinite(box.w)) return;

  /* Past het niet eens op ware grootte, dan eerst kleiner maken. */
  const sx=(innerWidth-2*M0)/box.w, sy=(innerHeight-2*M0)/box.h;
  const s=Math.max(0.8,Math.min(1,sx,sy));
  if(s<1){
    ring.style.setProperty("--rscale",s);
    ring.style.setProperty("--rscale-from",(s*0.92).toFixed(3));
    box=meet();
  }

  /* En dan het midden verschuiven tot alles binnen de marge valt. */
  let dx=0,dy=0;
  if(box.l<M0) dx=M0-box.l;
  else if(box.r>innerWidth-M0) dx=(innerWidth-M0)-box.r;
  if(box.t<M0) dy=M0-box.t;
  else if(box.b>innerHeight-M0) dy=(innerHeight-M0)-box.b;
  if(dx||dy){
    ring.style.left=(parseFloat(ring.style.left)+dx)+"px";
    ring.style.top=(parseFloat(ring.style.top)+dy)+"px";
  }
}

/* De vorm die om het poppetje komt te staan, per stand. Alles is getekend in
   een vak van 100x100 met het portret in het midden (straal 30), zodat elke
   vorm dezelfde cirkel omsluit en er alleen omheen verschilt. */

/* Komt deze rol ergens in het level voor als iets waar de speler op moet
   letten? Twee bronnen: een ruimte die alleen voor die rol open is, en een
   aanwijzing die de rol bij naam noemt. */
const ROL_DOET = {};
function rolDoetErToe(standing){
  if (!standing) return false;
  if (standing in ROL_DOET) return ROL_DOET[standing];
  let raak = false;
  /* M.rooms is een Map van id naar ruimte. */
  if (M && M.rooms) M.rooms.forEach(r => {
    if ((r.allowedStandings || []).indexOf(standing) !== -1) raak = true;
  });
  if (!raak){
    const bank = AssetBank.roles().find(r => r.standing === standing) || {};
    const enkel = String(bank.label || roleLabel(standing) || "").toLowerCase();
    const meer  = String(bank.labelPlural || "").toLowerCase();
    const alle  = []
      .concat(M && M.clues ? M.clues : [])
      .concat(M && M.boardClues ? M.boardClues : [])
      .concat(M && M.victimClue ? [M.victimClue] : []);
    raak = alle.some(c => {
      const t = String((c && c.text) || "").toLowerCase();
      return (enkel && t.indexOf(enkel) !== -1) || (meer && t.indexOf(meer) !== -1);
    });
  }
  return (ROL_DOET[standing] = raak);
}

/* Een vlakke rolkleur wordt ter plekke een klein palet, zodat de rolvormen
   meertonig kunnen vullen in plaats van ééntonig plat. */
function mengKleur(hex, f){
  const h = hex.replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  const k = v => Math.max(0, Math.min(255, Math.round(v * f)));
  return "#" + [k(n >> 16 & 255), k(n >> 8 & 255), k(n & 255)]
    .map(v => v.toString(16).padStart(2, "0")).join("");
}
/* Meng de rolkleur naar de bordinkt tot wit erop genoeg contrast heeft; de
   rollegenda op het bord gebruikt dit voor zijn merkjes. */
const BAND_KLEUR = {};
function bandKleur(hex){
  if (BAND_KLEUR[hex]) return BAND_KLEUR[hex];
  let uit = hex;
  for (let i = 0; i < 16 && contrastMet(uit, "#FFFFFF") < 5.6; i++)
    uit = mixHex(uit, BOARD_INK, .1);
  return (BAND_KLEUR[hex] = uit);
}
/* Rolvormen, allebei uit de goedgekeurde referentie (role-shapes-reference.svg):
   - rolBadge(): het kleine merkje rechtsonder op een fiche. Alleen het
     silhouet in de vaste rolkleur, zonder pictogram erin; de vorm zelf is
     het teken. Edele goud #C9A227, ridder neutraal grijs #7E8288.
   - rolContainer(): de compacte omlijsting van een portret. De grote
     riddervorm mag koel blauwgrijs blijven; alleen het kleine merkje is
     neutraal grijs.
   De rolkleur erft nooit de persoonskleur. Alleen edele en ridder zijn
   actief; de drie ongebruikte rollen houden hun oude vorm tot daar een
   ontwerp voor is. */
const ROL_BADGE_KLEUR={noble:"#C9A227",knight:"#7E8288"};
function rolBadge(standing){
  const ink="var(--board-ink)";
  if(standing==="noble")
    return '<svg viewBox="0 0 92 132" fill="none" aria-hidden="true"><path d="M4 4h84v122l-42-25L4 126Z" fill="#C9A227" stroke="'+ink+'" stroke-width="7" stroke-linejoin="round"/></svg>';
  if(standing==="knight")
    return '<svg viewBox="0 0 92 130" fill="none" aria-hidden="true"><path d="M46 4 87 19v51c0 29-18 47-41 56C22 117 5 99 5 70V19Z" fill="#7E8288" stroke="'+ink+'" stroke-width="7" stroke-linejoin="round"/></svg>';
  return roleShapeOud(standing, roleColor(standing));
}
function rolContainer(standing){
  const ink="var(--board-ink)";
  const uid="rc"+(rolContainer._n=(rolContainer._n||0)+1);
  const grad=(a,b)=>'<defs><linearGradient id="'+uid+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient></defs>';
  if(standing==="noble")
    return '<svg viewBox="0 0 112 160" fill="none" aria-hidden="true">'+grad("#D9B75E","#B88920")
      +'<path d="M3 3h106v152l-53-28L3 155Z" fill="url(#'+uid+')" stroke="'+ink+'" stroke-width="5" stroke-linejoin="round"/></svg>';
  if(standing==="knight")
    return '<svg viewBox="0 0 112 161" fill="none" aria-hidden="true">'+grad("#A8B1BF","#6E7A8B")
      +'<path d="M56 3 109 23v65c0 36-24 58-53 69C27 146 3 124 3 88V23Z" fill="url(#'+uid+')" stroke="'+ink+'" stroke-width="5" stroke-linejoin="round"/></svg>';
  return roleShapeOud(standing, roleColor(standing));
}
/* Heeft deze rol een eigen vorm? Dorpeling is de basis en krijgt er geen. */
function heeftRolvorm(standing){
  return standing==="noble"||standing==="knight"||!!roleShapeOud(standing,"#000");
}
function roleShapeOud(standing,kleur){
  const ink="var(--board-ink)";
  /* Elke instantie krijgt een eigen gradiënt-id: staan er meerdere vormen
     inline op één pagina, dan wijst url(#id) anders altijd naar de eerste
     (en dus naar de verkeerde rolkleur). */
  const uid="rv"+(roleShape._n=(roleShape._n||0)+1);
  const licht=mengKleur(kleur,1.3), donker=mengKleur(kleur,0.62);
  const defs='<defs><linearGradient id="'+uid+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0" stop-color="'+licht+'"/><stop offset=".5" stop-color="'+kleur+'"/>'
    +'<stop offset="1" stop-color="'+donker+'"/></linearGradient></defs>';
  const wrap=inner=>'<svg viewBox="0 0 100 100" fill="none" '
    +'stroke="'+ink+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">'
    +defs+inner+'</svg>';
  const F='fill="url(#'+uid+')"';
  const bies='stroke="'+mengKleur(kleur,1.45)+'" stroke-width="1.6" opacity=".8"';
  const glim='fill="rgba(255,255,255,.20)" stroke="none"';
  switch(standing){
    case "guard":      /* schild met een band */
      return wrap('<path '+F+' d="M50 6 L88 20 v30 c0 24-17 38-38 46C29 88 12 74 12 50V20Z"/>'
                 +'<path '+glim+' d="M50 6 88 20v6C75 20 62 17 48 18c3-4.5 2-8 2-12Z"/>'
                 +'<path stroke="'+ink+'" stroke-width="3.2" d="M50 14v72M16 42h68"/>');
    case "monk":       /* kap om het hoofd */
      return wrap('<path '+F+' d="M50 4c25 0 40 18 40 42 0 30-18 48-40 54C28 94 10 76 10 46 10 22 25 4 50 4Z"/>'
                 +'<path '+bies+' d="M50 10c21 0 34 15 34 36 0 26-15 42-34 48C31 88 16 72 16 46 16 25 29 10 50 10Z"/>'
                 +'<path '+glim+' d="M50 4c12 0 22 4 29 11-11-4-24-5-36-2 3-4 5-6 7-9Z"/>');
    case "servant":    /* schort onder de cirkel */
      return wrap('<path '+F+' d="M30 56h40c8 14 10 26 10 38H20c0-12 2-24 10-38Z"/>'
                 +'<path '+glim+' d="M30 56h40l2 4H29Z"/>'
                 +'<path stroke="'+ink+'" stroke-width="2.8" d="M38 56c4 6 20 6 24 0"/>');
    default:
      /* Dorpeling is de standaardrol en krijgt geen eigen vorm: de omlijsting
         is er juist om te laten zien dat iemand géén dorpeling is. */
      return "";
  }
}

/* Eén portret voor overal buiten het bord: het poppetje met zijn gekleurde
   shirt, de vorm van zijn stand eromheen en de naam eronder. Zo ziet een
   persoon er op het introscherm, in de regels en in het radiaal menu
   hetzelfde uit. */
function personPortrait(p,opt){
  const o=opt||{};
  const wrap=document.createElement("div");
  wrap.className="portret"+(p.id===M.victimId?" victim":"");
  wrap.dataset.standing=p.standing||"";
  if(o.size) wrap.style.setProperty("--pz",o.size+"px");

  /* Edele en ridder krijgen een compacte omlijsting in de vorm van hun rol;
     de rest blijft een ronde container. De box van het portret schaalt mee
     (zie .portret[data-standing]), het gezicht staat in de uitsparing. */
  const vormSvg=(p.standing && heeftRolvorm(p.standing))?rolContainer(p.standing):"";
  if(vormSvg){
    const vorm=document.createElement("span");
    vorm.className="vorm";
    vorm.innerHTML=vormSvg;
    wrap.appendChild(vorm);
  }
  /* De ring draagt de kleur van de persoon zelf -- dezelfde kleur als zijn pion
     op het bord -- zodat je een portret en een pion aan elkaar knoopt zonder de
     naam te lezen. Wel verdiept, want de lichtste spelerskleuren verdwijnen als
     dunne ring tegen een witte kaart. */
  wrap.style.setProperty("--role-line",leesbaar(p.color));

  const face=document.createElement("span");
  face.className="gezicht";
  face.innerHTML=characterSvg(p);
  mountAsset(face,personAssetCandidates(p),face,"has-art");
  wrap.appendChild(face);
  return wrap;
}

/* Witte of donkere tekst óp een persoonskleur, naar de helderheid. */
function opKleur(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(hex||""); if(!m) return "#FFFFFF";
  const n=parseInt(m[1],16), r=n>>16, g=(n>>8)&255, b=n&255;
  return ((0.2126*r+0.7152*g+0.0722*b)/255)>0.62?"#231819":"#FFFFFF";
}
function personButton(p,tileId,t,x,y){
  const b=document.createElement("button");
  b.className="rbtn";
  b.style.left=x.toFixed(1)+"px"; b.style.top=y.toFixed(1)+"px";
  b.style.setProperty("--pc",p.color);
  b.style.setProperty("--pc-tekst",opKleur(p.color));
  if(personRole(p)==="victim") b.classList.add("victim");
  b.title=p.name+(p.standingLabel?" \u2014 "+p.standingLabel:"");

  /* Het poppetje: eigen gezicht, shirt in de kleur van de persoon. Staat er
     een eigen tekening in assets/art/characters/, dan komt die eroverheen. */
  const face=document.createElement("span");
  face.className="face";
  face.innerHTML=characterSvg(p);
  mountAsset(face,personAssetCandidates(p),face,"has-art");
  b.appendChild(face);

  const lbl=document.createElement("span");
  lbl.className="lbl"; lbl.textContent=p.name; b.appendChild(lbl);

  /* De stand bepaalt in welke ruimtes iemand mag komen, en krijgt daarom een
     eigen banderol onder het poppetje, in de kleur van die stand. */
  /* Alleen de vorm om het poppetje, geen woord erbij: bij het kiezen wil je
     rustig kunnen kijken, en de kroon of het schild zegt al genoeg. De naam
     van de rol staat op het introscherm en bij de regels. */
  const badgeSvg=(p.standing && heeftRolvorm(p.standing))?rolBadge(p.standing):"";
  if(badgeSvg){
    const badge=document.createElement("span");
    badge.className="role-badge";
    badge.innerHTML=badgeSvg;
    b.appendChild(badge);
  }

  if(mode==="note"){
    const marked=!!(notes.get(tileId)||{marks:new Map()}).marks.get(p.id);
    if(marked||placed.get(p.id)) b.classList.add("taken");
    b.addEventListener("click",()=>{
      const n=noteFor(tileId);
      if(n.marks.get(p.id)) n.marks.delete(p.id);
      else { n.marks.set(p.id,1); n.cross=false; }
      haptic(8);
      paintBoard(); closeRadial();
    });
  } else {
    if(placed.get(p.id)) b.classList.add("taken");
    const hard=hardBlock(t);
    if(hard){ b.setAttribute("disabled",""); b.title=hard; }
    b.addEventListener("click",()=>{
      if(hard) return;
      if(easyMode && M.solution.get(p.id)!==tileId){
        haptic([40,60,40]);
        closeRadial();
        meld("Niet de juiste plek",
          p.name+" hoort ergens anders. Kijk nog eens naar de aanwijzingen en probeer een andere tegel.");
        return;
      }
      /* Buiten easy mode geen waarschuwingen: vrij schuiven, de controle
         vertelt straks wat er klopt. */
      /* Eerst de kring weg, dan pas de pion: zo zie je hem echt landen op
         het vakje in plaats van dat hij er al staat als de sluier optrekt. */
      closeRadial();
      setTimeout(()=>{
        placePerson(p.id,tileId);
        if(easyMode||autoKruis) easyKruisjes(tileId);
        paintBoard();
      },130);
    });
  }
  return b;
}

function hardBlock(t){
  if(!t) return "Deze tegel bestaat niet.";
  if(t.status==="blocked") return "Hier kan niemand staan; alleen een kruis.";
  return null;
}
function softIssue(p,tileId){
  const t=M.tiles.get(tileId);
  const other=personOnTile(tileId);
  if(other && other!==p.id) return M.peopleById.get(other).name+" stond hier al.";
  for(const [pid,tid] of placed){
    if(pid===p.id) continue;
    const ot=M.tiles.get(tid); if(!ot) continue;
    if(ot.row===t.row) return "Rij "+t.row+" is al bezet door "+M.peopleById.get(pid).name+".";
    if(ot.column===t.column) return "Kolom "+t.column+" is al bezet door "+M.peopleById.get(pid).name+".";
  }
  const room=M.rooms.get(t.roomId);
  if(room && Array.isArray(room.allowedStandings) && room.allowedStandings.length){
    if(!p.standing || room.allowedStandings.indexOf(p.standing)<0)
      return p.name+" mag niet in de "+(room.name||"ruimte")+".";
  }
  return null;
}
function placePerson(personId,tileId){
  const cur=personOnTile(tileId);
  if(cur && cur!==personId) placed.delete(cur);
  const oud=placed.get(personId);
  if(oud && oud!==tileId && (easyMode||autoKruis)) kruisjesWeg(oud);
  placed.set(personId,tileId);
  justPlaced=personId;
  haptic([10,26,14]);
}

/* ============================================================
   9. Regels-tab — compact; slachtoffer boven, geplaatst onderaan
   ============================================================ */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,ch=>(
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function buildHighlightTerms(){
  const terms=[];
  M.people.forEach(p=>terms.push({name:p.name,kind:"person",color:p.color}));
  const seen=new Set();
  const soorten=new Map(((AssetBank.manifest&&AssetBank.manifest.objects)||[]).map(o=>[o.kind,o]));
  M.objects.forEach(o=>{
    const soort=soorten.get(o.kind);
    /* De eigen naam ("Stoel 1"), de soortnaam ("Stoel") en het meervoud
       ("stoelen"): een regel gebruikt elk van de drie. */
    [o.name, o.kindLabel||o.kind, soort&&soort.label, soort&&soort.labelPlural].forEach(label=>{
      if(!label) return;
      const key=String(label).toLowerCase();
      if(seen.has(key)) return;
      seen.add(key);
      terms.push({name:String(label),kind:"object"});
    });
  });
  /* Ook ruimtes, rollen, ontkenningen en richtingen: dat zijn de woorden
     waar de regel om draait, dus die springen eruit. */
  const extra=[];
  M.rooms.forEach(r=>{ if(r&&r.name) extra.push(r.name); });
  ((AssetBank.manifest&&AssetBank.manifest.roles)||[]).forEach(r=>{ extra.push(r.label,r.labelPlural); });
  extra.push("niet","geen","alleen","niemand","naast","links","rechts","boven","onder","tegenover");
  extra.forEach(w=>{
    if(!w) return;
    const key=String(w).toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    terms.push({name:String(w),kind:"spec"});
  });
  return terms.sort((a,b)=>b.name.length-a.name.length);
}
/* Kleurt personen (naam -> hun pionkleur) en maakt objectnamen vet, in één
   doorloop zodat een al geplaatste tag niet per ongeluk opnieuw gematcht wordt. */
function highlightClueText(text){
  if(!text) return "";
  const escaped=esc(text);
  const terms=buildHighlightTerms();
  if(!terms.length) return escaped;
  const alt=terms.map(t=>escapeRegExp(t.name)).join("|");
  const re=new RegExp("\\b(?:"+alt+")\\b","gi");
  return escaped.replace(re,m=>{
    const t=terms.find(x=>x.name.toLowerCase()===m.toLowerCase());
    if(!t) return m;
    if(t.kind!=="person") return "<b>"+m+"</b>";
    /* Een naam in de regel krijgt de kleur van die persoon, en de onderstreping
       eronder ook -- zo zoek je in de tekst dezelfde kleur die je op het bord
       ziet staan. */
    return '<b class="pn" style="color:'+leesbaar(t.color)+';--pn:'+mixHex(t.color,"#FFFFFF",.72)+'">'+m+'</b>';
  });
}
function stripOwnName(text,person){
  if(!text||!person) return text;
  const re=new RegExp("^"+escapeRegExp(person.name)+"\\s+","");
  if(!re.test(text)) return text;
  const rest=text.replace(re,"");
  /* "Cyriel of Bela lag op een bed": zonder de naam blijft "of Bela" over,
     en dat leest niet. Dan neemt het voornaamwoord de plek van de naam in. */
  if(/^of\s/i.test(rest)) return (person.gender==="female"?"Zij":"Hij")+" "+rest;
  return rest;
}
function posBadge(personId){
  const tid=placed.get(personId); if(!tid) return null;
  const t=M.tiles.get(tid); if(!t) return null;
  return "k"+t.column+" r"+t.row;
}


/* Kaart in de 2-koloms verdachtenlijst: foto boven, naam groter, rol als tagline,
   en de regel eronder zonder de eigen naam (die staat al boven). */
/* Op welke tegels staat deze persoon als notitie? */
function notitieTegels(personId){
  const uit=[];
  notes.forEach((n,tileId)=>{ if(!n.cross && n.marks && n.marks.get(personId)) uit.push(tileId); });
  return uit;
}

function personCard(clues,p,done){
  /* Eén regel of een lijstje: allebei komen binnen als array. */
  if(clues && !Array.isArray(clues)) clues=[clues];
  clues=(clues||[]).filter(Boolean);
  const isVictim=p.id===M.victimId;
  const card=document.createElement("div");
  card.className="clue-card"+(done?" done":"")+(isVictim?" victim":"");

  /* De kaart draagt de kleur van de persoon: de strook bovenaan, de naam, de
     rand van het vinkje en een zweem in de achtergrond. Zo hoef je het portret
     niet te lezen om te zien wiens regel dit is -- dezelfde kleur die zijn pion
     op het bord heeft. */
  const kleur=p.color||"#9AA3B8";
  card.style.setProperty("--pc",kleur);
  card.style.setProperty("--pc-lees",leesbaar(kleur));
  card.style.setProperty("--pc-zacht",mixHex(kleur,"#FFFFFF",.85));
  /* Een waas van de eigen kleur over de hele kaart: genoeg om ze uit elkaar te
     houden zonder dat de tekst eronder lijdt. */
  card.style.setProperty("--pc-waas",mixHex(kleur,"#FFFFFF",.93));
  card.style.setProperty("--pc-rand",mixHex(kleur,"#FFFFFF",.55));

  /* Portret bovenaan, naam eronder, dan pas de regel: dezelfde opbouw als op
     het introscherm, zodat je een persoon overal op dezelfde manier herkent. */
  const kop=document.createElement("div");
  kop.className="kop";
  kop.appendChild(personPortrait(p,{size:52}));
  card.appendChild(kop);

  /* Naam, rol en regel staan in één tekstkolom naast het portret; niets
     staat in of onder de illustratie. Zo blijft een rij laag. */
  const lijf=document.createElement("div");
  lijf.className="lijf";
  card.appendChild(lijf);

  const nm=document.createElement("div");
  nm.className="name"; nm.textContent=p.name;
  lijf.appendChild(nm);

  if(p.standing && p.standingLabel){
    const rol=document.createElement("span");
    rol.className="badge tag "+p.standing;
    rol.textContent=p.standingLabel;
    lijf.appendChild(rol);
  }
  if(isVictim){
    const tag=document.createElement("span");
    tag.className="badge tag victim";
    tag.textContent="Slachtoffer";
    lijf.appendChild(tag);
  }
  if(revealed && p.id===M.culpritId){
    const tag=document.createElement("span");
    tag.className="badge tag victim";
    tag.textContent="Dader";
    lijf.appendChild(tag);
  }

  /* Staat deze persoon al ergens als notitie op het bord, dan zie je dat hier
     meteen -- anders moet je daarvoor terug naar het bord. Klein linksboven,
     tegenover het vinkje: een potlood en hoe vaak, meer hoeft het niet te
     zeggen. */
  /* Eigen aantekeningen: een klein memo-merkje, zodat je op de lijst ziet
     bij wie je al iets hebt opgeschreven. */
  if(persoonNotitie(p.id).trim()){
    const memo=document.createElement("div");
    memo.className="memo-merk";
    memo.title="Je hebt notities over "+p.name;
    memo.innerHTML='<span class="ic">'+AssetBank.ui("note")+'</span>';
    card.appendChild(memo);
  }
  const merken=notitieTegels(p.id);
  if(merken.length){
    const mark=document.createElement("div");
    mark.className="notitie-merk";
    mark.title=merken.length+"\u00d7 als notitie gezet: "+merken.join(", ");
    mark.innerHTML='<span class="ic">'+AssetBank.ui("pencil")+'</span>'
      +'<span>'+merken.length+'\u00d7</span>';
    card.appendChild(mark);
  }

  const txt=document.createElement("div");
  txt.className="txt"+(clues.length>1?" meer":"");
  txt.innerHTML=clues.length
    ? clues.map(c=>'<span class="regel">'+highlightClueText(stripOwnName(c.text,p))+'</span>').join("")
    : "Geen regel voor deze persoon.";
  lijf.appendChild(txt);

  /* Het vinkje verschijnt pas als iemand staat. Een leeg rondje bij iedereen
     die nog moet komen is een vakje dat om invulling vraagt, en dat is niet wat
     er gebeurt: je plaatst op het bord, niet hier. */
  if(done){
    const tick=document.createElement("div");
    tick.className="tick";
    tick.innerHTML=icon("check",{sw:3.2});
    card.appendChild(tick);
  }

  if(card.querySelector(".memo-merk,.notitie-merk")) card.classList.add("met-merk");
  /* Naar rechts slepen opent de kaart ook: hij schuift mee met je vinger en
     klapt open zodra je ver genoeg bent. */
  (function(){
    let sx=0, sy=0, dx=0, bezig=false, richting=null;
    card.addEventListener("pointerdown",e=>{ if(e.target.closest(".info")) return; sx=e.clientX; sy=e.clientY; dx=0; bezig=true; richting=null; });
    card.addEventListener("pointermove",e=>{
      if(!bezig) return;
      const mx=e.clientX-sx, my=e.clientY-sy;
      if(!richting){ if(Math.abs(mx)<8&&Math.abs(my)<8) return; richting=Math.abs(mx)>Math.abs(my)?"x":"y"; if(richting==="x"){ card.classList.add("sleept"); try{ card.setPointerCapture(e.pointerId); }catch(x){} } }
      if(richting!=="x") return;
      dx=Math.max(0,Math.min(96,mx));
      card.style.transform="translateX("+dx+"px)";
      card.classList.toggle("open-klaar",dx>56);
    });
    const klaar=()=>{
      if(!bezig) return; bezig=false;
      card.classList.remove("sleept");
      const open=dx>56;
      card.style.transform=""; card.classList.remove("open-klaar");
      if(open){ haptic(10); showClueDetail(clues,p); }
    };
    card.addEventListener("pointerup",klaar);
    card.addEventListener("pointercancel",klaar);
  })();
  /* Een pijltje rechts zegt dat er meer achter zit: het persoonsvenster. */
  const info=document.createElement("button");
  info.type="button"; info.className="info"; info.setAttribute("aria-label","Meer over "+p.name);
  info.innerHTML=icon("chevron",{sw:2.4});
  info.addEventListener("click",e=>{ e.stopPropagation(); showClueDetail(clues,p); });
  card.appendChild(info);
  return card;
}

function renderClues(){
  const list=$("#cluesList");
  list.innerHTML="";


  /* Alle bordregels op één kaart, met een eigen donkerder vlak: één plek
     waar alles staat wat over het hele bord gaat. */
  if(M.boardClues.length){
    const card=document.createElement("div");
    card.className="clue-card board";
    card.innerHTML='<div class="kop"><div class="bord-schild">'
      +'<svg viewBox="0 0 48 48"><rect width="48" height="48" fill="#F1EEFE"/>'
      +'<g fill="none" stroke="#5B4BE8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">'
      +'<path d="M24 8l14 6v10.4c0 9.2-5.8 14.8-14 17.6-8.2-2.8-14-8.4-14-17.6V14z"/>'
      +'<path d="M18.4 24.2l4 4 7.2-7.8"/></g></svg>'
      +'</div></div>'
      +'<div class="name"><span class="ic">'+AssetBank.ui("badge")+'</span>'+(M.boardClues.length===1?'Bordregel':'Bordregels')+'</div>'
      +'<div class="txt'+(M.boardClues.length>1?' meer':'')+'"></div>';
    card.querySelector(".txt").innerHTML=M.boardClues.slice()
      .sort((a,b)=>(isAlgemeneRegel(a.text)?1:0)-(isAlgemeneRegel(b.text)?1:0))
      .map(c=>'<span class="regel'+(isAlgemeneRegel(c.text)?' algemeen':'')+'">'+highlightClueText(c.text)+'</span>').join("");
    const info=document.createElement("button");
    info.type="button"; info.className="info"; info.setAttribute("aria-label","Meer over de bordregels");
    info.innerHTML=icon("chevron",{sw:2.4});
    info.addEventListener("click",e=>{ e.stopPropagation(); showClueDetail(M.boardClues,null); });
    card.appendChild(info);
    list.appendChild(card);
  }

  /* Eén kaart per persoon, met al zijn aanwijzingen eronder. Twee regels over
     dezelfde persoon zijn twee dingen die je van hém weet, geen twee losse
     verdachten -- als ze als aparte kaarten staan lijkt het gezelschap groter
     dan het is en zoek je bij het plaatsen twee keer dezelfde naam op. */
  const perPersoon=new Map();
  const zet=(p,c)=>{
    if(!perPersoon.has(p.id)) perPersoon.set(p.id,{p,cs:[]});
    if(c) perPersoon.get(p.id).cs.push(c);
  };
  /* Het slachtoffer staat al bovenaan als eigen rij. */
  M.clues.forEach(c=>{
    const p=M.peopleById.get(c.personId); if(!p) return;
    zet(p,c);
  });

  const open=[], done=[];
  perPersoon.forEach(x=>(placed.get(x.p.id)?done:open).push(x));
  open.forEach(x=>list.appendChild(personCard(x.cs,x.p,false)));
  if(done.length){
    const sep=document.createElement("div");
    sep.className="list-sep"; sep.textContent="Geplaatst";
    list.appendChild(sep);
    done.forEach(x=>list.appendChild(personCard(x.cs,x.p,true)));
  }

  /* Het slachtoffer helemaal onderaan: zijn regel is altijd dezelfde en je
     hebt hem pas aan het eind nodig. */
  const victimBoven=M.victimId?M.peopleById.get(M.victimId):null;
  if(victimBoven){
    const row=document.createElement("div");
    row.className="clue-row victim";
    const av=document.createElement("div");
    av.className="av";
    av.innerHTML=characterSvg(victimBoven);
    row.appendChild(av);
    const body=document.createElement("div");
    body.className="body";
    body.innerHTML='<div class="who"><b></b><span class="badge victim">Slachtoffer</span></div><div class="txt"></div>';
    body.querySelector(".who b").textContent=victimBoven.name;
    body.querySelector(".txt").innerHTML=highlightClueText(M.victimClue&&M.victimClue.text?M.victimClue.text:"");
    row.appendChild(body);
    row.addEventListener("click",()=>showClueDetail(M.victimClue,victimBoven));
    list.appendChild(row);
  }
}

/* Eigen aantekeningen per persoon, bewaard per level. Ze helpen bij het
   oplossen ("kan niet in de tuin, want…") en staan los van de letters en
   kruisjes op het bord. */
function notitieSleutel(){ return "cb_notities:"+((M&&M.raw&&M.raw.levelId)||(M&&M.title)||"level"); }
function leesNotities(){
  try{ const r=localStorage.getItem(notitieSleutel()); return r?JSON.parse(r):{}; }catch(e){ return {}; }
}
function persoonNotitie(pid){ const n=leesNotities(); return (n&&n[pid])||""; }
function bewaarNotitie(pid,tekst){
  const n=leesNotities();
  if(tekst&&tekst.trim()) n[pid]=tekst; else delete n[pid];
  try{ localStorage.setItem(notitieSleutel(),JSON.stringify(n)); }catch(e){}
}

/* Klein plattegrondje van het echte bord: geen kleuren, alleen de vorm, de
   scheidingen tussen ruimtes en één gouden vakje. Zo zie je in één blik waar
   iemand staat, zonder het bord erbij te hoeven pakken. */
function miniBord(personId){
  if(!M||!M.bounds) return "";
  const b=M.bounds;
  const hier=placed.get(personId)||null;
  const noot=new Set();
  notes.forEach((n,id)=>{ if(n.marks&&n.marks.get(personId)) noot.add(id); });
  const pe=M.peopleById.get(personId);
  const letter=(pe&&pe.name?pe.name.charAt(0):"?").toUpperCase();
  const licht=document.documentElement.dataset.thema==="licht";
  let h='<div class="mini-bord" style="grid-template-columns:repeat('+b.cols+',1fr)">';
  for(let r=b.minR;r<=b.maxR;r++) for(let c=b.minC;c<=b.maxC;c++){
    const t=M.tiles.get("c"+c+"r"+r);
    if(!t){ h+='<span class="mb-c leeg"></span>'; continue; }
    let cls="mb-c";
    const room=M.rooms.get(t.roomId);
    /* Heel licht de kleur van de kamer: genoeg om de indeling te herkennen,
       niet zo veel dat het bordje een tweede speelbord wordt. */
    const rk=(room&&room.color)?room.color:"#DCE3EF";
    const stijl=' style="background:'+(licht?mixHex(rk,"#FFFFFF",.46):mixHex(rk,"#2E2122",.58))+'"';
    if(t.status==="blocked") cls+=" blok";
    let inner="";
    if(t.id===hier){ cls+=" hier"; inner=esc(letter); }
    else if(noot.has(t.id)) cls+=" noot";
    h+='<span class="'+cls+'"'+stijl+'>'+inner+'</span>';
  }
  return h+"</div>";
}

/* Wat vertelt de rol over waar iemand kan staan? Alleen tonen als het bord
   echt voorbehouden gebieden heeft; anders zegt het niets. */
function rolHint(p){
  if(!p||!p.standing) return "";
  let beperkt=false;
  M.rooms.forEach(r=>{ if(Array.isArray(r.allowedStandings)&&r.allowedStandings.length) beperkt=true; });
  if(!beperkt) return "";
  if(p.standing==="knight") return "Ridders mogen in elk gebied staan.";
  if(p.standing==="noble") return "Edelen staan altijd in een gebied voor edelen.";
  const r=AssetBank.role(p.standing);
  const mv=r?r.labelPlural:"Zij";
  return mv.charAt(0).toUpperCase()+mv.slice(1)+" komen nooit in een gebied voor edelen.";
}
function showClueDetail(cs,p){
  if(cs && !Array.isArray(cs)) cs=[cs];
  cs=(cs||[]).filter(Boolean);
  const box=$("#clueDetail");
  let html='<button class="sheet-sluit pd-sluit" type="button" data-close aria-label="Sluiten">'+icon("cross",{sw:2.2})+'</button>';
  if(p){
    const isV=p.id===M.victimId;
    const merken=[];
    if(isV) merken.push('<span class="badge tag victim">Slachtoffer</span>');
    if(p.standingLabel) merken.push('<span class="badge tag '+esc(p.standing||"")+'">'+esc(p.standingLabel)+'</span>');
    if(revealed && p.id===M.culpritId) merken.push('<span class="badge tag victim">Dader</span>');
    /* Portret links, naam en merkjes rechts: de kop blijft laag, de regels
       komen sneller in beeld. */
    html+='<div class="pd-kop"><div class="pd-portret"></div><div class="pd-wie">'
      +'<h3 class="pd-naam">'+esc(p.name)+'</h3>'
      +(merken.length?'<div class="pd-rol">'+merken.join("")+'</div>':'')
      +(rolHint(p)?'<div class="pd-hint"><span class="ic">'+AssetBank.ui("compass")+'</span>'+esc(rolHint(p))+'</div>':'')
      +'</div></div>'
      +(p.description?'<p class="pd-omschrijving">'+esc(p.description)+'</p>':'');
    html+='<div class="pd-label">Wat je weet</div>';
  } else {
    html+='<div class="pd-kop"><div class="pd-schild"><span class="ic">'+AssetBank.ui("badge")+'</span></div><div class="pd-wie">'
      +'<h3 class="pd-naam">'+(cs.length>1?'Bordregels':'Bordregel')+'</h3>'
      +'<p class="pd-omschrijving">Gelden voor iedereen op het bord.</p></div></div>';
    html+='<div class="pd-label">'+(cs.length>1?'De regels':'De regel')+'</div>';
  }
  html+='<div class="pd-regels">'+(cs.length
    ? cs.map(c=>'<div class="pd-regel"><span class="ic">'+AssetBank.ui("badge")+'</span><div>'+highlightClueText(c.text)+'</div></div>').join("")
    : '<div class="pd-regel leeg"><div>Over deze persoon is niets bekend. Wat er overblijft, moet uit de andere regels komen.</div></div>')+'</div>';
  if(p){
    const tid=placed.get(p.id)||null;
    const t=tid?M.tiles.get(tid):null;
    const room=t?M.rooms.get(t.roomId):null;
    let noten=0; notes.forEach(n=>{ if(n.marks&&n.marks.get(p.id)) noten++; });
    html+='<div class="pd-label">Jouw notities</div>'
      +'<textarea class="pd-notitie" id="pdNotitie" rows="1" placeholder="Wat denk je over '+esc(p.name)+'? Bijvoorbeeld: kan niet in de tuin, want…"></textarea>';
    /* Het plattegrondje is een voetnoot: klein, naast een korte plaatsaanduiding. */
    html+='<div class="pd-voet">'+miniBord(p.id)
      +'<div class="pd-plek-tekst">'
      +(t?'<b>Kolom '+t.column+', rij '+t.row+'</b><span>'+esc(room&&room.name?room.name:"op het bord")+'</span>'
         :'<b>Nog niet geplaatst</b><span>'+(noten?(noten===1?"1 vakje aangemerkt":noten+" vakjes aangemerkt"):"nog geen letters op het bord")+'</span>')
      +'</div></div>';
  }
  html+='<div class="row"><button class="btn" data-close>Sluiten</button></div>';
  box.innerHTML=html;
  if(p){
    const h=box.querySelector(".pd-portret"); if(h) h.appendChild(personPortrait(p,{size:84}));
    const ta=box.querySelector("#pdNotitie");
    if(ta){
      ta.value=persoonNotitie(p.id);
      /* Zo hoog als de tekst: leeg is het één regel, en het groeit mee. */
      const groei=()=>{ ta.style.height="44px"; ta.style.height=Math.max(44,ta.scrollHeight)+"px"; };
      groei(); requestAnimationFrame(groei);
      let wacht=null;
      ta.addEventListener("input",()=>{ groei(); clearTimeout(wacht); wacht=setTimeout(()=>bewaarNotitie(p.id,ta.value),250); });
      ta.addEventListener("blur",()=>{ clearTimeout(wacht); bewaarNotitie(p.id,ta.value); });
      /* Bij sluiten meteen bewaren en het merkje op de kaart bijwerken. */
      $$("[data-close]",$("#modalClue")).forEach(el=>el.addEventListener("click",()=>{
        clearTimeout(wacht); bewaarNotitie(p.id,ta.value);
        if(tab==="clues") renderClues();
      },{once:true}));
    }
  }
  openModal("#modalClue");
}

function showLegend(){
  const box=$("#legendBody");
  let html='<div class="sheet-greep"></div><div class="sheet-kop"><h3>Legenda</h3>'
    +'<button class="sheet-sluit" type="button" aria-label="Sluiten">'+icon("cross",{sw:2.2})+'</button></div>';

  if(M.rooms.size){
    html+='<div class="legend-sep">Ruimtes</div>';
    M.rooms.forEach(room=>{
      const st=roomWallStyle(room);
      const restricted=room.allowedStandings&&room.allowedStandings.length;
      /* Alleen wie er mag komen, met het pictogram en de kleur van die rol.
         De ondergrond staat er niet meer bij: die zie je op het bord en hij
         maakt voor het oplossen niets uit. */
      const tags=restricted
        ? room.allowedStandings.map(r=>
            '<span class="badge rol" style="--rb:'+bandKleur(roleColor(r))+';--rf:#FFFFFF">'
            + AssetBank.roleIcon(r) + esc(roleLabel(r)) + '</span>').join("")
        : "";
      const fl=roomFloor(room);
      html+='<div class="legend-row">'
        +'<div class="legend-swatch"'+(fl?' data-floor="'+fl+'"':'')
        +' style="background-color:'+(room.color||"#DCE3EF")+'"></div>'
        +'<div style="flex:1"><div class="name">'+esc(room.name||room.id)+'</div>'
        +(tags?'<div class="legend-tags">'+tags+'</div>':'')+'</div>'
        +'<div class="legend-wall" style="'+wallSwatchCss(st.colors)+'"></div>'
        +'</div>';
    });
  }

  const occupiable=new Map(), blocked=new Map();
  M.objects.forEach(o=>{
    const key=o.kind||o.name||"?";
    const bucket=o.type==="blocked"?blocked:occupiable;
    const bd=o.bounds||{};
    const w=Math.max(1,(bd.maxColumn||1)-(bd.minColumn||1)+1);
    const h=Math.max(1,(bd.maxRow||1)-(bd.minRow||1)+1);
    const cur=bucket.get(key);
    /* De grootste voetafdruk wint: daarvoor pakt het bord ook de maatvariant
       van de tekening (bv. table-2x1), en dan toont de legenda hetzelfde. */
    if(!cur || w*h>cur.w*cur.h) bucket.set(key,{name:o.kindLabel||o.kind||"Object", w:w, h:h});
  });
  /* Hetzelfde materiaalvlak als op het bord, zodat bezetbaar en geblokkeerd
     ook in de legenda meteen aan kleur en patroon te herkennen zijn. */
  const objGrid=(map,type)=>{
    let out='<div class="legend-objgrid">';
    map.forEach((info,kind)=>{
      out+='<div class="legend-obj">'
        +'<div class="legend-chip '+type+'" style="'+objectSurfaceStyle(kind,type)+'">'
        +'<div class="legend-icon" data-obj-kind="'+esc(kind)+'"'
        +' data-obj-w="'+info.w+'" data-obj-h="'+info.h+'">'+objectIcon(kind)+'</div></div>'
        +'<div class="name">'+esc(info.name)+'</div></div>';
    });
    return out+'</div>';
  };
  if(occupiable.size){
    html+='<div class="legend-sep">Bezetbare objecten</div>'+objGrid(occupiable,"occupiable");
  }
  if(blocked.size){
    html+='<div class="legend-sep">Niet-bezetbare objecten</div>'+objGrid(blocked,"blocked");
  }

  box.innerHTML=html;
  const sluit=box.querySelector(".sheet-sluit");
  if(sluit) sluit.addEventListener("click",()=>closeModal($("#modalLegend")));
  /* Dezelfde eigen tekeningen ophalen als het bord gebruikt; laadt er geen,
     dan blijft het lijnpictogram staan — net als op het bord. */
  $$("#legendBody .legend-icon[data-obj-kind]").forEach(host=>{
    const kind=host.getAttribute("data-obj-kind");
    const w=parseInt(host.getAttribute("data-obj-w"),10)||1;
    const h=parseInt(host.getAttribute("data-obj-h"),10)||1;
    mountAsset(host,objectAssetCandidates(kind,w,h),host,"has-art");
  });
}

function checkSolution(){
  elapsed=Date.now()-startTime; stopTimer();
  let correct=0; const details=[];
  M.people.forEach(p=>{
    const mine=placed.get(p.id)||null, truth=M.solution.get(p.id)||null;
    const ok=!!(mine&&truth&&mine===truth);
    if(ok) correct++;
    details.push({p,mine,ok});
  });
  const total=M.people.length, perfect=(correct===total);
  const card=document.querySelector("#screen-end .uitslag");
  if(card){ card.classList.toggle("win",perfect); card.classList.toggle("lose",!perfect); }
  haptic(perfect?[16,60,26,60,40]:[46,70,46]);
  $("#endTitle").textContent=perfect?"Goed gedaan!":"Niet helemaal…";
  $("#endSub").textContent=perfect?"Alle personen staan op de juiste plek.":"Sommige personen staan nog verkeerd.";
  $("#endScore").textContent=correct+"/"+total;
  /* Een ring die zich vult tot het aandeel dat klopt; het vinkje of kruis erin. */
  const R=44, OMTREK=2*Math.PI*R, deel=total?correct/total:0;
  $("#endBeeld").innerHTML='<svg viewBox="0 0 120 120" aria-hidden="true">'
    +'<circle class="ring-achter" cx="60" cy="60" r="'+R+'"/>'
    +'<circle class="ring-voor" cx="60" cy="60" r="'+R+'" style="stroke-dasharray:'+OMTREK.toFixed(1)
    +';stroke-dashoffset:'+OMTREK.toFixed(1)+'"/></svg>'
    +'<div class="ring-icoon">'+AssetBank.ui(perfect?"check":"cross")+'</div>';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const ring=$("#endBeeld .ring-voor");
    if(ring) ring.style.strokeDashoffset=(OMTREK*(1-deel)).toFixed(1);
  }));
  $("#endTime").textContent=fmtTime(elapsed);

  let html="";
  details.forEach((d,i)=>{
    html+='<div class="uitslag-rij '+(d.ok?"goed":"fout")+'" style="animation-delay:'+(120+i*70)+'ms">'
      +'<span class="av">'+characterSvg(d.p)+'</span>'
      +'<span class="wie"><b>'+esc(d.p.name)+'</b><small>'+esc(d.mine?tileLabel(d.mine):"niet geplaatst")+'</small></span>'
      +'<span class="oordeel">'+(d.ok?"goed":"fout")+'</span></div>';
  });
  if(accused){
    const nm=M.peopleById.get(accused);
    html+='<div class="uitslag-rij dader '+(accusedResult?"goed":"fout")+'" style="animation-delay:'+(120+details.length*70)+'ms">'
      +'<span class="av">'+(nm?characterSvg(nm):"")+'</span>'
      +'<span class="wie"><b>'+esc(nm?nm.name:accused)+'</b><small>beschuldigd als dader</small></span>'
      +'<span class="oordeel">'+(accusedResult?"juist":"onjuist")+'</span></div>';
  } else {
    html+='<div class="uitslag-rij open" style="animation-delay:'+(120+details.length*70)+'ms">'
      +'<span class="wie"><b>Dader</b><small>nog niet beschuldigd</small></span></div>';
  }
  $("#endDetails").innerHTML=html;
  showScreen("end");
}

function geefHint(){
  const fout=[];
  placed.forEach((tid,pid)=>{
    if(M.solution.get(pid)!==tid){
      const p=M.peopleById.get(pid);
      if(p) fout.push(p.name);
    }
  });
  if(fout.length){
    haptic([30,40,30]);
    meld("Nog niet goed", fout.length===1
      ? "<b>"+esc(fout[0])+"</b> staat nog niet op de juiste plek."

      {html:true, icoon:"warning", hint:true});

  }
  const volgende=M.people.find(p=>!placed.get(p.id));

  const tid=M.solution.get(volgende.id);
  /* Even niets, dan landt de pion; kort daarna waaieren de kruisjes vanuit
     de pion uit naar de randen van zijn rij en kolom. */

  },260);
}
