<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#231819" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<script>
/* iOS leest de statusbalk-stijl één keer, bij het laden. Vandaar hier
   en niet bij zetThema(): een lichte pagina met witte statusbalktekst
   is onleesbaar, dus schakelen we om vóórdat de pagina verschijnt. */
try{
  if(localStorage.getItem("clueboard:menuThema")==="licht"){
    document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content="default";
    document.getElementById("themeColorMeta").content="#F1EFE8";
    document.documentElement.dataset.thema="licht";
  }
}catch(e){}
</script>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
/* iOS opent een gewone <a href> in Safari zodra de site als webapp draait: je
   verliest het volledige scherm en krijgt de adresbalk terug. De scope in het
   manifest houdt menu, player en builder bij elkaar, maar oudere iOS-versies
   negeren scope. Vandaar dit vangnet: links binnen dezelfde site navigeren we
   zelf, in hetzelfde venster. Staat identiek in alle drie de apps (bewust
   gedupliceerd, dit project heeft geen bouwstap). */
(function(){
  var alsApp = (window.matchMedia && matchMedia("(display-mode: standalone)").matches)
               || navigator.standalone === true;
  if(!alsApp) return;
  /* In de vangfase: een handler die eerder aan de beurt is en de gebeurtenis
     tegenhoudt, zou ons anders overslaan en de link alsnog in Safari openen. */
  document.addEventListener("click", function(e){
    var a = e.target && e.target.closest && e.target.closest("a[href]");
    if(!a || a.target === "_blank" || a.hasAttribute("download")) return;
    var h = a.getAttribute("href") || "";
    if(!h || h.charAt(0) === "#") return;
    var u; try{ u = new URL(h, location.href); }catch(_){ return; }
    if(u.origin !== location.origin) return;
    e.preventDefault();
    e.stopPropagation();
    location.assign(u.href);
  }, true);
})();
</script>
<title>ClueBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* ============================================================
   ClueBoard — Menu. Elk level is een zaak: dossiernummers, een
   speurdersverhaal bovenaan, warm papier met een klein terracotta-
   accent. Zoeken en filteren bovenin; alles wat je zelf maakt zit
   achter één knop in de balk.
   ============================================================ */
:root{
  /* ── DONKER (standaard): wijnrood met goud ──
     Eén warme kleurfamilie: de grond is rood-bruin ontzadigd, kaarten en
     lijnen liggen daar dicht tegenaan, en het goud is de enige heldere
     kleur. Het rood van "vermoord" staat er als enige naast. ── */
  --grond:#231819;
  --grond-2:#1B1213;
  --kaart:#2E2122;
  --kaart-2:#291D1E;
  --lijn:#43302F;
  --lijn-zacht:#3A2A29;

  --inkt:#F0E8E2;
  --inkt-2:#CBBBB4;
  --dof:#96837E;

  /* Eén goud, twee rollen. In het donker mag dezelfde kleur beide doen:
     als tekst haalt hij 5.7:1 op de kaart, als vlak draagt hij donkere
     tekst op 6.3:1. */
  --accent:#C9932F;
  --accent-vlak:#C9932F;
  --accent-op:#231819;
  --accent-diep:#A97A22;
  --accent-zacht:rgba(201,147,47,.14);
  --accent-lijn:rgba(201,147,47,.42);

  --zaak-rood:#E0705A;
  --fout:#E58472;

  --sch1:0 1px 2px rgba(0,0,0,.22);
  --sch2:0 2px 6px rgba(0,0,0,.26),0 12px 30px rgba(0,0,0,.28);

  --font-ui:"Manrope","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;

  --korrel:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23g)' opacity='0.5'/></svg>");
}
/* ── LICHT: hetzelfde papier, maar omgekeerd. Het goud wordt hier oker:
   helder goud haalt op wit maar 2:1 contrast, deze diepte haalt 4.8:1 en
   blijft dus leesbaar. Dezelfde kleur als de lichte skin van de bouwer. */
html[data-thema="licht"]{
  --grond:#F1EFE8;
  --grond-2:#EAE7DE;
  --kaart:#FBFAF6;
  --kaart-2:#F4F2EA;
  --lijn:#E2DED1;
  --lijn-zacht:#EBE8DE;

  --inkt:#262419;
  --inkt-2:#4C493D;
  --dof:#71695A;

  /* Tekstgoud: 4.7:1 op de pagina. Iets geler en verzadigder dan het
     oude #8F6310, zodat het minder als bruin leest bij dezelfde diepte. */
  --accent:#916008;
  /* Vlakgoud: precies hetzelfde goud als in het donker, met donkere
     tekst erop (5.9:1). Zo voelt de lichte modus goud in plaats van
     brons, en delen beide thema's één herkenbare kleur. */
  --accent-vlak:#C9932F;
  --accent-op:#2A1F06;
  --accent-diep:#A87B18;
  --accent-zacht:rgba(145,96,8,.10);
  --accent-lijn:rgba(145,96,8,.32);

  --zaak-rood:#A3402F;
  --fout:#A3402F;

  --sch1:0 1px 2px rgba(48,44,32,.05);
  --sch2:0 2px 6px rgba(48,44,32,.06),0 10px 26px rgba(48,44,32,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
/* Het verloop staat op het canvas (html), niet op body, en zonder
   background-attachment:fixed. Als webapp op een iPhone meet iOS een vast
   verloop op de layout-viewport, die boven de thuisbalk ophoudt; daaronder
   scheen dan de effen html-kleur door, lichter dan het eind van het verloop:
   een lichte balk met een harde rand. Op het canvas dekt het verloop altijd
   het hele scherm, en wat daar nog buiten valt (thuisbalk, overscroll) krijgt
   de eindkleur, zodat er niets meer aansluit met een naad. */
html{touch-action:manipulation;overscroll-behavior:none;
  background:var(--grond-2) linear-gradient(180deg,var(--grond) 0%,var(--grond-2) 100%) no-repeat}
html,body{height:100%;overflow:hidden}
/* Kom je uit een spel terug in de telefoonbrowser, dan is de werkbalk van
   de browser op dat moment vaak nog ingeklapt: de pagina meet zich dan op
   het hoge scherm. Zodra de werkbalk terugkomt, schuift het zichtbare
   venster naar de onderkant van die te hoge pagina en staat de knoppenrij
   boven het scherm. Op de kleinste schermhoogte (svh) is de pagina nooit
   hoger dan wat je met werkbalk ziet, dus valt er niets te verschuiven. */
@supports (height:100svh){ html,body{height:100svh} }
body{
  color:var(--inkt);font-family:var(--font-ui);
  font-size:15px;line-height:1.55;font-weight:500;
  display:flex;flex-direction:column;
  background:none;overscroll-behavior:none;
}
/* een vleugje papierkorrel over alles */
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:var(--korrel);background-size:170px 170px;opacity:.045;
}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:0;margin:0}
p{margin:0}
a{color:inherit;touch-action:manipulation}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
main,.balk{position:relative;z-index:1}

/* ---------- vaste bovenbalk ---------- */
.balk{
  flex:0 0 auto;z-index:40;padding-top:env(safe-area-inset-top);
}
/* het merkteken volgt het thema */
.beeldmerk .vak-accent{fill:var(--accent-vlak)}
.beeldmerk .lijn{stroke:var(--inkt)}
.balk-in{
  max-width:640px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:11px;min-height:58px;
}
.balk-rechts{margin-left:auto;display:flex;gap:8px}
.balk-links{display:flex;gap:8px;align-items:center}
.plus-knop svg{width:17px;height:17px}
.knop{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--lijn);border-radius:999px;background:var(--kaart);
  padding:9px 15px;font:700 13px var(--font-ui);color:var(--inkt);
  box-shadow:var(--sch1);text-decoration:none;white-space:nowrap;
  transition:border-color .15s,background .15s,transform .12s;
}
.knop:hover{border-color:var(--accent-lijn)}
.knop:active{transform:translateY(1px)}
.knop svg{width:15px;height:15px}
.knop.vol{background:var(--inkt);border-color:var(--inkt);color:var(--grond)}
.knop.vol:hover{filter:brightness(1.15)}
@media (max-width:430px){ .knop .lbl-weg{display:none} .knop{padding:9px 12px} }
/* De uitleg zit achter één vraagteken, gezet als het woord "vermoord":
   schuine schreefletter in dezelfde rode inkt. */
.vraag-knop{
  width:38px;height:38px;padding:0;border-radius:999px;
  border:1px solid var(--lijn);background:var(--kaart);box-shadow:var(--sch1);
  font-family:var(--font-display);font-style:italic;font-weight:600;font-size:21px;
  line-height:1;color:var(--inkt);
  display:inline-flex;align-items:center;justify-content:center;
  transition:border-color .15s,transform .12s,color .15s;
}
.vraag-knop:hover{border-color:var(--accent-lijn)}
.vraag-knop:active{transform:translateY(1px)}

main{
  flex:1;min-height:0;width:100%;max-width:640px;margin:0 auto;padding:0 20px;
  display:flex;flex-direction:column;
}

/* ---------- titelblok: het merk, de payoff en de zaakregel ----------
   De Engelse payoff hoort bij het merk en staat daarom vlak onder de
   woordmerk-regel, klein en gespatieerd: zo leest hij als onderdeel van de
   naam en niet als een zin. De Nederlandse regel eronder is de stem van
   het spel zelf en staat duidelijk apart, groter en in schuine inkt. */
.titelblok{flex:0 0 auto;text-align:center;padding:2px 0 30px}
.beeldmerk{width:38px;height:38px;display:block;margin:0 auto 8px;object-fit:contain}
/* De oude .woordmerk-tekstregel staat verderop en zet zelf een display; deze
   selectors wegen zwaarder zodat er altijd precies één woordmerk staat. */
img.woordmerk{display:block;height:clamp(46px,15vw,68px);width:auto;max-width:82%;margin:0 auto;font-size:0;letter-spacing:0}
img.woordmerk.woordmerk-licht{display:none}
html[data-thema="licht"] img.woordmerk.woordmerk-licht{display:block}
html[data-thema="licht"] img.woordmerk.woordmerk-donker{display:none}
.woordmerk{
  font-family:var(--font-display);font-weight:600;font-size:30px;
  letter-spacing:-.02em;line-height:1;color:var(--inkt);
}
.woordmerk .w1{color:var(--accent)}
/* haarlijntje dat het merkblok van de zaakregel scheidt */
.titelblok .scheiding{
  width:56px;height:1px;margin:11px auto 12px;
  background:linear-gradient(90deg,rgba(0,0,0,0),var(--accent),rgba(0,0,0,0));
  opacity:.7;
}
.titelblok h1{
  font-size:25px;font-weight:600;line-height:1.2;letter-spacing:-.01em;
}
.titelblok h1 em{
  font-style:italic;color:var(--zaak-rood);position:relative;white-space:nowrap;
  display:inline-block;transform:rotate(-2deg);transform-origin:50% 70%;
}
/* Geen gelijkmatige lijn maar een penstreek: een gevuld vlak dat dik begint
   en naar rechts uitloopt, met een lichte golf. Dat leest als inkt in
   plaats van als een onderstreping uit een tekstverwerker. */
.titelblok h1 em::after{
  content:"";position:absolute;left:-11px;right:-13px;bottom:-1px;height:9px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 10' preserveAspectRatio='none'><path d='M1.5 7.8 C 16 5.6, 40 4.2, 66 3.9 C 86 3.65, 104 4.0, 118.5 4.8 C 118.9 5.3, 118.7 5.9, 118 6.2 C 103 5.9, 86 5.9, 68 6.2 C 46 6.55, 24 7.5, 3.2 9.1 C 2.1 9.0, 1.4 8.5, 1.5 7.8 Z' fill='%23E0705A' opacity='.78'/></svg>") center/100% 100% no-repeat;
}
html[data-thema="licht"] .titelblok h1 em::after{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 10' preserveAspectRatio='none'><path d='M1.5 7.8 C 16 5.6, 40 4.2, 66 3.9 C 86 3.65, 104 4.0, 118.5 4.8 C 118.9 5.3, 118.7 5.9, 118 6.2 C 103 5.9, 86 5.9, 68 6.2 C 46 6.55, 24 7.5, 3.2 9.1 C 2.1 9.0, 1.4 8.5, 1.5 7.8 Z' fill='%23A3402F' opacity='.7'/></svg>");
}
@media (max-height:720px){
  .titelblok{padding:6px 0 14px}
  .beeldmerk{width:32px;height:32px;margin-bottom:6px}
  img.woordmerk{height:clamp(38px,12vw,50px)}
  .titelblok .scheiding{margin:9px auto 9px}
  .titelblok h1{font-size:22px}
}

/* ---------- filterregel boven de lijst ---------- */
.filter-plak{
  position:relative;z-index:2;
  flex:0 0 auto;padding:2px 0 0;display:flex;align-items:center;gap:9px;
}
.lijst-teller{flex:1;min-width:0;color:var(--dof);font:800 11px var(--font-ui);
  letter-spacing:.14em;text-transform:uppercase}

/* klein sorteerknopje: op zaaknummer of op titel */
.sorteer{
  flex:0 0 auto;display:flex;background:var(--kaart);border:1px solid var(--lijn);
  border-radius:999px;padding:3px;box-shadow:var(--sch1);
}
.sorteer button{
  border:none;background:none;border-radius:999px;padding:5px 11px;
  font:700 11.5px var(--font-ui);color:var(--dof);transition:all .15s;white-space:nowrap;
}
.sorteer button.aan{background:var(--inkt);color:var(--grond)}

/* niveaufilter: één sterknopje met een kleine uitklaplijst eronder */
.drop{position:relative;flex:0 0 auto}
.mini-knop{
  display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;
  border:1px solid var(--lijn);border-radius:999px;background:var(--kaart);
  color:var(--dof);font:700 11.5px var(--font-ui);box-shadow:var(--sch1);
  transition:all .15s;
}
.mini-knop svg{width:13px;height:13px}
.mini-knop[hidden]{display:none}
.mini-knop:hover{border-color:var(--accent-lijn);color:var(--inkt-2)}
.mini-knop.aan{background:var(--inkt);border-color:var(--inkt);color:var(--grond)}
.drop-menu{
  position:absolute;top:calc(100% + 7px);right:0;z-index:50;min-width:158px;
  background:var(--kaart);border:1px solid var(--lijn);border-radius:13px;
  padding:5px;box-shadow:var(--sch2);display:none;
}
.drop.open .drop-menu{display:block;animation:dropIn .16s ease both}
@keyframes dropIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.drop-menu button{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  border:none;background:none;border-radius:9px;padding:8px 10px;
  font:700 12.5px var(--font-ui);color:var(--inkt-2);
}
.drop-menu button:hover{background:var(--kaart-2);color:var(--inkt)}
.drop-menu button.aan{color:var(--inkt)}
.drop-streep{height:1px;background:var(--lijn);margin:5px 8px}
.drop-menu button .stipjes{display:flex;gap:3px;margin-left:auto}
.drop-menu button .stipjes i{width:5px;height:5px;border-radius:50%;background:var(--lijn);font-style:normal}
.drop-menu button .stipjes i.aan{background:var(--accent)}
.drop-menu button .vink{width:13px;flex:0 0 auto;color:var(--accent);opacity:0}
.drop-menu button.aan .vink{opacity:1}


/* ---------- zaken: genummerde dossierrijen ---------- */
.level-list{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:10px;
  /* Geen balk; de randen van het venster zijn een verloop, zodat een kaart
     onderaan opkomt en bovenaan oplost in plaats van afgesneden te worden. */
  scrollbar-width:none;
  /* Bovenaan een verloop, zodat kaarten oplossen voor ze de filterrij raken;
     onderaan een minimale uitloop van achttien pixels, net genoeg om de
     onderrand van het scherm niet als een harde streep te laten lezen. */
  padding:40px 0 calc(18px + env(safe-area-inset-bottom));
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 40px,#000 calc(100% - 18px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 40px,#000 calc(100% - 18px),transparent 100%);
}
.level-list::-webkit-scrollbar{display:none}
/* Breed scherm: de zaken in twee kolommen, de kop wat lager. */
/* Breed scherm: de zaken als tegels, van links naar rechts en dan een rij
   lager. Twee brede kolommen lazen als twee losse lijsten naast elkaar; met
   vier smallere tegels loopt de volgorde weer gewoon door. */
@media (min-width:1100px) and (min-height:600px){
  main{max-width:1120px}
  .titelblok{padding-bottom:16px}
  .level-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px;align-content:start}
  .level-rij{margin:0}
}
.level-rij{
  position:relative;overflow:hidden;
  /* Nooit krimpen: de lijst is een flexkolom en een kaart met overflow:hidden
     zou anders in elkaar gedrukt worden zodra de lijst voller is dan het
     scherm, in plaats van te scrollen. */
  flex:0 0 auto;
  display:flex;align-items:center;gap:13px;text-decoration:none;
  background:var(--kaart);border:1px solid var(--lijn);border-radius:15px;
  padding:15px 16px;box-shadow:var(--sch1);
  transition:transform .14s cubic-bezier(.2,.8,.3,1),box-shadow .18s,border-color .18s;
}
/* het thema als klein wapenschild in de hoek, op een zacht vlakje —
   geen vouwlijn, die liep als een streep over de hele kaart */
.thema-hoek{
  position:absolute;top:0;right:0;width:44px;height:44px;pointer-events:none;
}
.thema-hoek::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(225deg,var(--accent-zacht) 0 30px,transparent 30px);
  border-bottom-left-radius:12px;
}
.thema-hoek svg{
  position:absolute;top:7px;right:8px;width:16px;height:16px;color:var(--accent);
  opacity:.92;
}
.level-rij:hover{border-color:var(--accent-lijn);box-shadow:var(--sch2);transform:translateY(-1px)}
.level-rij:active{transform:none;box-shadow:var(--sch1)}
/* de voorbeeldzaak: lichter vlak, zodat hij er meteen uitspringt */
.level-rij.demo{
  background:color-mix(in srgb, var(--kaart) 76%, var(--inkt) 24%);
  border-color:var(--accent-lijn);
}
html[data-thema="licht"] .level-rij.demo{background:#FFFFFF}
.level-rij.demo h3{color:var(--inkt)}
.level-rij.demo .zaak-nr{background:var(--accent-vlak);border-color:var(--accent-diep);color:var(--accent-op)}
.zaak-nr.demo-teken svg{width:21px;height:21px;display:block}
.level-rij.demo .grid-tag{background:transparent}
.demo-tag{
  font:800 9.5px var(--font-ui);letter-spacing:.13em;text-transform:uppercase;
  color:var(--accent);
}
/* Het formaat staat rechts naast de pijl. */
.rij-tags{flex:0 0 auto;display:flex;flex-direction:column;align-items:stretch;gap:5px}
.rij-tags .grid-tag{text-align:center}
/* Afgerond: het woord staat op de plek van de bolletjes, met je tijd erachter,
   en de kaart zelf zakt een toon terug. Zo komen de open zaken naar voren en
   hoeft er rechts niets meer bij. */
.afgerond{display:inline-flex;align-items:center;gap:7px;color:var(--accent)}
.afgerond svg{width:13px;height:13px;flex:0 0 auto}
.afgerond b{font:800 10px var(--font-ui);letter-spacing:.14em;text-transform:uppercase}
.afgerond span{font:700 12px var(--font-ui);font-variant-numeric:tabular-nums;color:var(--inkt-2)}
.level-rij.voltooid{background:color-mix(in srgb,var(--kaart) 50%,var(--grond) 50%);box-shadow:none}
.level-rij.voltooid h3{color:var(--inkt-2)}
.level-rij.voltooid .zaak-nr{background:var(--accent);border-color:var(--accent);color:#fff}
.level-rij.voltooid .zaak-nr svg{width:22px;height:22px;display:block}
.level-rij.voltooid .grid-tag{background:transparent}
.zaak-nr{border-color:var(--accent);color:var(--accent)}
/* Op een smal scherm is het vinkje met de tijd genoeg; het woord zou de
   titel te veel ruimte kosten. */
.zaak-nr{
  flex:0 0 auto;width:40px;height:40px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--accent);
  background:var(--accent-zacht);border:1px solid var(--accent-lijn);
  font-variant-numeric:tabular-nums;
}
.level-rij .midden{flex:1;min-width:0}
.level-rij h3{font-size:18px;font-weight:600;color:var(--inkt);line-height:1.25;overflow-wrap:anywhere}
.level-rij .onder{margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.niveau-rij{display:flex;align-items:center;gap:3px}
.niveau-rij i{width:6px;height:6px;border-radius:50%;background:var(--lijn);font-style:normal}
.niveau-rij i.aan{background:var(--accent)}
.grid-tag{
  flex:0 0 auto;font:700 12px var(--font-ui);letter-spacing:.02em;color:var(--inkt-2);
  background:var(--kaart-2);border:1px solid var(--lijn);border-radius:8px;padding:5px 9px;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.level-rij .pijl{flex:0 0 auto;color:var(--dof);display:flex}
.level-rij .pijl svg{width:15px;height:15px}
.level-rij:hover .pijl{color:var(--accent)}
.leeg-melding{color:var(--dof);font-size:13.5px;text-align:center;padding:26px 10px;
  background:var(--kaart-2);border:1px dashed var(--lijn);border-radius:15px;margin-top:14px}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.modal .sluier{position:absolute;inset:0;background:rgba(10,12,8,.6);backdrop-filter:blur(3px)}
/* Nooit in vh: in een telefoonbrowser is 1vh een honderdste van het scherm
   mét verborgen adresbalk, terwijl het venster (.modal, position:fixed) zo
   groot is als wat je op dat moment écht ziet. Een vel van 86vh was daardoor
   hoger dan de ruimte, stond gecentreerd en stak boven én onder uit; de
   bovenkant leek afgesneden. Procenten van het venster kloppen altijd. */
.vel{
  position:relative;width:100%;max-width:430px;max-height:100%;overflow:auto;overscroll-behavior:contain;
  background:var(--kaart);border:1px solid var(--lijn);border-radius:20px;
  padding:22px;box-shadow:0 24px 60px rgba(38,36,25,.28);
  animation:velIn .3s cubic-bezier(.2,1.05,.3,1) both;
}
@keyframes velIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.vel .sluit{
  position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;
  border:1px solid var(--lijn);background:var(--kaart-2);
  display:flex;align-items:center;justify-content:center;font:600 15px/1 var(--font-ui);color:var(--dof);
}
.vel .sluit:hover{color:var(--inkt)}
.vel-kop{font-family:var(--font-display);font-weight:600;font-size:29px;line-height:1.15;margin-bottom:12px;padding-right:40px}

/* ---------- uitleg-stappen ---------- */
/* Het uitlegvenster houdt één vast formaat, ongeacht de stap: het beeldvak
   en de voet liggen vast, alleen de tekst mag binnen zijn eigen ruimte
   schuiven. Anders springt het venster bij elke klik van maat. */
#modalUitleg .vel{
  height:min(650px,100%);display:flex;flex-direction:column;
}
.uitleg-keuze{flex:0 0 auto;display:flex;gap:4px;padding:3px;margin:0 40px 12px 0;border-radius:999px;
  background:var(--kaart-2);border:1px solid var(--lijn)}
.uitleg-keuze button{flex:1;height:32px;border-radius:999px;background:none;border:0;color:var(--dof);
  font:700 12px var(--font-ui);letter-spacing:.04em;white-space:nowrap;cursor:pointer}
.uitleg-keuze button.aan{background:var(--inkt);color:var(--grond)}
.stap-teller{
  flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dof);margin-bottom:8px;
}
#stapKop{flex:0 0 auto}
/* Titelkaart: alleen de kop, groot in het midden. */
#modalUitleg .vel.titelkaart #stapKop{flex:1;display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;text-align:center;margin:0;padding:0;font-size:44px;line-height:1.1}
.uitleg-merk{display:none;height:34px;width:auto;max-width:60%}
#modalUitleg .vel.titelkaart .uitleg-merk-donker{display:block}
html[data-thema="licht"] #modalUitleg .vel.titelkaart .uitleg-merk-donker{display:none}
html[data-thema="licht"] #modalUitleg .vel.titelkaart .uitleg-merk-licht{display:block}
#modalUitleg .vel.titelkaart .stap-teller,#modalUitleg .vel.titelkaart .stap-beeld,#modalUitleg .vel.titelkaart .stap-tekst{display:none}
.stap-beeld{
  flex:0 0 214px;display:flex;align-items:center;justify-content:center;
  background:var(--kaart-2);border:1px solid var(--lijn-zacht);border-radius:16px;
  padding:16px;margin-bottom:14px;overflow:hidden;
}
.stap-beeld .hb{max-height:100%}
.help-rollen{display:flex;gap:26px;justify-content:center;align-items:center}
.help-rollen .hr{display:flex;flex-direction:column;align-items:center;gap:8px}
.help-rollen .hr-p{position:relative;width:52px;height:74px;display:block}
.help-rollen .hr-v{position:absolute;inset:0}
.help-rollen .hr-v svg{width:100%;height:100%;display:block}
.help-rollen .hr-c{position:absolute;left:9.8%;top:19.4%;width:80.4%;height:56.25%;border-radius:50%;background:#F3F0FA;border:2px solid #2A2118}
.help-rollen b{font:700 12px var(--font-ui);color:var(--inkt-2)}
.stap-tekst{
  flex:1;min-height:0;overflow:auto;
  color:var(--inkt-2);font-size:14.5px;line-height:1.6;
}
.stap-tekst p{margin:0 0 9px}
.stap-tekst p:last-child{margin-bottom:0}
.stap-tekst b{color:var(--inkt)}
.stap-voet{flex:0 0 auto;display:flex;align-items:center;gap:10px;margin-top:16px}
.stap-bolletjes{display:flex;flex-wrap:wrap;gap:4px;flex:1;justify-content:center;min-width:0;padding:0 4px}
.stap-bolletjes i{width:6px;height:6px;border-radius:50%;background:var(--lijn);font-style:normal;transition:background .2s;cursor:pointer}
.stap-bolletjes i.aan{background:var(--accent)}
.stap-voet .knop{padding:9px 13px;white-space:nowrap;flex:0 0 auto}
.stap-voet .knop[disabled]{opacity:.35;cursor:default;border-color:var(--lijn)}

/* het voorbeeldbordje — bewust koel, zo ziet het spelbord er ook uit */
.hb{display:grid;gap:3px;width:150px}
.hb-c{
  position:relative;aspect-ratio:1;border-radius:5px;background:#E7E0D2;
  box-shadow:inset 0 0 0 1px rgba(90,70,40,.18);
  display:flex;align-items:center;justify-content:center;
}
.hb-c.blok{background:#6B5B45;box-shadow:inset 0 0 0 1px rgba(40,28,14,.35)}
.hb-c.leeg{background:none;box-shadow:none}
.hb-c.licht{box-shadow:0 0 0 2px var(--accent)}
.hb-c.gebied{background:#DCCFAE}
.hb-c i{
  width:82%;height:82%;border-radius:50%;font-style:normal;
  display:flex;align-items:center;justify-content:center;
  font:800 13px var(--font-ui);box-shadow:0 0 0 1.3px #1D2036;
}
.hb-c u{text-decoration:none;font:800 13px var(--font-ui);opacity:.9}
.hb-c .kruis{color:#B3413D;font:800 22px/1 var(--font-ui);text-shadow:0 0 2px rgba(255,250,240,.6)}
/* Kleine bewegingen die laten zien wat je doet. */
.hb-c.tik::after{content:"";position:absolute;inset:-3px;border-radius:8px;border:2px solid var(--accent-vlak);
  animation:hbTik 1.8s ease-out infinite}
@keyframes hbTik{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1)}60%,100%{opacity:0;transform:scale(1.25)}}
.hb-c.druk::after{content:"";position:absolute;inset:-3px;border-radius:8px;border:2px solid var(--accent-vlak);
  animation:hbDruk 2.2s ease-in-out infinite}
@keyframes hbDruk{0%{opacity:.15;transform:scale(.86)}55%{opacity:1;transform:scale(1)}75%,100%{opacity:0;transform:scale(1)}}
.hb-c .kruis.komt{animation:hbKruis 2.2s ease-out infinite both}
/* Een kring die opent: alleen de bolletjes, zonder inhoud. */
.hb-ring{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:3}
.hb-ring i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--kaart);border:2px solid var(--accent);box-shadow:0 2px 5px rgba(0,0,0,.3);
  transform:rotate(var(--a)) translate(34px) scale(0);animation:hbRing 3s ease-out infinite}
@keyframes hbRing{0%{transform:rotate(var(--a)) translate(34px) scale(0);opacity:0}18%{transform:rotate(var(--a)) translate(34px) scale(1);opacity:1}72%{transform:rotate(var(--a)) translate(34px) scale(1);opacity:1}86%,100%{transform:rotate(var(--a)) translate(34px) scale(0);opacity:0}}
/* Notitie of plaats: kleine letter in de hoek en grote pion om de beurt. */
.hb-c.wissel u.hoek{position:absolute;left:4px;top:2px;font-size:11px;animation:hbKlein 4s ease-in-out infinite}
.hb-c.wissel i{animation:hbGroot 4s ease-in-out infinite}
@keyframes hbKlein{0%,42%{opacity:.95;transform:scale(1)}50%,92%{opacity:0;transform:scale(.6)}100%{opacity:.95;transform:scale(1)}}
@keyframes hbGroot{0%,42%{opacity:0;transform:scale(.5)}50%,92%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.5)}}
@keyframes hbKruis{0%,8%{opacity:0;transform:scale(.4)}22%{opacity:1;transform:scale(1)}88%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.hb-c.gebied.g-nw{box-shadow:inset 3px 3px 0 #2A2118,inset 0 0 0 1px rgba(28,33,64,.13)}
.hb-c.gebied.g-no{box-shadow:inset -3px 3px 0 #2A2118,inset 0 0 0 1px rgba(28,33,64,.13)}
.hb-c.gebied.g-zw{box-shadow:inset 3px -3px 0 #2A2118,inset 0 0 0 1px rgba(28,33,64,.13)}
.hb-c.gebied.g-zo{box-shadow:inset -3px -3px 0 #2A2118,inset 0 0 0 1px rgba(28,33,64,.13)}
.hb-c.gebied.goud.g-nw{box-shadow:inset 3px 3px 0 #C9A227,inset 0 0 0 1px rgba(28,33,64,.13)}
.hb-c.gebied.goud.g-no{box-shadow:inset -3px 3px 0 #C9A227,inset 0 0 0 1px rgba(28,33,64,.13)}
.hb-c.gebied.goud.g-zw{box-shadow:inset 3px -3px 0 #C9A227,inset 0 0 0 1px rgba(28,33,64,.13)}
.hb-c.gebied.goud.g-zo{box-shadow:inset -3px -3px 0 #C9A227,inset 0 0 0 1px rgba(28,33,64,.13)}

.help-rollen{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.help-rollen .hr{
  display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  background:var(--kaart);border:1px solid var(--lijn);
  font:700 13px var(--font-ui);color:var(--inkt);
}
.help-rollen .stip{width:12px;height:12px;border-radius:4px;box-shadow:0 0 0 1.3px rgba(236,234,224,.4)}

/* ---------- zelf maken: één knop, vast onderaan het scherm ------ */
.zelf-voet{
  position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  padding:14px 0 calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--lijn-zacht);margin-top:2px;
}
/* De kleurschakelaar staat links in dezelfde voet: hij hoort bij de app,
   niet bij het kiezen van een zaak. */
.thema-knop{
  width:38px;height:38px;padding:0;border-radius:999px;
  border:1px solid var(--lijn);background:var(--kaart);box-shadow:var(--sch1);
  display:inline-flex;align-items:center;justify-content:center;
  transition:border-color .15s;
}
.thema-knop:hover{border-color:var(--accent-lijn)}
.thema-knop i{
  width:15px;height:15px;border-radius:50%;display:block;
  background:linear-gradient(135deg,var(--accent-vlak) 50%, var(--inkt) 50%);
}
.zelf-voet .knop{color:var(--inkt-2)}
.zelf-voet .knop svg{color:var(--accent)}

/* ---------- upload en bouwrij (in het venster) ---------- */
.upload-zone{
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  border:1.5px dashed var(--accent-lijn);border-radius:16px;padding:26px 20px;
  background:var(--accent-zacht);cursor:pointer;transition:background .15s,border-color .15s;
}
.upload-zone:hover,.upload-zone.slepen{background:rgba(193,95,60,.16);border-color:var(--accent)}
.upload-zone svg{width:26px;height:26px;color:var(--accent)}
.upload-zone b{font-size:14px;color:var(--inkt)}
.upload-zone span{font-size:12.5px;color:var(--dof)}
.upload-zone input{display:none}
.upload-fout{margin-top:12px;color:var(--fout);font-size:12.5px;font-weight:700;text-align:center}
.of-lijn{
  display:flex;align-items:center;gap:12px;margin:16px 0;
  color:var(--dof);font:800 11px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;
}
.of-lijn::before,.of-lijn::after{content:"";flex:1;height:1px;background:var(--lijn-zacht)}
.bouw-rij{
  display:flex;align-items:center;gap:12px;width:100%;text-decoration:none;
  background:var(--kaart-2);border:1px solid var(--lijn);border-radius:14px;padding:13px 14px;
  transition:border-color .15s;
}
.bouw-rij:hover{border-color:var(--accent-lijn)}
/* De proefstand: dezelfde rij als "Bouw een level", met een schuifje. */
.proef-rij{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;
  background:var(--kaart-2);border:1px solid var(--lijn);border-radius:14px;
  padding:11px 14px;text-align:left;color:inherit;cursor:pointer;
  transition:border-color .15s}
.proef-rij:hover{border-color:var(--accent-lijn)}
.proef-rij .tekst{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.proef-rij .tekst b{font:800 14px var(--font-ui)}
.proef-rij .tekst span{font:600 12px var(--font-ui);color:var(--dof);line-height:1.35}
.proef-rij .schuif{flex:0 0 auto;position:relative;width:38px;height:22px;border-radius:999px;
  background:var(--lijn);transition:background .18s}
.proef-rij .schuif i{position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .18s}
.proef-rij[aria-pressed="true"] .schuif{background:var(--accent)}
.proef-rij[aria-pressed="true"] .schuif i{left:19px}
.bouw-rij .ic{flex:0 0 auto;width:36px;height:36px;border-radius:10px;
  background:var(--kaart);border:1px solid var(--lijn);
  display:flex;align-items:center;justify-content:center;color:var(--inkt-2)}
.bouw-rij .ic svg{width:17px;height:17px}
.bouw-rij .tekst{flex:1;min-width:0}
.bouw-rij b{display:block;font-size:13.5px;color:var(--inkt)}
.bouw-rij span{display:block;font-size:12px;color:var(--dof);line-height:1.45}
.bouw-rij .pijl{color:var(--dof);display:flex}
.bouw-rij .pijl svg{width:14px;height:14px}

/* ── De zaak als tegel op een breed scherm ──
   Deze regels staan bewust achteraan: ze delen hun gewicht met de basisregels
   van .level-rij hierboven, en dan wint wie het laatst komt. */
@media (min-width:1100px) and (min-height:600px){
  /* Nummer en formaat op één regel, daaronder de titel met de zwaarte.
     Geen pijl: een tegel is in zijn geheel de knop. */
  .level-rij{display:grid;grid-template-columns:auto minmax(0,1fr);
    grid-template-rows:auto auto;gap:9px 11px;align-items:start;padding:14px}
  .level-rij .zaak-nr{grid-column:1;grid-row:1;width:36px;height:36px;border-radius:10px;font-size:14px}
  .level-rij .rij-tags{grid-column:2;grid-row:1;justify-self:end;align-self:center;flex-direction:row}
  .level-rij .midden{grid-column:1/-1;grid-row:2}
  .level-rij h3{font-size:16.5px;line-height:1.25}
  .level-rij .onder{margin-top:5px}
  .level-rij .pijl{display:none}
}
</style>
</head>
<body>

<div class="balk">
  <div class="balk-in">
    <div class="balk-links">
      <button class="thema-knop" id="btnThema" type="button" title="Wissel tussen licht en donker" aria-label="Wissel tussen licht en donker"><i></i></button>
      <button class="vraag-knop plus-knop" id="btnZelf" type="button" title="Eigen level spelen of bouwen" aria-label="Eigen level spelen of bouwen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="balk-rechts">
      <button class="vraag-knop" id="btnUitleg" title="Speluitleg" aria-label="Speluitleg">?</button>
    </div>
  </div>
</div>

<main>
  <header class="titelblok">
    <img class="beeldmerk" src="../assets/brand/icon.png" alt="">
    <img class="woordmerk woordmerk-donker" src="../assets/brand/logo-dark.png" alt="ClueBoard">
    <img class="woordmerk woordmerk-licht" src="../assets/brand/logo.png" alt="ClueBoard">
    <div class="scheiding"></div>
    <h1>De waarheid zit in de <em>details</em></h1>
  </header>

  <div class="filter-plak">
    <div class="lijst-teller" id="levelTeller"></div>
    <div class="drop" id="filterDrop">
      <button class="mini-knop" id="filterKnop" type="button" aria-haspopup="true" aria-expanded="false" title="Filter op niveau">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.8.85-4.2 4.1 1 5.75L12 16.9l-5.2 2.7 1-5.75-4.2-4.1 5.8-.85z"/></svg>
        <span id="filterLabel">Filter</span>
      </button>
      <div class="drop-menu" id="filterMenu"></div>
    </div>
    <button class="mini-knop" id="openKnop" type="button" aria-pressed="false" title="Alleen zaken die nog open staan" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/></svg>
      <span>Open</span>
    </button>
    <div class="sorteer" id="sorteerRij" title="Sorteer de lijst">
      <button type="button" class="aan" data-s="nr">Nr</button>
      <button type="button" data-s="titel">A–Z</button>
    </div>
  </div>

  <div class="level-list" id="levelList"><p class="leeg-melding">Zaken laden…</p></div>

  <!-- Zelf spelen of bouwen is voor de meeste bezoekers niet de eerste
       stap: één rustige knop aan het eind van de lijst, de rest in een
       venster. -->
</main>

<!-- ============ Uitleg in stappen ============ -->
<div class="modal" id="modalUitleg">
  <div class="sluier" data-sluit></div>
  <div class="vel">
    <button class="sluit" data-sluit aria-label="Sluiten">✕</button>
    <div class="uitleg-keuze" id="uitlegKeuze">
      <button type="button" data-set="spelen" class="aan">Zo speel je</button>
      <button type="button" data-set="regels">Spelregels</button>
    </div>
    <div class="stap-teller" id="stapTeller"></div>
    <div class="vel-kop" id="stapKop"></div>
    <div class="stap-beeld" id="stapBeeld"></div>
    <div class="stap-tekst" id="stapTekst"></div>
    <div class="stap-voet">
      <button class="knop" id="stapTerug">← Vorige</button>
      <div class="stap-bolletjes" id="stapBolletjes"></div>
      <button class="knop vol" id="stapVerder">Volgende →</button>
    </div>
  </div>
</div>

<!-- ============ Zelf maken: upload + builder ============ -->
<div class="modal" id="modalZelf">
  <div class="sluier" data-sluit></div>
  <div class="vel">
    <button class="sluit" data-sluit aria-label="Sluiten">✕</button>
    <div class="vel-kop">Zelf aan de slag</div>
    <label class="upload-zone" id="uploadZone" for="uploadInput">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4M12 4l-4.5 4.5M12 4l4.5 4.5"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/>
      </svg>
      <b>Speel een eigen level</b>
      <span>Sleep een JSON-bestand hierheen, of klik om te kiezen</span>
      <input type="file" id="uploadInput" accept=".json,application/json">
    </label>
    <div class="upload-fout" id="uploadFout" hidden></div>
    <div class="of-lijn">of</div>
    <a class="bouw-rij" href="../builder/index.html">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20h16"/><path d="M6.5 16.5 15.7 7.3a2.1 2.1 0 0 1 3 3l-9.2 9.2L5 20z"/>
      </svg></span>
      <span class="tekst"><b>Bouw een level</b><span>Teken een bord, schrijf aanwijzingen en exporteer je eigen zaak.</span></span>

}

   bovenste rij met knoppen buiten beeld. Zodra dat gebeurt, gaat hij terug
   naar nul, ook als de pagina uit de cache terugkomt. */
function naarBoven(){
  if(window.scrollY||document.documentElement.scrollTop||document.body.scrollTop) window.scrollTo(0,0);
  document.documentElement.scrollTop=0; document.body.scrollTop=0;
  /* Het zichtbare venster kan los van de pagina verschoven zijn (iOS bij
     het in- en uitklappen van de werkbalk); ook dat hoort op nul. */
  if(window.visualViewport && window.visualViewport.offsetTop>0) window.scrollTo(0,0);
}

window.addEventListener("pageshow",naarBoven);

if(window.visualViewport){
  window.visualViewport.addEventListener("resize",naarBoven);

/* ============================================================
   Hoe speel je? — korte, simpele stappen, van zaak tot ontknoping.

/* Dezelfde letterkleuren als in de assetbank (V4-palet): A C01, B C02, C C03,
   D C04, en het slachtoffer C13. Het menu is zelfstandig, dus ze staan hier
   uitgeschreven; wijzig ze samen met manifest.personColors. */
const HB_KLEUREN = { A:"#C79A3A", B:"#3E8DB5", C:"#694875", D:"#E07A9A", V:"#B6544A" };
function letterInkt(hex){
  const h=hex.replace("#","");
  const lum=0.2126*parseInt(h.slice(0,2),16)+0.7152*parseInt(h.slice(2,4),16)+0.0722*parseInt(h.slice(4,6),16);
  return lum>140 ? "#1D2036" : "#FFFFFF";
}
function helpBord(regels, opt){

  const cel=Math.min(42, Math.floor((186-(rijen-1)*kier)/rijen));
  const breedte=kolommen*cel+(kolommen-1)*kier;
  let h='<div class="hb" style="width:'+breedte+'px;grid-template-columns:repeat('+kolommen+',1fr)">';
  regels.forEach((rij,y)=>{
    [...rij].forEach((c,x)=>{
      const licht=(o.licht||[]).some(p=>p[0]===x&&p[1]===y);
      const geb=(o.gebied||[]).find(p=>p[0]===x&&p[1]===y);
      const tik=(o.tik||[]).some(p=>p[0]===x&&p[1]===y);
      const ring=(o.ring||[]).some(p=>p[0]===x&&p[1]===y);
      const wissel=(o.wissel||[]).find(p=>p[0]===x&&p[1]===y);
      const druk=(o.druk||[]).some(p=>p[0]===x&&p[1]===y);
      let cls="hb-c"+(licht?" licht":"")+(geb?" gebied "+geb[2]:"")+(tik?" tik":"")+(druk?" druk":"")+(ring?" ring":"")+(wissel?" wissel":"");
      let inner="";
      if(c==="#") cls+=" blok";
      else if(c==="_") cls+=" leeg";
      else if(c==="x"||c==="X"){
        const vertraag=(o.golf?x*150:0);
        inner='<b class="kruis'+(c==="X"?" komt":"")+'"'+(vertraag?' style="animation-delay:'+vertraag+'ms"':"")+'>×</b>';
      }
      else if(/[A-Z]/.test(c)){
        const k=HB_KLEUREN[c]||"#8A93A6";
        inner='<i style="background:'+k+';color:'+letterInkt(k)+'">'+c+'</i>';
      } else if(/[a-z]/.test(c)){
        const k=HB_KLEUREN[c.toUpperCase()]||"#8A93A6";
        inner='<u style="color:'+k+'">'+c.toUpperCase()+'</u>';
      }
      /* Een kring die opent, alleen de bolletjes; en de wissel tussen de
         kleine letter in de hoek (notitie) en de grote pion (plaats). */

      h+='<span class="'+cls+'">'+inner+'</span>';
    });
  });
  return h+"</div>";
}
/* Dezelfde banier en hetzelfde schild als in het spel, zodat je de vorm
   later op het bord meteen herkent. */
function meng(hex,f){
  const n=parseInt(hex.replace("#",""),16);
  const k=v=>Math.max(0,Math.min(255,Math.round(v*f)));
  return "#"+[k(n>>16&255),k(n>>8&255),k(n&255)].map(v=>v.toString(16).padStart(2,"0")).join("");
}

let uitlegSet="spelen";
/* Eén doorlopende reeks: een titelkaart, de spelregels, een titelkaart, en
   hoe je speelt. De keuze bovenin springt naar de titelkaart van dat deel;
   de knop onderaan loopt er gewoon doorheen en sluit aan het eind. */

   weten wat hij moet doen. */
const UITLEG_STAPPEN=[{titel:"Zo speel je",set:"spelen"}]
  .concat(UITLEG_SETS.spelen.map(s=>Object.assign({set:"spelen"},s)))
  .concat([{titel:"De Spelregels",set:"regels"}])
  .concat(UITLEG_SETS.regels.map(s=>Object.assign({set:"regels"},s)));

let uitlegStap=0;
function tekenUitleg(){
  uitlegStap=Math.max(0,Math.min(UITLEG_STAPPEN.length-1,uitlegStap));
  const s=UITLEG_STAPPEN[uitlegStap];
  uitlegSet=s.set;
  document.querySelectorAll("#uitlegKeuze button").forEach(b=>b.classList.toggle("aan",b.dataset.set===s.set));
  $("#modalUitleg .vel").classList.toggle("titelkaart",!!s.titel);
  const deel=UITLEG_STAPPEN.filter(x=>x.set===s.set&&!x.titel), i=deel.indexOf(s);
  $("#stapTeller").textContent=s.titel?"":"Stap "+(i+1)+" van "+deel.length;
  if(s.titel){
    $("#stapKop").innerHTML='<img class="uitleg-merk uitleg-merk-donker" src="../assets/brand/logo-dark.png" alt="ClueBoard">'
      +'<img class="uitleg-merk uitleg-merk-licht" src="../assets/brand/logo.png" alt="ClueBoard"><span></span>';
    $("#stapKop span").textContent=s.titel;
  } else $("#stapKop").textContent=s.kop;
  $("#stapBeeld").innerHTML=s.titel?"":s.beeld;      /* eigen vaste inhoud, geen levelinvoer */
  $("#stapTekst").innerHTML=s.titel?"":s.tekst;      /* idem */
  $("#stapBolletjes").innerHTML=s.titel?"":deel.map((_,j)=>'<i class="'+(j===i?"aan":"")+'"></i>').join("");
  $("#stapTerug").disabled=uitlegStap===0;

  $("#stapVerder").textContent=!volgende ? "Sluiten" : volgende.titel ? volgende.titel+" →" : "Volgende →";
  $("#stapVerder").disabled=false;

function zetUitlegSet(k){
  if(!UITLEG_SETS[k]) return;
  uitlegSet=k; uitlegStap=Math.max(0,UITLEG_STAPPEN.findIndex(s=>s.titel&&s.set===k));
  tekenUitleg();
}

$("#stapVerder").addEventListener("click",()=>{

/* ============================================================
   Zaken: dezelfde controle, ontdekking en versielogica als de player.
   ============================================================ */
function validateLevel(raw){
  if(!raw || typeof raw!=="object") return "Geen geldig JSON-object.";
  if(raw.format && raw.format!=="clueboard-level") return "Onbekend format: "+raw.format+".";
  const p=raw.puzzle;
  if(!p) return "Veld 'puzzle' ontbreekt.";
  if(!p.grid || !p.grid.columns || !p.grid.rows) return "Veld 'puzzle.grid' is onvolledig.";
  if(!Array.isArray(p.tiles) || !p.tiles.length) return "Veld 'puzzle.tiles' ontbreekt of is leeg.";
  if(!p.people || !Array.isArray(p.people.placements) || !p.people.placements.length)
    return "Veld 'puzzle.people.placements' ontbreekt.";
  if(!raw.solution || !Array.isArray(raw.solution.placements) || !raw.solution.placements.length)
    return "Veld 'solution.placements' ontbreekt — dit level is niet compleet.";
  return null;
}
const GRAAD_WOORD={1:"Instap",2:"Licht",3:"Gemiddeld",4:"Pittig",5:"Zwaar"};
function levelGraad(raw){
  const d=raw&&raw.difficulty;
  return (d && d.graad>=1 && d.graad<=5) ? d : null;
}
async function discoverLevelFiles(){
  const names=new Set();
  const add=n=>{
    const f=String(n||"").split("?")[0].split("#")[0].replace(/^.*[\\\/]/,"");
    if(f && /\.json$/i.test(f) && f.toLowerCase()!=="index.json") names.add(f);
  };
  try{
    const r=await fetch(LEVELS_DIR+"index.json",{cache:"no-store"});
    if(r.ok){
      const j=await r.json();
      (Array.isArray(j)?j:((j&&j.levels)||[])).forEach(e=>add(typeof e==="string"?e:(e&&e.file)));
    }
  }catch(e){}
  /* De index is de gewone weg. Alleen als die niets oplevert kijken we of de
     server toevallig een mapoverzicht geeft. Op GitHub Pages bestaat dat niet,
     dus die poging kostte alleen een wachttijd voordat het eerste level werd
     opgehaald. */
  if(!names.size){
    try{
      const r=await fetch(LEVELS_DIR,{cache:"no-store"});
      if(r.ok && /html/i.test(r.headers.get("content-type")||"")){
        const html=await r.text();
        const re=/href\s*=\s*["']([^"']+)["']/gi;
        let m; while((m=re.exec(html))) add(decodeURIComponent(m[1]));
      }
    }catch(e){}
  }
  return Array.from(names).sort((a,b)=>a.localeCompare(b,"nl"));
}
/* Van elk level (herkenbaar aan zijn verborgen levelId) alleen de nieuwste
   versie tonen; oudere exportbestanden blijven gewoon in de map staan. */
function nieuwsteVersies(items){
  const groepen=new Map();
  items.forEach(e=>{
    const id=(e.raw&&typeof e.raw.levelId==="string"&&e.raw.levelId)?e.raw.levelId:null;
    const sleutel=id?("id:"+id):("naam:"+e.source);
    const versie=(e.raw&&typeof e.raw.levelVersion==="number")?e.raw.levelVersion:0;
    const huidig=groepen.get(sleutel);
    if(!huidig||versie>huidig.versie) groepen.set(sleutel,{entry:e,versie});
  });
  return Array.from(groepen.values()).map(x=>x.entry);
}

let alleLevels=[];       /* gesorteerd; index+1 = vast zaaknummer */
let actieveFilter=0;
let alleenOpen=false;   /* alleen zaken die je nog niet hebt afgerond */
let sorteer="nr";        /* "nr" (zaaknummer) of "titel" (A–Z) */

/* Wat je van een zaak hebt afgerond staat in de browser van deze telefoon,
   onder dezelfde sleutel die de player schrijft. Alleen een uitgespeelde
   zaak komt erin, met de snelste tijd. */
const VOLTOOID_KEY="cb_voltooid";
function levelSleutel(raw){
  if(raw && typeof raw.levelId==="string" && raw.levelId) return raw.levelId;
  return (raw && raw.content && raw.content.title) || "level";
}
function voltooidVan(raw){
  try{
    const alles=JSON.parse(localStorage.getItem(VOLTOOID_KEY)||"{}");
    return alles[levelSleutel(raw)]||null;
  }catch(e){ return null; }
}
function tijdTekst(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
function levelHref(source){
  return PLAYER_URL+"?level="+encodeURIComponent(source.replace(/\.json$/i,""));
}
function maakLevelRij(entry){
  const raw=entry.raw, c=raw.content||{};
  const demo=raw.demo===true;
  const a=document.createElement("a");
  a.className="level-rij"+(demo?" demo":"");
  a.href=levelHref(entry.source);

  const nr=document.createElement("span"); nr.className="zaak-nr";
  if(demo){
    /* De voorbeeldzaak heeft geen nummer: een speelteken op de plek ervan. */
    nr.classList.add("demo-teken"); nr.title="Voorbeeldzaak";
    /* Een opengeslagen boek: dit is de zaak waarin je het spel leert. */
    nr.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      +'<path d="M12 6.6c-2.3-1.6-5-1.9-8.2-.9v12.6c3.2-1 5.9-.7 8.2.9 2.3-1.6 5-1.9 8.2-.9V5.7c-3.2-1-5.9-.7-8.2.9z"/>'
      +'<path d="M12 6.6v12.6"/></svg>';
  } else {
    /* Twee cijfers voor de gewone gevallen; een groter nummer krijgt gewoon
       de ruimte die het nodig heeft. */
    nr.textContent=String(entry.nummer).padStart(2,"0");
  }
  a.appendChild(nr);

  const midden=document.createElement("div"); midden.className="midden";
  const h=document.createElement("h3"); h.textContent=c.title||"Naamloos niveau";
  midden.appendChild(h);
  const onder=document.createElement("div"); onder.className="onder";
  const g=levelGraad(raw);
  const vt=voltooidVan(raw);
  if(vt){
    /* Afgerond: het woord en je snelste tijd op de plek van de zwaarte. Hoe
       zwaar hij was doet er niet meer toe; dat je hem hebt opgelost wel. */
    a.classList.add("voltooid");
    const af=document.createElement("span"); af.className="afgerond";
    af.title="Afgerond in "+tijdTekst(vt.tijd);
    af.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.6 4.5L19 7.5"/></svg>'
      +'<b>Afgerond</b><span>'+tijdTekst(vt.tijd)+'</span>';
    onder.appendChild(af);
    /* Het nummer maakt plaats voor een wit vinkje op een geel vak. */
    nr.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.6 4.5L19 7.5"/></svg>';
  } else if(g){
    const nv=document.createElement("span"); nv.className="niveau-rij"; nv.title=g.uitleg||("Niveau "+g.graad);
    nv.innerHTML=[1,2,3,4,5].map(n=>'<i class="'+(n<=g.graad?"aan":"")+'"></i>').join("");
    onder.appendChild(nv);
    /* Na de bolletjes in woorden hoe zwaar de zaak is. */
    const tag=document.createElement("span"); tag.className="demo-tag";
    tag.textContent=GRAAD_WOORD[g.graad]||("Niveau "+g.graad);
    onder.appendChild(tag);
  }
  if(onder.children.length) midden.appendChild(onder);
  /* Geen introtekst op de kaart: elke zaak toont hier alleen zijn titel,
     zodat de lijst één ritme houdt. Het verhaal begint in de player. */
  a.appendChild(midden);

  /* het thema als gevouwen hoekje met een teken, niet als tekst */
  const th=raw.puzzle && raw.puzzle.theme;
  if(THEMA_LABELS[th]){
    const hoek=document.createElement("span"); hoek.className="thema-hoek";
    hoek.title=raw.puzzle.themeLabel||THEMA_LABELS[th];
    hoek.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><path d="M12 3.2l7 2.6v5.4c0 4.5-2.9 7.3-7 9-4.1-1.7-7-4.5-7-9V5.8z"/></svg>';
    a.appendChild(hoek);
  }

  const tags=document.createElement("span"); tags.className="rij-tags";

  const grid=raw.puzzle.grid;
  const tag=document.createElement("span"); tag.className="grid-tag";
  tag.textContent=grid.columns+"×"+grid.rows;
  tags.appendChild(tag);
  a.appendChild(tags);

  const pijl=document.createElement("span"); pijl.className="pijl";
  pijl.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5.6l6.4 6.4L9 18.4"/></svg>';
  a.appendChild(pijl);
  return a;
}
/* Het niveaufilter zit achter één sterknopje; de lijst eronder toont
   alleen de niveaus die er echt zijn. */
function tekenFilter(){
  const menu=$("#filterMenu"), knop=$("#filterKnop"), label=$("#filterLabel");
  const aanwezig=[1,2,3,4,5].filter(n=>
    alleLevels.some(e=>{ const g=levelGraad(e.raw); return g && g.graad===n; }));
  const ietsAfgerond=alleLevels.some(e=>voltooidVan(e.raw));
  /* De keuzelijst verdwijnt alleen als er niets te kiezen valt: één niveau
     én nog niets afgerond. */
  $("#filterDrop").style.display=aanwezig.length<=1?"none":"";
  menu.innerHTML="";
  /* Open zaken is een eigen knop naast het niveaufilter, en alleen zichtbaar
     zodra er iets is afgerond. */
  const ok=$("#openKnop");
  if(ok){ ok.hidden=!ietsAfgerond; ok.classList.toggle("aan",alleenOpen); ok.setAttribute("aria-pressed",alleenOpen?"true":"false"); }
  [{n:0,l:"Alle niveaus"}].concat(aanwezig.map(n=>({n,l:"Niveau "+n}))).forEach(c=>{
    const b=document.createElement("button");
    b.type="button"; b.className=(actieveFilter===c.n?"aan":"");
    const vink=document.createElement("span"); vink.className="vink";
    vink.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    const tekst=document.createElement("span"); tekst.textContent=c.l;
    b.appendChild(vink); b.appendChild(tekst);
    if(c.n){
      const st=document.createElement("span"); st.className="stipjes";
      st.innerHTML=[1,2,3,4,5].map(x=>'<i class="'+(x<=c.n?"aan":"")+'"></i>').join("");
      b.appendChild(st);
    }
    b.onclick=()=>{
      actieveFilter=c.n;
      $("#filterDrop").classList.remove("open");
      knop.setAttribute("aria-expanded","false");
      tekenFilter(); tekenLijst();
    };
    menu.appendChild(b);
  });
  knop.classList.toggle("aan", !!actieveFilter);
  label.textContent = actieveFilter ? ("Niveau "+actieveFilter) : "Niveau";
}
$("#openKnop").addEventListener("click",()=>{ alleenOpen=!alleenOpen; tekenFilter(); tekenLijst(); });
$("#filterKnop").addEventListener("click",e=>{
  e.stopPropagation();
  const drop=$("#filterDrop");
  const open=drop.classList.toggle("open");
  $("#filterKnop").setAttribute("aria-expanded", open?"true":"false");
});
document.addEventListener("click",e=>{
  if(!e.target.closest("#filterDrop")){
    $("#filterDrop").classList.remove("open");
    $("#filterKnop").setAttribute("aria-expanded","false");
  }
});
function tekenLijst(){
  const lijst=$("#levelList");
  const zichtbaar=alleLevels.filter(e=>{
    if(alleenOpen && voltooidVan(e.raw)) return false;
    if(!actieveFilter) return true;
    const g=levelGraad(e.raw);
    return g && g.graad===actieveFilter;
  });
  /* Sorteren: op vast zaaknummer, of op titel. */
  zichtbaar.sort((a,b)=>{
    /* De voorbeeldzaak staat altijd bovenaan, hoe je ook sorteert. */
    const da=a.raw.demo===true, db=b.raw.demo===true;
    if(da!==db) return da?-1:1;
    if(sorteer==="titel"){
      const ta=(((a.raw.content||{}).title)||"").toLowerCase();
      const tb=(((b.raw.content||{}).title)||"").toLowerCase();
      return ta.localeCompare(tb,"nl");
    }
    return a.nummer-b.nummer;
  });
  lijst.innerHTML="";
  if(!zichtbaar.length){
    const p=document.createElement("p"); p.className="leeg-melding";
    p.textContent="Geen zaken bij dit niveau.";
    lijst.appendChild(p);
  } else {
    zichtbaar.forEach(e=>lijst.appendChild(maakLevelRij(e)));
  }
  const n=zichtbaar.length, tot=alleLevels.length;
  /* Zonder filter draagt deze regel de belofte van het spel; zodra je
     filtert wordt hij functioneel en telt hij wat je overhoudt. */
  /* Geen slogan meer boven de lijst; alleen als je filtert telt hij mee. */
  $("#levelTeller").textContent = (!tot || n===tot) ? "" : n+" van "+tot+" zaken";
}
/* Het overzicht: van elke zaak alleen wat er op de kaart komt te staan --
   titel, zwaarte, bordmaat, nummer. Eén klein bestand voor alle zaken samen,
   in plaats van elk levelbestand helemaal ophalen om er vier regels uit te
   lezen. Het volledige level laadt pas als je erop klikt, in de speler.
   Bijwerken met: python assets/tools/build_levels.py */
async function laadOverzicht(){
  try{
    const r=await fetch(LEVELS_DIR+"overzicht.json",{cache:"no-store"});
    if(!r.ok) return null;
    const j=await r.json();
    const rij=Array.isArray(j)?j:((j&&j.levels)||[]);
    const uit=new Map();
    rij.forEach(e=>{
      const naam=e&&e.file;
      if(naam && e.content && e.puzzle && e.puzzle.grid) uit.set(naam,e);
    });
    return uit.size?uit:null;
  }catch(e){ return null; }
}
async function laadLevels(){
  const lijst=$("#levelList");
  let files=[], gebroken=0, geladen=[];
  const [lijstUitIndex,overzicht]=await Promise.all([
    discoverLevelFiles().catch(()=>[]),
    laadOverzicht()
  ]);
  files=lijstUitIndex;
  /* Staat een zaak nog niet in het overzicht -- net toegevoegd, script nog
     niet gedraaid -- dan wordt alleen díe zaak in zijn geheel opgehaald. Zo
     komt een nieuw level altijd in beeld, ook zonder het script. */
  const missend=overzicht?files.filter(n=>!overzicht.has(n)):files;
  if(overzicht) files.forEach(n=>{ const e=overzicht.get(n); if(e) geladen.push({raw:e, source:n}); });
  /* De rest tegelijk ophalen in plaats van een voor een: de browser doet
     meerdere aanvragen naast elkaar, dus dit duurt zo lang als de traagste
     in plaats van alle wachttijden bij elkaar opgeteld. */
  await Promise.all(missend.map(async naam=>{
    try{
      const r=await fetch(LEVELS_DIR+naam,{cache:"no-store"});
      if(!r.ok) return;
      const raw=await r.json();
      if(validateLevel(raw)){ gebroken++; return; }
      geladen.push({raw, source:naam});
    }catch(e){ gebroken++; }
  }));
  /* Volgorde: de voorbeeldzaak altijd eerst, daarna op niveau en titel.
     Het NUMMER komt uit het level zelf (levelNumber uit de bouwer) en hoort
     dus bij de zaak, niet bij zijn plek in de lijst — zet er een level bij en
     de rest houdt zijn dossiernummer. Levels van vóór dat veld vallen terug
     op hun plek in de lijst. */
  alleLevels=nieuwsteVersies(geladen).sort((a,b)=>{
    const da=a.raw.demo===true, db=b.raw.demo===true;
    if(da!==db) return da?-1:1;
    const ga=(levelGraad(a.raw)||{}).graad||99, gb=(levelGraad(b.raw)||{}).graad||99;
    if(ga!==gb) return ga-gb;
    const ta=(((a.raw.content||{}).title)||"").toLowerCase();
    const tb=(((b.raw.content||{}).title)||"").toLowerCase();
    return ta.localeCompare(tb,"nl");
  });
  /* De voorbeeldzaak telt niet mee in de nummering. */
  let teller=0;
  alleLevels.forEach((e)=>{
    const n = e.raw && e.raw.levelNumber;
    if(e.raw && e.raw.demo===true){ e.nummer=0; return; }
    teller++;
    e.nummer = (typeof n === "number" && n > 0) ? Math.floor(n) : teller;
  });
  if(!alleLevels.length){
    lijst.innerHTML="";
    const p=document.createElement("p"); p.className="leeg-melding";
    p.textContent = gebroken
      ? "Er staan wel bestanden in de map Levels, maar geen daarvan is een geldig level."
      : "Nog geen zaken. Bouw een level, of zet een geëxporteerd bestand in de map Levels.";
    lijst.appendChild(p);
    $("#levelTeller").textContent="";
    $("#filterDrop").style.display="none";
    $("#sorteerRij").style.display="none";
    return;
  }
  tekenFilter();
  tekenLijst();
}

/* sorteren: Nr of A–Z */
$("#sorteerRij").addEventListener("click",e=>{
  const b=e.target.closest("button[data-s]");
  if(!b) return;
  sorteer=b.dataset.s;
  [...$("#sorteerRij").children].forEach(x=>x.classList.toggle("aan", x===b));
  tekenLijst();
});

/* ============================================================
   Zelf maken: upload + builder achter de knop in de balk.
   ============================================================ */
function toonUploadFout(msg){
  const el=$("#uploadFout");
  el.textContent=msg; el.hidden=false;
}
function verwerkBestand(file){
  $("#uploadFout").hidden=true;
  if(!file) return;
  if(!/\.json$/i.test(file.name) && file.type!=="application/json"){
    toonUploadFout("Dit is geen JSON-bestand."); return;
  }
  if(file.size > UPLOAD_MAX_BYTES){
    toonUploadFout("Dit bestand is te groot (meer dan 512 kB) — dat kan geen geldig level zijn.");
    return;
  }
  const lezer=new FileReader();
  lezer.onload=()=>{
    let raw;
    try{ raw=JSON.parse(lezer.result); }
    catch(e){ toonUploadFout("Kon het bestand niet lezen: geen geldige JSON."); return; }
    const fout=validateLevel(raw);
    if(fout){ toonUploadFout("Ongeldig level: "+fout); return; }
    try{ localStorage.setItem(UPLOAD_HANDOFF_KEY, JSON.stringify(raw)); }
    catch(e){ toonUploadFout("Kon het level niet klaarzetten in de browser."); return; }
    location.href = PLAYER_URL + "?upload=1";
  };
  lezer.onerror=()=>toonUploadFout("Bestand kon niet gelezen worden.");
  lezer.readAsText(file);
}
function initZelf(){
  const zone=$("#uploadZone"), input=$("#uploadInput");
  $("#btnZelf").addEventListener("click",()=>{ $("#uploadFout").hidden=true; openModal("#modalZelf"); });
  input.addEventListener("change",()=>{
    const f=input.files && input.files[0];
    verwerkBestand(f);
    input.value="";
  });
  ["dragenter","dragover"].forEach(ev=>zone.addEventListener(ev,e=>{
    e.preventDefault(); zone.classList.add("slepen");
  }));
  ["dragleave","dragend","drop"].forEach(ev=>zone.addEventListener(ev,e=>{
    e.preventDefault(); zone.classList.remove("slepen");
  }));
  zone.addEventListener("drop",e=>{
    const f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) verwerkBestand(f);
  });
}

/* De proefstand staat in dezelfde opslag als waar de player hem uitleest;
   beide apps draaien op dezelfde herkomst, dus dit is één schakelaar. */
(function(){
  const SLEUTEL="clueboard:experimenteel";
  const knop=$("#btnProef"); if(!knop) return;
  const zet=aan=>{
    knop.setAttribute("aria-pressed",aan?"true":"false");
    try{ localStorage.setItem(SLEUTEL,aan?"1":"0"); }catch(e){}
  };
  let aan=false; try{ aan=localStorage.getItem(SLEUTEL)==="1"; }catch(e){}
  zet(aan);
  knop.addEventListener("click",()=>zet(knop.getAttribute("aria-pressed")!=="true"));
})();

initZelf();
laadLevels();
/* Wie het spel voor het eerst opent, krijgt de uitleg vanzelf; daarna nooit
   meer ongevraagd. */
(function(){
  const SLEUTEL="clueboard:uitlegGezien";
  let gezien=false; try{ gezien=!!localStorage.getItem(SLEUTEL); }catch(e){}
  if(gezien) return;
  try{ localStorage.setItem(SLEUTEL,"1"); }catch(e){}
  zetUitlegSet("spelen"); openModal("#modalUitleg");
})();
</script>
