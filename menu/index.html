/* ============================================================
   Zaken: dezelfde controle, ontdekking en versielogica als de player.
   ============================================================ */
function validateLevel(raw){
  if(!raw || typeof raw!=="object") return "Geen geldig JSON-object.";
  if(raw.format && raw.format!=="clueboard-level") return "Onbekend format: "+raw.format+".";
  const p=raw.puzzle;
  if(!p) return "Veld 'puzzle' ontbreekt.";
  if(!p.grid || !p.grid.columns || !p.grid.rows) return "Veld 'puzzle.grid' is onvolledig.";
  if(!Array.isArray(p.tiles) || !p.tiles.length) return "Veld 'puzzle.tiles' ontbreekt of is leeg.";
  if(!p.people || !Array.isArray(p.people.placements) || !p.people.placements.length)
    return "Veld 'puzzle.people.placements' ontbreekt.";
  if(!raw.solution || !Array.isArray(raw.solution.placements) || !raw.solution.placements.length)
    return "Veld 'solution.placements' ontbreekt — dit level is niet compleet.";
  return null;
}
const GRAAD_WOORD={1:"Instap",2:"Licht",3:"Gemiddeld",4:"Pittig",5:"Zwaar"};
function levelGraad(raw){
  const d=raw&&raw.difficulty;
  return (d && d.graad>=1 && d.graad<=5) ? d : null;
}
async function discoverLevelFiles(){
  const names=new Set();
  const add=n=>{
    const f=String(n||"").split("?")[0].split("#")[0].replace(/^.*[\\\/]/,"");
    if(f && /\.json$/i.test(f) && f.toLowerCase()!=="index.json") names.add(f);
  };
  try{
    const r=await fetch(LEVELS_DIR+"index.json",{cache:"no-store"});
    if(r.ok){
      const j=await r.json();
      (Array.isArray(j)?j:((j&&j.levels)||[])).forEach(e=>add(typeof e==="string"?e:(e&&e.file)));
    }
  }catch(e){}
  /* De index is de gewone weg. Alleen als die niets oplevert kijken we of de
     server toevallig een mapoverzicht geeft. Op GitHub Pages bestaat dat niet,
     dus die poging kostte alleen een wachttijd voordat het eerste level werd
     opgehaald. */
  if(!names.size){
    try{
      const r=await fetch(LEVELS_DIR,{cache:"no-store"});
      if(r.ok && /html/i.test(r.headers.get("content-type")||"")){
        const html=await r.text();
        const re=/href\s*=\s*["']([^"']+)["']/gi;
        let m; while((m=re.exec(html))) add(decodeURIComponent(m[1]));
      }
    }catch(e){}
  }
  return Array.from(names).sort((a,b)=>a.localeCompare(b,"nl"));
}
/* Van elk level (herkenbaar aan zijn verborgen levelId) alleen de nieuwste
   versie tonen; oudere exportbestanden blijven gewoon in de map staan. */
function nieuwsteVersies(items){
  const groepen=new Map();
  items.forEach(e=>{
    const id=(e.raw&&typeof e.raw.levelId==="string"&&e.raw.levelId)?e.raw.levelId:null;
    const sleutel=id?("id:"+id):("naam:"+e.source);
    const versie=(e.raw&&typeof e.raw.levelVersion==="number")?e.raw.levelVersion:0;
    const huidig=groepen.get(sleutel);
    if(!huidig||versie>huidig.versie) groepen.set(sleutel,{entry:e,versie});
  });
  return Array.from(groepen.values()).map(x=>x.entry);
}

let alleLevels=[];       /* gesorteerd; index+1 = vast zaaknummer */
/* De campagnes uit de assetbank, via overzicht.json. Een campagne is een reeks
   zaken in één stijl, met een eigen nummering. */
let CAMPAGNES=[];
let actieveFilter=0;
let alleenOpen=false;   /* alleen zaken die je nog niet hebt afgerond */
let alleenBezig=false;  /* alleen zaken waar je middenin zit */

/* Hoe je de lijst had staan blijft op dit apparaat bewaard. Wie op niveau 3
   filtert, een zaak speelt en terugkomt, wil niet weer door alles heen: het
   menu is een kast waarin je zelf iets hebt opgeruimd, en dat hoort te blijven
   staan tot je het zelf omzet. */
const FILTER_SLEUTEL="clueboard:menuFilters";
function bewaarFilters(){
  try{ localStorage.setItem(FILTER_SLEUTEL, JSON.stringify(
    { niveau:actieveFilter, open:alleenOpen, bezig:alleenBezig })); }
  catch(e){}
}
function leesFilters(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(FILTER_SLEUTEL)||"null"); }catch(e){}
  if(!d || typeof d!=="object") return;
  /* Alleen waarden die nu nog bestaan; wat er niet meer is valt terug op de
     beginstand in plaats van een lege lijst op te leveren. */
  const n=+d.niveau;
  actieveFilter = (n>=1 && n<=5) ? n : 0;
  alleenOpen = !!d.open;
  alleenBezig = !!d.bezig;
}

/* Wat je van een zaak hebt afgerond staat in de browser van deze telefoon,
   onder dezelfde sleutel die de player schrijft. Alleen een uitgespeelde
   zaak komt erin, met de snelste tijd. */
const VOLTOOID_KEY="cb_voltooid";
function levelSleutel(raw){
  if(raw && typeof raw.levelId==="string" && raw.levelId) return raw.levelId;
  return (raw && raw.content && raw.content.title) || "level";
}
/* Waar je middenin zit. De speler schrijft hier het bord, de notities en de
   stand van de klok weg zodra je je eerste zet doet, en haalt het weer weg
   zodra je de zaak afrondt. Het menu leest alleen; hier wordt nooit
   geschreven. */
const BEZIG_KEY="cb_bezig";
function bezigVan(raw){
  try{
    const alles=JSON.parse(localStorage.getItem(BEZIG_KEY)||"{}");
    const b=alles[levelSleutel(raw)];
    return (b && b.stand) ? b : null;
  }catch(e){ return null; }
}
function voltooidVan(raw){
  try{
    const alles=JSON.parse(localStorage.getItem(VOLTOOID_KEY)||"{}");
    return alles[levelSleutel(raw)]||null;
  }catch(e){ return null; }
}
function tijdTekst(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
function levelHref(source){
  return PLAYER_URL+"?level="+encodeURIComponent(source.replace(/\.json$/i,""));
}
function maakLevelRij(entry){
  const raw=entry.raw, c=raw.content||{};
  const demo=raw.demo===true;
  const a=document.createElement("a");
  a.className="level-rij"+(demo?" demo":"");
  a.href=levelHref(entry.source);

  const nr=document.createElement("span"); nr.className="zaak-nr";
  if(demo){
    /* De voorbeeldzaak heeft geen nummer: een speelteken op de plek ervan. */
    nr.classList.add("demo-teken"); nr.title="Voorbeeldzaak";
    /* Een opengeslagen boek: dit is de zaak waarin je het spel leert. */
    nr.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      +'<path d="M12 6.6c-2.3-1.6-5-1.9-8.2-.9v12.6c3.2-1 5.9-.7 8.2.9 2.3-1.6 5-1.9 8.2-.9V5.7c-3.2-1-5.9-.7-8.2.9z"/>'
      +'<path d="M12 6.6v12.6"/></svg>';
  } else {
    /* Twee cijfers voor de gewone gevallen; een groter nummer krijgt gewoon
       de ruimte die het nodig heeft. */
    nr.textContent=String(entry.nummer).padStart(2,"0");
  }
  a.appendChild(nr);

  const midden=document.createElement("div"); midden.className="midden";
  const h=document.createElement("h3"); h.textContent=c.title||"Naamloos niveau";
  midden.appendChild(h);
  const onder=document.createElement("div"); onder.className="onder";
  const g=levelGraad(raw);
  const vt=voltooidVan(raw);
  const bz=vt?null:bezigVan(raw);
  if(bz){
    /* Mee bezig: de kaart kleurt helemaal op, want dit is waar je verder wilt.
       Het zaaknummer blijft staan -- anders raak je kwijt welke zaak het is --
       en op de plek van de zwaarte komt een zandloper met de tijd die er al op
       staat. Hoe zwaar hij was doet er even niet toe; dat je erin zit wel. */
    a.classList.add("bezig");
    const mb=document.createElement("span"); mb.className="mee-bezig";
    mb.title="Je bent hiermee bezig — "+tijdTekst(bz.tijd)+" gespeeld";
    mb.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      +'<path d="M7 3h10M7 21h10M8 3v3.2a4 4 0 0 0 1.4 3L12 12l-2.6 2.8A4 4 0 0 0 8 17.8V21M16 3v3.2a4 4 0 0 1-1.4 3L12 12l2.6 2.8a4 4 0 0 1 1.4 3V21"/></svg>'
      +'<b>Mee bezig</b><span>'+tijdTekst(bz.tijd)+'</span>';
    onder.appendChild(mb);
  } else if(vt){
    /* Afgerond: het woord en je snelste tijd op de plek van de zwaarte. Hoe
       zwaar hij was doet er niet meer toe; dat je hem hebt opgelost wel. */
    a.classList.add("voltooid");
    const af=document.createElement("span"); af.className="afgerond";
    af.title="Afgerond in "+tijdTekst(vt.tijd);
    af.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.6 4.5L19 7.5"/></svg>'
      +'<b>Afgerond</b><span>'+tijdTekst(vt.tijd)+'</span>';
    onder.appendChild(af);
    /* Het nummer maakt plaats voor een wit vinkje op een geel vak. */
    nr.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.6 4.5L19 7.5"/></svg>';
  } else if(g){
    const nv=document.createElement("span"); nv.className="niveau-rij"; nv.title=g.uitleg||("Niveau "+g.graad);
    nv.innerHTML=[1,2,3,4,5].map(n=>'<i class="'+(n<=g.graad?"aan":"")+'"></i>').join("");
    onder.appendChild(nv);
    /* Na de bolletjes in woorden hoe zwaar de zaak is. */
    const tag=document.createElement("span"); tag.className="demo-tag";
    tag.textContent=GRAAD_WOORD[g.graad]||("Niveau "+g.graad);
    onder.appendChild(tag);
  }
  if(onder.children.length) midden.appendChild(onder);
  /* Geen introtekst op de kaart: elke zaak toont hier alleen zijn titel,
     zodat de lijst één ritme houdt. Het verhaal begint in de player. */
  a.appendChild(midden);

  /* De stijl staat niet op elke zaak: die hoort bij de campagne en staat
     daar, op de kaart en in de kop van de campagnepagina. */

  /* Geen bordformaat en geen pijl: dat is informatie voor de bouwer, niet
     voor wie een zaak kiest. De kaart is een klikvlak, dat zie je aan de
     schaduw. */
  return a;
}
/* Het niveaufilter zit achter één sterknopje; de lijst eronder toont
   alleen de niveaus die er echt zijn. */
function tekenFilter(){
  const menu=$("#filterMenu"), knop=$("#filterKnop"), label=$("#filterLabel");
  const aanwezig=[1,2,3,4,5].filter(n=>
    zakenInBeeld().some(e=>{ const g=levelGraad(e.raw); return g && g.graad===n; }));
  const ietsAfgerond=zakenInBeeld().some(e=>voltooidVan(e.raw));
  /* De keuzelijst verdwijnt alleen als er niets te kiezen valt: één niveau
     én nog niets afgerond. */
  $("#filterDrop").style.display=aanwezig.length<=1?"none":"";
  menu.innerHTML="";
  /* Open zaken is een eigen knop naast het niveaufilter, en alleen zichtbaar
     zodra er iets is afgerond. */
  const ok=$("#openKnop");
  /* Altijd zichtbaar: als je hem pas krijgt zodra er iets is afgerond, mis je
     hem juist op het moment dat je hem zoekt. */
  if(ok){ ok.hidden=false; ok.classList.toggle("aan",alleenOpen); ok.setAttribute("aria-pressed",alleenOpen?"true":"false"); }
  $("#alleKnop").classList.toggle("aan",!alleenOpen && !alleenBezig);
  /* Mee bezig verschijnt pas als er iets te hervatten valt; anders zou de knop
     altijd een lege lijst opleveren. Staat hij aan terwijl de laatste zaak net
     is afgerond, dan gaat hij vanzelf weer uit. */
  { const bk=$("#bezigKnop");
    const ietsBezig=zakenInBeeld().some(e=>!voltooidVan(e.raw) && bezigVan(e.raw));
    if(bk){
      if(!ietsBezig && alleenBezig){ alleenBezig=false; bewaarFilters(); }
      bk.hidden=!ietsBezig;
      bk.classList.toggle("aan",alleenBezig);
      bk.setAttribute("aria-pressed",alleenBezig?"true":"false");
    } }
  [{n:0,l:"Alle niveaus"}].concat(aanwezig.map(n=>({n,l:GRAAD_WOORD[n]||("Niveau "+n)}))).forEach(c=>{
    const b=document.createElement("button");
    b.type="button"; b.className=(actieveFilter===c.n?"aan":"");
    const vink=document.createElement("span"); vink.className="vink";
    vink.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    const tekst=document.createElement("span"); tekst.textContent=c.l;
    b.appendChild(vink); b.appendChild(tekst);
    if(c.n){
      const st=document.createElement("span"); st.className="stipjes";
      st.innerHTML=[1,2,3,4,5].map(x=>'<i class="'+(x<=c.n?"aan":"")+'"></i>').join("");
      b.appendChild(st);
    }
    b.onclick=()=>{
      actieveFilter=c.n;
      bewaarFilters();
      $("#filterDrop").classList.remove("open");
      knop.setAttribute("aria-expanded","false");
      tekenFilter(); tekenLijst();
    };
    menu.appendChild(b);
  });
  knop.classList.toggle("aan", !!actieveFilter);
  label.textContent = actieveFilter ? (GRAAD_WOORD[actieveFilter]||("Niveau "+actieveFilter)) : "Niveau";
}

/* ── Campagnes ────────────────────────────────────────────
   Het menu heeft twee pagina's: de campagnes, en daarachter de zaken van één
   campagne. Welke je open hebt staat in het adres (#c=<id>), zodat de
   terugknop van de browser gewoon terug naar de campagnes gaat. Kom je vanuit
   de speler terug in het menu, dan sta je weer in de campagne waar je was
   (sessionStorage, dus alleen binnen dit tabblad). */
let huidigeCampagne=null;          /* null = de campagnes, "" = zonder campagne */
let campagneVanOverzicht=false;    /* kwamen we via een kaart binnen? */
const CAMPAGNE_SESSIE="clueboard:menuCampagne";
/* De zaken per campagne, in de volgorde van de bank. Een campagne die de bank
   niet kent komt erachter onder zijn eigen sleutel, zaken zonder campagne als
   laatste -- zo valt er nooit een zaak uit de lijst. */
function campagneGroepen(zaken){
  const groepen=new Map();
  CAMPAGNES.forEach(c=>groepen.set(c.id,{campagne:c,zaken:[]}));
  zaken.forEach(e=>{
    const id=(e.raw && typeof e.raw.campaign==="string" && e.raw.campaign) || "";
    if(!groepen.has(id)) groepen.set(id,{campagne:id?{id,name:id}:{id:"",name:"Zonder campagne"},zaken:[]});
    groepen.get(id).zaken.push(e);
  });
  return Array.from(groepen.values()).filter(g=>g.zaken.length)
    .sort((a,b)=>(a.campagne.id===""?1:0)-(b.campagne.id===""?1:0));
}
function campagneInfo(id){
  return campagneGroepen(alleLevels.filter(e=>e.raw.demo!==true)).find(g=>g.campagne.id===id)||null;
}
/* Wat er op de huidige pagina meetelt voor filters en tellers. */
function zakenInBeeld(){
  if(huidigeCampagne===null) return alleLevels;
  return alleLevels.filter(e=>e.raw.demo!==true && (e.raw.campaign||"")===huidigeCampagne);
}
/* Op een kaart staat een campagnenaam altijd op twee regels. Met een dubbele
   punt breekt hij daar; anders op de spatie die de twee helften het gelijkst
   maakt ("ClueBoard" / "Originals", "De" / "Kronieken"). Eén woord blijft
   één regel, met een lege tweede regel eronder. Op de campagnepagina zelf
   staat de naam gewoon als één kop (zetCampagneNaam met heel=true). */
function campagneRegels(naam){
  naam=String(naam||"").trim();
  const dp=naam.indexOf(":");
  if(dp>0 && dp<naam.length-1) return [naam.slice(0,dp+1).trim(), naam.slice(dp+1).trim()];
  const spaties=[]; for(let i=0;i<naam.length;i++) if(naam[i]===" ") spaties.push(i);
  if(!spaties.length) return [naam,""];
  const i=spaties.reduce((best,x)=>Math.abs(x-naam.length/2)<Math.abs(best-naam.length/2)?x:best);
  return [naam.slice(0,i), naam.slice(i+1)];
}
function campagneBeeld(c){ return c && c.hero ? "../assets/"+c.hero : ""; }
function zetCampagneNaam(el,c,heel){
  el.textContent="";
  el.title=c.name||c.id;
  if(heel){ el.textContent=c.name||c.id; return; }
  campagneRegels(c.name||c.id).forEach(r=>{
    const sp=document.createElement("span"); sp.textContent=r||" "; el.appendChild(sp);
  });
}
const SCHILD_ICOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l7 2.6v5.4c0 4.5-2.9 7.3-7 9-4.1-1.7-7-4.5-7-9V5.8z"/></svg>';
/* Het etiket met de stijl; leeg als de campagne geen bekende stijl heeft. */
function stijlTag(c){
  const naam=THEMA_LABELS[c.style]; if(!naam) return null;
  const t=document.createElement("span"); t.className="stijl-tag"; t.title="Stijl: "+naam;
  t.innerHTML=SCHILD_ICOON; t.appendChild(document.createTextNode(naam));
  return t;
}
function standHtml(af,tot){
  return '<b>'+af+'/'+tot+'</b> afgerond<i class="ck-balk"><i style="width:'
    +(tot?Math.round(af/tot*100):0)+'%"></i></i>';
}
function maakCampagneKaart(g){
  const c=g.campagne, zaken=g.zaken.slice().sort((a,b)=>a.nummer-b.nummer);
  const af=zaken.filter(e=>voltooidVan(e.raw)).length;
  const bezig=zaken.filter(e=>!voltooidVan(e.raw) && bezigVan(e.raw)).length;
  const a=document.createElement("a"); a.className="campagne-kaart";
  a.href="#c="+encodeURIComponent(c.id||"_");
  /* Het beeld draagt de naam en het etiket, net als de kop van de
     campagnepagina; eronder alleen de reeks en de stand. */
  const beeld=document.createElement("span"); beeld.className="ck-beeld";
  const u=campagneBeeld(c); if(u) beeld.style.backgroundImage="url('"+u+"')";
  const h=document.createElement("h3"); h.className="ck-naam";
  zetCampagneNaam(h,c,true);
  beeld.appendChild(h);
  const tag=stijlTag(c); if(tag) beeld.appendChild(tag);
  a.appendChild(beeld);
  /* De reeks zelf: één vakje per zaak, gevuld als hij af is. */
  const rij=document.createElement("div"); rij.className="ck-nummers"+(zaken.length>10?" dicht":"");
  zaken.forEach(e=>{
    const i=document.createElement("i");
    const klaar=!!voltooidVan(e.raw), mee=!klaar && !!bezigVan(e.raw);
    if(klaar) i.className="af"; else if(mee) i.className="bezig";
    i.textContent=String(e.nummer).padStart(2,"0");
    i.title=((e.raw.content||{}).title||"")+(klaar?" — afgerond":mee?" — mee bezig":"");
    rij.appendChild(i);
  });
  a.appendChild(rij);
  const voet=document.createElement("div"); voet.className="ck-voet";
  const n=document.createElement("span"); n.className="ck-aantal";
  n.textContent=zaken.length+(zaken.length===1?" zaak":" zaken");
  if(bezig){ const b=document.createElement("span"); b.className="ck-bezig"; b.textContent="· "+bezig+" mee bezig"; n.appendChild(b); }
  voet.appendChild(n);
  const stand=document.createElement("span"); stand.className="ck-stand"; stand.innerHTML=standHtml(af,zaken.length);
  voet.appendChild(stand);
  a.appendChild(voet);
  return a;
}
/* Elk kind een eigen vertraging, zodat de lijst na elkaar opkomt. */
function trapsgewijs(lijst){
  [...lijst.children].forEach((el,i)=>el.style.setProperty("--i",Math.min(i,14)));
}
function tekenCampagnes(){
  const lijst=$("#levelList");
  lijst.classList.add("campagnes");
  lijst.innerHTML="";
  campagneGroepen(alleLevels.filter(e=>e.raw.demo!==true)).forEach(g=>lijst.appendChild(maakCampagneKaart(g)));
  trapsgewijs(lijst);
  $("#levelTeller").textContent="";
}
function tekenCampagneBalk(){
  const g=campagneInfo(huidigeCampagne); if(!g) return;
  const c=g.campagne;
  { const plek=$("#cbStijl"); plek.innerHTML=""; const tag=stijlTag(c); if(tag) plek.appendChild(tag); }
  zetCampagneNaam($("#cbNaam"),c,true);
  { const b=$("#cbBeeld"); const u=campagneBeeld(c);
    if(u){ b.style.backgroundImage="url('"+u+"')"; } else b.style.backgroundImage=""; }
  $("#cbStand").innerHTML=standHtml(g.zaken.filter(e=>voltooidVan(e.raw)).length, g.zaken.length);
  document.title=(c.short||c.name||"Zaken")+" · ClueBoard";
}
function tekenMenu(){
  const op=huidigeCampagne!==null;
  document.body.classList.toggle("op-campagne",op);
  if(op){ tekenCampagneBalk(); tekenFilter(); tekenLijst(); }
  else { document.title="ClueBoard"; tekenCampagnes(); }
}
/* Het adres lezen en de juiste pagina tonen. */
function leesAdres(eerste){
  const m=/^#c=(.*)$/.exec(location.hash||"");
  let id=m?decodeURIComponent(m[1]):null;
  if(id==="_") id="";
  if(id!==null && !campagneInfo(id)) id=null;
  const vorige=huidigeCampagne;
  if(eerste && vorige===null && id!==null) campagneVanOverzicht=false;
  else if(vorige===null && id!==null) campagneVanOverzicht=true;
  huidigeCampagne=id;
  try{
    if(id===null) sessionStorage.removeItem(CAMPAGNE_SESSIE);
    else sessionStorage.setItem(CAMPAGNE_SESSIE,id||"_");
  }catch(e){}
  const lijst=$("#levelList");
  if(!eerste && vorige!==id){
    lijst.scrollTop=0;
    lijst.classList.remove("pagina-in","pagina-terug");
    void lijst.offsetWidth;
    lijst.classList.add(id===null?"pagina-terug":"pagina-in");
  }
  tekenMenu();
}
window.addEventListener("hashchange",()=>{ if(alleLevels.length) leesAdres(false); });
$("#btnCampagnes").addEventListener("click",()=>{
  /* Binnengekomen via een kaart: gewoon een stap terug, dan klopt de
     geschiedenis. Anders (vanuit de speler, of een link) het adres leegmaken. */
  if(campagneVanOverzicht){ history.back(); return; }
  history.replaceState(null,"",location.pathname+location.search);
  leesAdres(false);
});
function tekenLijst(){
  const lijst=$("#levelList");
  lijst.classList.remove("campagnes");
  /* Waar je middenin zit hoort altijd binnen handbereik: die zaak overleeft
     elk filter en staat bovenaan, ook als je op niveau of op titel kijkt. */
  const bezigNu=e=>!voltooidVan(e.raw) && !!bezigVan(e.raw);
  const inLijst=zakenInBeeld();
  const zichtbaar=inLijst.filter(e=>{
    if(bezigNu(e)) return true;
    if(alleenOpen && voltooidVan(e.raw)) return false;
    if(alleenBezig) return false;
    if(!actieveFilter) return true;
    const g=levelGraad(e.raw);
    return g && g.graad===actieveFilter;
  });
  /* Op zaaknummer; waar je middenin zit eerst. */
  zichtbaar.sort((a,b)=>{
    const ba=bezigNu(a), bb=bezigNu(b);
    if(ba!==bb) return ba?-1:1;
    return a.nummer-b.nummer;
  });
  lijst.innerHTML="";
  if(!zichtbaar.length){
    const p=document.createElement("p"); p.className="leeg-melding";
    p.textContent="Geen zaken bij dit filter.";
    lijst.appendChild(p);
  } else {
    zichtbaar.forEach(e=>lijst.appendChild(maakLevelRij(e)));
  }
  const n=zichtbaar.length, tot=inLijst.length;
  /* Alleen als je filtert telt deze regel mee. */
  $("#levelTeller").textContent = (!tot || n===tot) ? "" : n+" van "+tot+" zaken";
  trapsgewijs(lijst);
}
/* Het overzicht: van elke zaak alleen wat er op de kaart komt te staan --
   titel, zwaarte, bordmaat, nummer. Eén klein bestand voor alle zaken samen,
   in plaats van elk levelbestand helemaal ophalen om er vier regels uit te
   lezen. Het volledige level laadt pas als je erop klikt, in de speler.
   Bijwerken met: python assets/tools/build_levels.py */
async function laadOverzicht(){
  try{
    const r=await fetch(LEVELS_DIR+"overzicht.json",{cache:"no-store"});
    if(!r.ok) return null;
    const j=await r.json();
    const rij=Array.isArray(j)?j:((j&&j.levels)||[]);
    if(j && Array.isArray(j.campagnes)) CAMPAGNES=j.campagnes.filter(c=>c && c.id);
    const uit=new Map();
    rij.forEach(e=>{
      const naam=e&&e.file;
      if(naam && e.content && e.puzzle && e.puzzle.grid) uit.set(naam,e);
    });
    return uit.size?uit:null;
  }catch(e){ return null; }
}
async function laadLevels(){
  const lijst=$("#levelList");
  let files=[], gebroken=0, geladen=[];
  const [lijstUitIndex,overzicht]=await Promise.all([
    discoverLevelFiles().catch(()=>[]),
    laadOverzicht()
  ]);
  files=lijstUitIndex;
  /* Staat een zaak nog niet in het overzicht -- net toegevoegd, script nog
     niet gedraaid -- dan wordt alleen díe zaak in zijn geheel opgehaald. Zo
     komt een nieuw level altijd in beeld, ook zonder het script. */
  const missend=overzicht?files.filter(n=>!overzicht.has(n)):files;
  if(overzicht) files.forEach(n=>{ const e=overzicht.get(n); if(e) geladen.push({raw:e, source:n}); });
  /* De rest tegelijk ophalen in plaats van een voor een: de browser doet
     meerdere aanvragen naast elkaar, dus dit duurt zo lang als de traagste
     in plaats van alle wachttijden bij elkaar opgeteld. */
  await Promise.all(missend.map(async naam=>{
    try{
      const r=await fetch(LEVELS_DIR+naam,{cache:"no-store"});
      if(!r.ok) return;
      const raw=await r.json();
      if(validateLevel(raw)){ gebroken++; return; }
      geladen.push({raw, source:naam});
    }catch(e){ gebroken++; }
  }));
  /* Volgorde: de voorbeeldzaak altijd eerst, daarna op niveau en titel.
     Het NUMMER komt uit het level zelf (levelNumber uit de bouwer) en hoort
     dus bij de zaak, niet bij zijn plek in de lijst — zet er een level bij en
     de rest houdt zijn dossiernummer. Levels van vóór dat veld vallen terug
     op hun plek in de lijst. */
  alleLevels=nieuwsteVersies(geladen).sort((a,b)=>{
    const da=a.raw.demo===true, db=b.raw.demo===true;
    if(da!==db) return da?-1:1;
    const ga=(levelGraad(a.raw)||{}).graad||99, gb=(levelGraad(b.raw)||{}).graad||99;
    if(ga!==gb) return ga-gb;
    const ta=(((a.raw.content||{}).title)||"").toLowerCase();
    const tb=(((b.raw.content||{}).title)||"").toLowerCase();
    return ta.localeCompare(tb,"nl");
  });
  /* De voorbeeldzaak telt niet mee in de nummering. Een nummer telt binnen
     zijn campagne: elke campagne begint bij 1. */
  const teller={};
  alleLevels.forEach((e)=>{
    const n = e.raw && e.raw.levelNumber;
    if(e.raw && e.raw.demo===true){ e.nummer=0; return; }
    const c=e.raw.campaign||"";
    teller[c]=(teller[c]||0)+1;
    e.nummer = (typeof n === "number" && n > 0) ? Math.floor(n) : teller[c];
  });
  if(!alleLevels.length){
    lijst.innerHTML="";
    const p=document.createElement("p"); p.className="leeg-melding";
    p.textContent = gebroken
      ? "Er staan wel bestanden in de map Levels, maar geen daarvan is een geldig level."
      : "Nog geen zaken. Bouw een level, of zet een geëxporteerd bestand in de map Levels.";
    lijst.appendChild(p);
    $("#levelTeller").textContent="";
    $("#filterDrop").style.display="none";
    return;
  }
  /* Geen campagne in het adres, maar wel een in deze sessie (terug uit de
     speler)? Dan daar verder. */
  if(!/^#c=/.test(location.hash||"")){
    try{
      const s=sessionStorage.getItem(CAMPAGNE_SESSIE);
      if(s) history.replaceState(null,"",location.pathname+location.search+"#c="+encodeURIComponent(s));
    }catch(e){}
  }
  leesAdres(true);
}


/* ============================================================
   Zelf maken: upload + builder achter de knop in de balk.
   ============================================================ */
function toonUploadFout(msg){
  const el=$("#uploadFout");
  el.textContent=msg; el.hidden=false;
}
function verwerkBestand(file){
  $("#uploadFout").hidden=true;
  if(!file) return;
  if(!/\.json$/i.test(file.name) && file.type!=="application/json"){
    toonUploadFout("Dit is geen JSON-bestand."); return;
  }
  if(file.size > UPLOAD_MAX_BYTES){
    toonUploadFout("Dit bestand is te groot (meer dan 512 kB) — dat kan geen geldig level zijn.");
    return;
  }
  const lezer=new FileReader();
  lezer.onload=()=>{
    let raw;
    try{ raw=JSON.parse(lezer.result); }
    catch(e){ toonUploadFout("Kon het bestand niet lezen: geen geldige JSON."); return; }
    const fout=validateLevel(raw);
    if(fout){ toonUploadFout("Ongeldig level: "+fout); return; }
    try{ localStorage.setItem(UPLOAD_HANDOFF_KEY, JSON.stringify(raw)); }
    catch(e){ toonUploadFout("Kon het level niet klaarzetten in de browser."); return; }
    location.href = PLAYER_URL + "?upload=1";
  };
  lezer.onerror=()=>toonUploadFout("Bestand kon niet gelezen worden.");
  lezer.readAsText(file);
}
function initZelf(){
  const zone=$("#uploadZone"), input=$("#uploadInput");
  $("#btnZelf").addEventListener("click",()=>{ $("#uploadFout").hidden=true; openModal("#modalZelf"); });
  input.addEventListener("change",()=>{
    const f=input.files && input.files[0];
    verwerkBestand(f);
    input.value="";
  });
  ["dragenter","dragover"].forEach(ev=>zone.addEventListener(ev,e=>{
    e.preventDefault(); zone.classList.add("slepen");
  }));
  ["dragleave","dragend","drop"].forEach(ev=>zone.addEventListener(ev,e=>{
    e.preventDefault(); zone.classList.remove("slepen");
  }));
  zone.addEventListener("drop",e=>{
    const f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) verwerkBestand(f);
  });
}

/* De proefstand staat in dezelfde opslag als waar de player hem uitleest;
   beide apps draaien op dezelfde herkomst, dus dit is één schakelaar. */
/* Vijf keer achter elkaar op het merk tikken zet hem om; een tik telt alleen
   mee als hij vlot op de vorige volgt, anders is het gewoon iemand die het
   logo aanraakt. */
(function(){
  const SLEUTEL="clueboard:experimenteel";
  const NODIG=5, PAUZE=800;
  const merk=$("#merkTik"); if(!merk) return;
  const zet=(aan,teken)=>{
    document.body.classList.toggle("proefstand",aan);
    try{ localStorage.setItem(SLEUTEL,aan?"1":"0"); }catch(e){}
    if(teken && alleLevels.length) tekenMenu();
  };
  let aan=false; try{ aan=localStorage.getItem(SLEUTEL)==="1"; }catch(e){}
  zet(aan);
  let tikken=0, laatst=0;
  merk.addEventListener("click",()=>{
    const nu=Date.now();
    tikken = (nu-laatst>PAUZE) ? 1 : tikken+1;
    laatst = nu;
    if(tikken>=NODIG){ tikken=0; aan=!aan; zet(aan,true); }
  });
})();

initZelf();
/* Eerst terughalen hoe de lijst stond, dan pas tekenen. */
leesFilters();
laadLevels();

   meer ongevraagd. */
(function(){
  const SLEUTEL="clueboard:uitlegGezien";
  let gezien=false; try{ gezien=!!localStorage.getItem(SLEUTEL); }catch(e){}
  if(gezien) return;
  try{ localStorage.setItem(SLEUTEL,"1"); }catch(e){}
  zetUitlegSet("spelen"); openModal("#modalUitleg");
})();
</script>
