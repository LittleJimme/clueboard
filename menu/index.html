<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#24191A" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Vast op "default": iOS leest deze stijl bij het starten van de webapp en
     past een wijziging pas bij de volgende navigatie toe. Zetten we hem
     onderweg om, dan loopt de opmaak een laadbeurt achter: de pagina liep
     nog onder de statusbalk door terwijl env(safe-area-inset-top) al nul
     teruggaf, en dan schuift alles -- ook een open venster -- omhoog onder
     de balk. Met "default" begint de pagina altijd onder de statusbalk en
     valt er niets te compenseren. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<script>
/* De stand nog vóór de eerste tekening, zodat er geen donkere flits komt.
   De statusbalk-stijl blijft met rust: zie de meta hierboven. */
try{
  /* Licht is de standaardstand; donker is een keuze die bewaard blijft. */
  if(localStorage.getItem("clueboard:menuThema")!=="donker"){
    document.getElementById("themeColorMeta").content="#F0EEE7";
    document.documentElement.dataset.thema="licht";
  }
}catch(e){}
</script>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
/* iOS opent een gewone <a href> in Safari zodra de site als webapp draait: je
   verliest het volledige scherm en krijgt de adresbalk terug. De scope in het
   manifest houdt menu, player en builder bij elkaar, maar oudere iOS-versies
   negeren scope. Vandaar dit vangnet: links binnen dezelfde site navigeren we
   zelf, in hetzelfde venster. Staat identiek in alle drie de apps (bewust
   gedupliceerd, dit project heeft geen bouwstap). */
(function(){
  var alsApp = (window.matchMedia && matchMedia("(display-mode: standalone)").matches)
               || navigator.standalone === true;
  if(!alsApp) return;
  /* In de vangfase: een handler die eerder aan de beurt is en de gebeurtenis
     tegenhoudt, zou ons anders overslaan en de link alsnog in Safari openen. */
  document.addEventListener("click", function(e){
    var a = e.target && e.target.closest && e.target.closest("a[href]");
    if(!a || a.target === "_blank" || a.hasAttribute("download")) return;
    var h = a.getAttribute("href") || "";
    if(!h || h.charAt(0) === "#") return;
    var u; try{ u = new URL(h, location.href); }catch(_){ return; }
    if(u.origin !== location.origin) return;
    e.preventDefault();
    e.stopPropagation();
    location.assign(u.href);
  }, true);
})();
</script>
<title>ClueBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* ============================================================
   ClueBoard — Menu. Elk level is een zaak: dossiernummers, een
   speurdersverhaal bovenaan, warm papier met een klein terracotta-
   accent. Zoeken en filteren bovenin; alles wat je zelf maakt zit
   achter één knop in de balk.
   ============================================================ */
:root{
  /* ── DONKER (standaard): wijnrood met goud ──
     Eén warme kleurfamilie: de grond is rood-bruin ontzadigd, kaarten en
     lijnen liggen daar dicht tegenaan, en het goud is de enige heldere
     kleur. Het rood van "vermoord" staat er als enige naast. ── */
  --grond:#231819;
  --grond-2:#1B1213;
  --kaart:#2E2122;
  --kaart-2:#291D1E;
  --lijn:#43302F;
  --lijn-zacht:#3A2A29;

  --inkt:#F0E8E2;
  --inkt-2:#CBBBB4;
  --dof:#96837E;

  /* Eén goud, twee rollen. In het donker mag dezelfde kleur beide doen:
     als tekst haalt hij 5.7:1 op de kaart, als vlak draagt hij donkere
     tekst op 6.3:1. */
  --accent:#C9932F;
  --accent-vlak:#C9932F;
  --accent-op:#231819;
  --accent-diep:#A97A22;
  --accent-zacht:rgba(201,147,47,.14);
  --accent-lijn:rgba(201,147,47,.42);

  --zaak-rood:#E0705A;
  --fout:#E58472;

  --sch1:0 1px 2px rgba(0,0,0,.22);
  --sch2:0 2px 6px rgba(0,0,0,.26),0 12px 30px rgba(0,0,0,.28);

  --font-ui:"Manrope","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  /* De inktrand van knoppen en kaders: inkt, iets verdund. */
  --inkt-rand:color-mix(in srgb,var(--inkt) 62%,var(--kaart));

  --korrel:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23g)' opacity='0.5'/></svg>");
}
/* ── LICHT: hetzelfde papier, maar omgekeerd. Het goud wordt hier oker:
   helder goud haalt op wit maar 2:1 contrast, deze diepte haalt 4.8:1 en
   blijft dus leesbaar. Dezelfde kleur als de lichte skin van de bouwer. */
html[data-thema="licht"]{
  --grond:#F1EFE8;
  --grond-2:#EAE7DE;
  --kaart:#FBFAF6;
  --kaart-2:#F4F2EA;
  --lijn:#E2DED1;
  --lijn-zacht:#EBE8DE;

  --inkt:#262419;
  --inkt-2:#4C493D;
  --dof:#71695A;

  /* Tekstgoud: 4.7:1 op de pagina. Iets geler en verzadigder dan het
     oude #8F6310, zodat het minder als bruin leest bij dezelfde diepte. */
  --accent:#916008;
  /* Vlakgoud: precies hetzelfde goud als in het donker, met donkere
     tekst erop (5.9:1). Zo voelt de lichte modus goud in plaats van
     brons, en delen beide thema's één herkenbare kleur. */
  --accent-vlak:#C9932F;
  --accent-op:#2A1F06;
  --accent-diep:#A87B18;
  --accent-zacht:rgba(145,96,8,.10);
  --accent-lijn:rgba(145,96,8,.32);

  --zaak-rood:#A3402F;
  --fout:#A3402F;

  --sch1:0 1px 2px rgba(48,44,32,.05);
  --sch2:0 2px 6px rgba(48,44,32,.06),0 10px 26px rgba(48,44,32,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
/* Het verloop staat op het canvas (html), niet op body, en zonder
   background-attachment:fixed. Als webapp op een iPhone meet iOS een vast
   verloop op de layout-viewport, die boven de thuisbalk ophoudt; daaronder
   scheen dan de effen html-kleur door, lichter dan het eind van het verloop:
   een lichte balk met een harde rand. Op het canvas dekt het verloop altijd
   het hele scherm, en wat daar nog buiten valt (thuisbalk, overscroll) krijgt
   de eindkleur, zodat er niets meer aansluit met een naad. */
html{touch-action:manipulation;overscroll-behavior:none;
  background:var(--grond-2) linear-gradient(180deg,var(--grond) 0%,var(--grond-2) 100%) no-repeat}
html,body{height:100%;overflow:hidden}
/* Kom je uit een spel terug in de telefoonbrowser, dan is de werkbalk van
   de browser op dat moment vaak nog ingeklapt: de pagina meet zich dan op
   het hoge scherm. Zodra de werkbalk terugkomt, schuift het zichtbare
   venster naar de onderkant van die te hoge pagina en staat de knoppenrij
   boven het scherm. Op de kleinste schermhoogte (svh) is de pagina nooit
   hoger dan wat je met werkbalk ziet, dus valt er niets te verschuiven. */
@supports (height:100svh){ html,body{height:100svh} }
body{
  color:var(--inkt);font-family:var(--font-ui);
  font-size:15px;line-height:1.55;font-weight:500;
  display:flex;flex-direction:column;
  background:none;overscroll-behavior:none;
}
/* een vleugje papierkorrel over alles */
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:var(--korrel);background-size:170px 170px;opacity:.045;
}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:0;margin:0}
p{margin:0}
a{color:inherit;touch-action:manipulation}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
main,.balk{position:relative;z-index:1}

/* ---------- vaste bovenbalk ---------- */
.balk{
  flex:0 0 auto;z-index:40;padding-top:env(safe-area-inset-top);
}
/* het merkteken volgt het thema */
.beeldmerk .vak-accent{fill:var(--accent-vlak)}
.beeldmerk .lijn{stroke:var(--inkt)}
.balk-in{
  max-width:640px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:11px;min-height:58px;
}
.balk-rechts{margin-left:auto;display:flex;gap:8px}
.balk-links{display:flex;gap:8px;align-items:center}
.plus-knop svg{width:17px;height:17px}
/* Knoppen als inkten pillen: papiervulling, een dikke inktrand en de
   sierletter -- geen glans, geen verloop, geen slagschaduw. De volle knop is
   in inkt gezet met papieren letters. */
.knop{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1.5px solid var(--inkt-rand);border-radius:999px;background:var(--kaart);
  padding:8px 16px;font:600 14px var(--font-display);color:var(--inkt);letter-spacing:.005em;
  box-shadow:none;text-decoration:none;white-space:nowrap;
  transition:border-color .15s,background .15s,transform .12s,color .15s;
}
.knop:hover{border-color:var(--inkt);background:var(--kaart-2)}
.knop:active{transform:translateY(1px)}
.knop svg{width:15px;height:15px}
.knop.vol{background:var(--inkt);border-color:var(--inkt);color:var(--grond)}
.knop.vol:hover{background:var(--inkt-2);border-color:var(--inkt-2)}
@media (max-width:430px){ .knop .lbl-weg{display:none} .knop{padding:9px 12px} }
/* De uitleg zit achter één vraagteken, gezet als het woord "vermoord":
   schuine schreefletter in dezelfde rode inkt. */
.vraag-knop{
  width:38px;height:38px;padding:0;border-radius:999px;
  border:1.5px solid var(--inkt-rand);background:var(--kaart);box-shadow:none;
  font-family:var(--font-display);font-style:italic;font-weight:600;font-size:21px;
  line-height:1;color:var(--inkt);
  display:inline-flex;align-items:center;justify-content:center;
  transition:border-color .15s,transform .12s,color .15s;
}
.vraag-knop:hover{border-color:var(--accent-lijn)}
.vraag-knop:active{transform:translateY(1px)}

main{
  flex:1;min-height:0;width:100%;max-width:640px;margin:0 auto;padding:0 20px;
  display:flex;flex-direction:column;
}

/* ---------- titelblok: het merk, de payoff en de zaakregel ----------
   De Engelse payoff hoort bij het merk en staat daarom vlak onder de
   woordmerk-regel, klein en gespatieerd: zo leest hij als onderdeel van de
   naam en niet als een zin. De Nederlandse regel eronder is de stem van
   het spel zelf en staat duidelijk apart, groter en in schuine inkt. */
.titelblok{flex:0 0 auto;text-align:left;padding:6px 0 22px;animation:opkomen .4s cubic-bezier(.2,.8,.3,1) both}
@media (max-width:640px){
  .titelblok{text-align:center;padding:2px 0 18px}
  .merk{flex-direction:column;justify-content:center;gap:8px}
}
/* Overgangen: wat op een pagina verschijnt komt kort op, de kaarten na
   elkaar; het campagnebeeld zoomt een haar uit terwijl het opkomt. */
@keyframes opkomen{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes beeldIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.level-list > *{animation:opkomen .42s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0) * 45ms)}
.filter-plak{animation:opkomen .4s cubic-bezier(.2,.8,.3,1) both}
.cb-hero{animation:beeldIn .55s ease both}
@media (prefers-reduced-motion:reduce){.level-list > *,.filter-plak,.titelblok,.cb-hero{animation:none}}
.beeldmerk{width:46px;height:46px;display:block;margin:0;object-fit:contain}
/* De oude .woordmerk-tekstregel staat verderop en zet zelf een display; deze
   selectors wegen zwaarder zodat er altijd precies één woordmerk staat. */
img.woordmerk{display:block;height:clamp(44px,12vw,56px);width:auto;max-width:62vw;margin:0;font-size:0;letter-spacing:0}
img.woordmerk.woordmerk-licht{display:none}
html[data-thema="licht"] img.woordmerk.woordmerk-licht{display:block}
html[data-thema="licht"] img.woordmerk.woordmerk-donker{display:none}
.woordmerk{
  font-family:var(--font-display);font-weight:600;font-size:30px;
  letter-spacing:-.02em;line-height:1;color:var(--inkt);
}
.woordmerk .w1{color:var(--accent)}
/* Het merk als tikvlak. Geen knopuiterlijk: wie er niets van weet mag er
   niets van merken. */
.merk{position:relative;-webkit-tap-highlight-color:transparent;user-select:none;display:flex;align-items:center;gap:12px}
.proef-merk{display:none;position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
  padding:2px 9px;border-radius:999px;background:var(--accent);color:#fff;
  font:700 10.5px var(--font-ui);letter-spacing:.02em;text-transform:none;
  box-shadow:0 2px 6px rgba(0,0,0,.28)}
body.proefstand .proef-merk{display:block}
/* haarlijntje dat het merkblok van de zaakregel scheidt */
.titelblok .scheiding{display:none;
  width:56px;height:1px;margin:11px auto 12px;
  background:linear-gradient(90deg,rgba(0,0,0,0),var(--accent),rgba(0,0,0,0));
  opacity:.7;
}
.titelblok h1{
  font-size:21px;font-weight:600;line-height:1.2;letter-spacing:-.01em;margin:12px 0 0;
}
.titelblok h1 em{
  font-style:italic;color:var(--zaak-rood);position:relative;white-space:nowrap;
  display:inline-block;transform:rotate(-2deg);transform-origin:50% 70%;
}
/* Geen gelijkmatige lijn maar een penstreek: een gevuld vlak dat dik begint
   en naar rechts uitloopt, met een lichte golf. Dat leest als inkt in
   plaats van als een onderstreping uit een tekstverwerker. */
.titelblok h1 em::after{
  content:"";position:absolute;left:-11px;right:-13px;bottom:-1px;height:9px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 10' preserveAspectRatio='none'><path d='M1.5 7.8 C 16 5.6, 40 4.2, 66 3.9 C 86 3.65, 104 4.0, 118.5 4.8 C 118.9 5.3, 118.7 5.9, 118 6.2 C 103 5.9, 86 5.9, 68 6.2 C 46 6.55, 24 7.5, 3.2 9.1 C 2.1 9.0, 1.4 8.5, 1.5 7.8 Z' fill='%23E0705A' opacity='.78'/></svg>") center/100% 100% no-repeat;
}
html[data-thema="licht"] .titelblok h1 em::after{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 10' preserveAspectRatio='none'><path d='M1.5 7.8 C 16 5.6, 40 4.2, 66 3.9 C 86 3.65, 104 4.0, 118.5 4.8 C 118.9 5.3, 118.7 5.9, 118 6.2 C 103 5.9, 86 5.9, 68 6.2 C 46 6.55, 24 7.5, 3.2 9.1 C 2.1 9.0, 1.4 8.5, 1.5 7.8 Z' fill='%23A3402F' opacity='.7'/></svg>");
}
@media (max-height:720px){
  .titelblok{padding:4px 0 14px}
  .titelblok h1{font-size:17px}
}

/* ---------- filterregel boven de lijst ---------- */
.filter-plak{
  position:relative;z-index:2;
  flex:0 0 auto;padding:6px 0 0;display:flex;align-items:flex-end;justify-content:flex-end;gap:22px;
  border-bottom:1px solid var(--lijn);
}
.filter-woord{
  display:inline-flex;align-items:center;gap:5px;padding:8px 0 10px;margin-bottom:-1px;
  border:0;border-bottom:2px solid transparent;background:none;border-radius:0;
  font:700 14px var(--font-ui);color:var(--dof);white-space:nowrap;
  transition:color .15s,border-color .15s;
}
.filter-woord:hover{color:var(--inkt)}
.filter-woord.aan{color:var(--inkt);border-bottom-color:var(--accent-vlak)}
.filter-woord[hidden]{display:none}
.filter-woord svg{width:13px;height:13px;transition:transform .16s}
.drop.open .filter-woord svg{transform:rotate(180deg)}
.lijst-teller{margin-right:auto;min-width:0;color:var(--dof);font:700 12px var(--font-ui);
  letter-spacing:.02em;text-transform:none;padding-bottom:10px;white-space:nowrap}
@media (max-width:640px){
  .filter-plak{gap:16px;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
  .filter-plak::-webkit-scrollbar{display:none}
  .lijst-teller{display:none}
  .drop-menu{right:auto;left:0;min-width:min(72vw,200px)}
}

/* niveaufilter: één sterknopje met een kleine uitklaplijst eronder */
.drop{position:relative;flex:0 0 auto}
.drop-menu{
  position:absolute;top:calc(100% + 7px);right:0;z-index:50;min-width:158px;
  background:var(--kaart);border:1.5px solid var(--inkt-rand);border-radius:12px;
  padding:5px;box-shadow:0 10px 28px rgba(42,33,24,.16);display:none;
}
/* Het 'meer'-menu: links uitgelijnd onder de knop, met een link erin die
   eruitziet als de knoppen. */
.meer-menu{left:auto;right:0;min-width:230px}
.meer-menu a{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  border-radius:9px;padding:8px 10px;font:700 12.5px var(--font-ui);color:var(--inkt-2);text-decoration:none}
.meer-menu a:hover{background:var(--kaart-2);color:var(--inkt)}
.filter-plak .drop-menu{left:0;right:auto}
.drop.open .drop-menu{display:block;animation:dropIn .16s ease both}
@keyframes dropIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.drop-menu button{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  border:none;background:none;border-radius:9px;padding:8px 10px;
  font:700 12.5px var(--font-ui);color:var(--inkt-2);
}
.drop-menu button:hover{background:var(--kaart-2);color:var(--inkt)}
.drop-menu button.aan{color:var(--inkt)}
.drop-streep{height:1px;background:var(--lijn);margin:5px 8px}
.drop-menu button .stipjes{display:flex;gap:3px;margin-left:auto}
.drop-menu button .stipjes i{width:5px;height:5px;border-radius:50%;background:var(--lijn);font-style:normal}
.drop-menu button .stipjes i.aan{background:var(--accent)}
.drop-menu button .vink{width:13px;flex:0 0 auto;color:var(--accent);opacity:0}
.drop-menu button.aan .vink{opacity:1}


/* ---------- zaken: genummerde dossierrijen ---------- */
.level-list{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:10px;
  /* Geen balk; de randen van het venster zijn een verloop, zodat een kaart
     onderaan opkomt en bovenaan oplost in plaats van afgesneden te worden. */
  scrollbar-width:none;
  /* Bovenaan een verloop, zodat kaarten oplossen voor ze de filterrij raken;
     onderaan een minimale uitloop van achttien pixels, net genoeg om de
     onderrand van het scherm niet als een harde streep te laten lezen. */
  padding:40px 0 calc(18px + env(safe-area-inset-bottom));
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 40px,#000 calc(100% - 18px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 40px,#000 calc(100% - 18px),transparent 100%);
}
.level-list::-webkit-scrollbar{display:none}
/* Breed scherm: de zaken in twee kolommen, de kop wat lager. */
/* Breed scherm: de zaken als tegels, van links naar rechts en dan een rij
   lager. Twee brede kolommen lazen als twee losse lijsten naast elkaar; met
   vier smallere tegels loopt de volgorde weer gewoon door. */
@media (min-width:1100px) and (min-height:600px){
  main{max-width:1120px}
  body.op-campagne .cb-hero{--rand:max(20px,calc(50vw - 540px));height:clamp(240px,36vh,380px)}
  /* Op een groot scherm mag de tekst van de zaken wat groter. */
  .level-rij h3{font-size:22px}
  .zaak-nr{width:46px;height:46px;font-size:17px}
  /* De balk hoort dezelfde breedte te houden als de lijst eronder, anders
     staan het vraagteken en de knoppen links ergens midden in het scherm in
     plaats van in lijn met de uiterste zaken. */
  .balk-in{max-width:1120px}
  .titelblok{padding-bottom:16px}
  .level-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px;align-content:start;
    /* Rijen op hun inhoud: met campagnekoppen past de lijst niet meer in het
       venster, en dan drukte het raster de kaarten (overflow:hidden, dus geen
       minimumhoogte) in elkaar in plaats van te scrollen. */
    grid-auto-rows:max-content}
  .level-rij{margin:0}
  /* De campagnes als grotere kaarten, twee of drie naast elkaar. */
  .level-list.campagnes{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
}
.level-rij{
  position:relative;overflow:hidden;
  /* Nooit krimpen: de lijst is een flexkolom en een kaart met overflow:hidden
     zou anders in elkaar gedrukt worden zodra de lijst voller is dan het
     scherm, in plaats van te scrollen. */
  flex:0 0 auto;
  display:flex;align-items:center;gap:13px;text-decoration:none;
  background:var(--kaart);border:1px solid var(--lijn);border-radius:14px;
  padding:15px 16px;box-shadow:0 5px 14px -6px rgba(42,33,24,.2),0 1px 2px rgba(42,33,24,.05);
  transition:transform .14s cubic-bezier(.2,.8,.3,1),box-shadow .18s,border-color .18s;
}
.level-rij:hover{border-color:var(--lijn);box-shadow:0 10px 22px -8px rgba(42,33,24,.28),0 1px 2px rgba(42,33,24,.05);transform:translateY(-2px)}
.level-rij:active{transform:none;box-shadow:var(--sch1)}
/* de voorbeeldzaak: lichter vlak, zodat hij er meteen uitspringt */
.level-rij.demo{
  background:color-mix(in srgb, var(--kaart) 76%, var(--inkt) 24%);
  border-color:var(--accent-lijn);
}
html[data-thema="licht"] .level-rij.demo{background:#FFFFFF}
.level-rij.demo h3{color:var(--inkt)}
.level-rij.demo .zaak-nr{background:var(--accent-vlak);border-color:var(--accent-diep);color:var(--accent-op)}
.zaak-nr.demo-teken svg{width:21px;height:21px;display:block}
.demo-tag{
  font:700 12.5px var(--font-ui);letter-spacing:.02em;text-transform:none;
  color:var(--dof);
}
/* De stand van een zaak is een klein teken op de kaart; de kaart zelf
   blijft papier, zodat de lijst één rustig ritme houdt. Afgerond: het nummer
   wordt een inktschijf met een vinkje, en de tijd staat erbij. Mee bezig:
   een zandloper met de tijd tot nu toe. */
.afgerond,.mee-bezig{display:inline-flex;align-items:center;gap:6px;color:var(--inkt-2)}
.afgerond svg,.mee-bezig svg{width:13px;height:13px;flex:0 0 auto}
.afgerond b,.mee-bezig b{font:700 12.5px var(--font-ui);letter-spacing:.02em;text-transform:none;color:var(--inkt)}
.afgerond span,.mee-bezig span{font:700 12.5px var(--font-ui);font-variant-numeric:tabular-nums;color:var(--dof)}
.level-rij.voltooid .zaak-nr{background:var(--inkt);border-color:var(--inkt);color:var(--grond)}
.level-rij.voltooid .zaak-nr svg{width:22px;height:22px;display:block}
.level-rij.voltooid h3{color:var(--inkt-2)}
/* Op een smal scherm is het vinkje met de tijd genoeg; het woord zou de
   titel te veel ruimte kosten. */
.zaak-nr{
  flex:0 0 auto;width:42px;height:42px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--inkt);
  background:var(--kaart-2);border:1px solid var(--lijn);
  font-variant-numeric:tabular-nums;
}
.level-rij .midden{flex:1;min-width:0}
.level-rij h3{font-size:20px;font-weight:700;color:var(--inkt);line-height:1.2;letter-spacing:-.01em;overflow-wrap:anywhere}
.level-rij .onder{margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.niveau-rij{display:flex;align-items:center;gap:3px}
.niveau-rij i{width:6px;height:6px;border-radius:50%;background:var(--lijn);font-style:normal}
.niveau-rij i.aan{background:var(--accent)}
/* ---------- campagnes: eerst de reeksen, daarachter de zaken ----------
   Het menu opent op de campagnes. Een campagne aantikken opent een pagina met
   alleen haar zaken, met de filters erbij; het titelblok maakt dan plaats voor
   een kop met een terugknop. */
body:not(.op-campagne) .filter-plak{display:none}
body.op-campagne .titelblok{display:none}
/* Op de campagnepagina is het beeld het scherm: geen balk erboven, het
   beeld loopt van rand tot rand en tot de bovenkant, en de knoppen die je
   hier niet nodig hebt (eigen level, regels, uitleg) zijn weg. Alleen de
   dag/nachtknop en de terugknop staan óp het beeld, linksboven. */
body.op-campagne .balk{display:none}
.campagne-balk{flex:0 0 auto;display:none;padding:0 0 16px}
body.op-campagne .campagne-balk{display:block}
/* De inhoud van het beeld lijnt uit met de lijst eronder: --rand is de
   afstand van de schermrand tot de kolom (640 breed, op desktop 1120). */
.cb-hero{--rand:max(20px,calc(50vw - 300px))}
/* De kop van een campagne: het beeld over de volle breedte, met de terugknop
   en het stijletiket in de bovenhoeken en de naam en de stand onderin, over
   een donkere waas zodat de letters op elk beeld leesbaar blijven. */
.cb-hero{position:relative;height:clamp(220px,30vh,340px);border-radius:0;overflow:hidden;
  width:100vw;margin:0 calc(50% - 50vw);box-sizing:border-box;
  background:linear-gradient(160deg,#3A2A1E,#8A5F16) center/cover no-repeat}
.cb-hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(42,33,24,.10) 0%,rgba(42,33,24,0) 30%,rgba(42,33,24,.20) 55%,rgba(42,33,24,.78) 100%)}
.cb-hero > *{position:absolute;z-index:2}
.cb-hero .vraag-knop{left:var(--rand);top:calc(14px + env(safe-area-inset-top))}
.cb-hero .cb-tag{display:inline-flex;margin-bottom:10px}
.cb-hero .cb-tag .stijl-tag{box-shadow:0 1px 4px rgba(42,33,24,.25)}
.cb-hero .cb-tekst{left:var(--rand);right:calc(var(--rand) + 200px);bottom:22px;display:flex;flex-direction:column;align-items:flex-start}
.cb-hero .ck-stand{right:var(--rand);bottom:26px;color:#F3E7D3;text-align:right}
.cb-hero .ck-stand b{color:#fff}
.cb-hero .ck-balk{background:rgba(255,255,255,.28)}
.cb-hero .ck-balk i{background:#F0DFB4}
.campagne-balk .vraag-knop{flex:0 0 auto;margin-top:2px}
.campagne-balk .vraag-knop svg{width:18px;height:18px}
.cb-tekst{flex:1;min-width:0}
.campagne-balk h2{margin:0;font:600 clamp(28px,4.2vw,46px)/1.08 var(--font-display);color:#FBF4EA;letter-spacing:-.015em;
  text-shadow:0 1px 2px rgba(42,33,24,.5),0 6px 24px rgba(42,33,24,.45)}
.campagne-balk .ck-stand{margin-top:6px}
.ck-label{display:block;font:700 11px var(--font-ui);letter-spacing:.02em;text-transform:none;color:var(--accent)}
.ck-stand{flex:0 0 auto;text-align:right;font:700 11px var(--font-ui);color:var(--dof);white-space:nowrap}
.ck-stand b{color:var(--inkt);font-size:13px}
.ck-balk{display:block;width:84px;height:4px;border-radius:9px;background:var(--lijn);margin:6px 0 0 auto;overflow:hidden}
.ck-balk i{display:block;height:100%;background:var(--accent-vlak);border-radius:9px}
/* De campagne als kaart. Elke kaart heeft dezelfde opbouw en dezelfde maten,
   hoe lang de naam ook is: het label, een naamvak van twee regels (de naam
   staat bovenin, direct onder het label), de reeks zaaknummers op één rij en
   de voet. Geen omschrijving: de naam zegt genoeg.
   Zo staan de nummers en de voortgang in elke kaart op precies dezelfde plek. */
.campagne-kaart{
  position:relative;flex:0 0 auto;display:flex;flex-direction:column;overflow:hidden;
  text-decoration:none;color:inherit;
  background:var(--kaart);border:1px solid var(--lijn);border-radius:16px;
  --kp:20px;padding:0 20px 16px;box-shadow:0 6px 16px -6px rgba(42,33,24,.22),0 1px 2px rgba(42,33,24,.06);
  transition:transform .14s cubic-bezier(.2,.8,.3,1),box-shadow .18s,border-color .18s;
}
.campagne-kaart:hover{border-color:var(--lijn);box-shadow:0 12px 26px -8px rgba(42,33,24,.3),0 1px 2px rgba(42,33,24,.06);transform:translateY(-2px)}
.campagne-kaart:active{transform:none;box-shadow:var(--sch1)}
/* Het campagnebeeld bovenin de kaart, met een inktlijn eronder; daaronder
   begint de tekst op dezelfde plek als voorheen. */
.ck-beeld{position:relative;display:block;height:168px;margin:0 calc(-1 * var(--kp,20px)) 14px;
  background:linear-gradient(160deg,#3A2A1E,#8A5F16) center/cover no-repeat}
.ck-beeld::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(42,33,24,0) 40%,rgba(42,33,24,.22) 62%,rgba(42,33,24,.78) 100%)}
.ck-beeld .ck-naam{position:absolute;left:var(--kp,20px);right:var(--kp,20px);bottom:14px;z-index:2;margin:0;height:auto;
  font:600 26px/1.1 var(--font-display);color:#FBF4EA;letter-spacing:-.015em;
  text-shadow:0 1px 2px rgba(42,33,24,.5),0 6px 24px rgba(42,33,24,.45)}
.ck-beeld .stijl-tag{position:absolute;right:12px;top:12px;z-index:2;box-shadow:0 1px 4px rgba(42,33,24,.25)}
.campagne-kaart .ck-label{display:none}
.ck-naam span{display:block}
/* De stijl van een campagne: een klein etiket in de hoek, in dezelfde vorm
   als het bordformaat op een zaak (vlakje, haarlijn, ronde hoek). */
.stijl-tag{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;
  font:700 11px var(--font-ui);letter-spacing:.02em;color:var(--inkt-2);white-space:nowrap;
  background:var(--kaart-2);border:1px solid var(--lijn);border-radius:8px;padding:4px 8px 4px 7px}
.stijl-tag svg{width:12px;height:12px;color:var(--accent);flex:0 0 auto}
.campagne-kaart:hover .stijl-tag{border-color:var(--accent-lijn)}
.cb-label-rij{display:flex;align-items:center;gap:8px}
/* De reeks: altijd één rij van dezelfde hoogte. Past het niet, dan krimpen de
   vakjes; bij veel zaken vervallen de cijfers en blijft een streepjesbalk. */
.ck-nummers{display:flex;flex-wrap:nowrap;gap:5px;height:26px;margin:2px 0 12px;overflow:hidden}
.ck-nummers i{flex:0 1 26px;min-width:10px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font:600 11.5px var(--font-display);font-style:normal;font-variant-numeric:tabular-nums;
  color:var(--accent);background:var(--accent-zacht);border:1px solid var(--accent-lijn);box-sizing:border-box}
.ck-nummers.dicht i{flex:1 1 0;font-size:0;height:8px;margin-top:9px;border-radius:9px}
.ck-nummers i.af{background:var(--accent);border-color:var(--accent);color:#fff}
.ck-nummers i.bezig{background:var(--accent-vlak);border-color:var(--accent-vlak);color:#fff}
.ck-voet{display:flex;align-items:center;gap:12px;height:34px;padding-top:12px;border-top:1px solid var(--lijn)}
.ck-aantal{font:700 12px var(--font-ui);color:var(--inkt-2);white-space:nowrap}
.ck-aantal .ck-bezig{color:var(--accent);margin-left:6px}
.ck-voet .ck-stand{margin-left:auto}
@keyframes paginaIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes paginaTerug{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.level-list.pagina-in{animation:paginaIn .22s ease both}
.level-list.pagina-terug{animation:paginaTerug .22s ease both}
@media (max-width:640px){
  .cb-hero{height:clamp(230px,62vw,320px)}
  .campagne-balk h2{font-size:clamp(26px,7.5vw,34px)}
  .cb-hero .cb-tekst{right:16px;bottom:62px}
  .cb-hero .ck-stand{left:var(--rand);right:auto;bottom:20px;text-align:left}
  .cb-hero .ck-balk{margin-left:0}
  /* Bovenin geen ruimte: daar staat het beeld, tegen de rand van de kaart. */
  .campagne-kaart{--kp:16px;padding:0 16px 14px}
  .ck-beeld{height:150px}
  .ck-beeld .ck-naam{font-size:23px}
  .ck-balk{width:64px}
}
.leeg-melding{color:var(--dof);font-size:13.5px;text-align:center;padding:26px 10px;
  background:var(--kaart-2);border:1px dashed var(--lijn);border-radius:15px;margin-top:14px}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.modal .sluier{position:absolute;inset:0;background:rgba(10,12,8,.6);backdrop-filter:blur(3px)}
/* Nooit in vh: in een telefoonbrowser is 1vh een honderdste van het scherm
   mét verborgen adresbalk, terwijl het venster (.modal, position:fixed) zo
   groot is als wat je op dat moment écht ziet. Een vel van 86vh was daardoor
   hoger dan de ruimte, stond gecentreerd en stak boven én onder uit; de
   bovenkant leek afgesneden. Procenten van het venster kloppen altijd. */
.vel{
  position:relative;width:100%;max-width:430px;max-height:100%;overflow:auto;overscroll-behavior:contain;
  background:var(--kaart);border:1.5px solid var(--inkt-rand);border-radius:14px;
  padding:22px;box-shadow:0 12px 34px rgba(38,36,25,.16);
  animation:velIn .3s cubic-bezier(.2,1.05,.3,1) both;
}
@keyframes velIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.vel .sluit{
  position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:999px;
  border:1.5px solid var(--inkt-rand);background:var(--kaart);
  display:flex;align-items:center;justify-content:center;font:600 15px/1 var(--font-ui);color:var(--dof);
}
.vel .sluit:hover{color:var(--inkt)}
.vel-kop{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.15;margin-bottom:12px;padding-right:40px}

/* ---------- uitleg-stappen ---------- */
/* Het uitlegvenster houdt één vast formaat, ongeacht de stap: het beeldvak
   en de voet liggen vast, alleen de tekst mag binnen zijn eigen ruimte
   schuiven. Anders springt het venster bij elke klik van maat. */
#modalUitleg .vel{
  height:min(650px,100%);display:flex;flex-direction:column;
}
.uitleg-keuze{flex:1;min-width:0;display:flex;gap:4px;padding:3px;margin:0;border-radius:999px;
  background:var(--kaart-2);border:1px solid var(--lijn)}
/* Drie namen in één schuifje: op een smalle telefoon past dat alleen zonder
   letterafstand en met een iets kleinere letter. */
.uitleg-keuze button{flex:1;min-width:0;height:32px;padding:0 2px;border-radius:999px;background:none;border:0;color:var(--dof);
  font:700 11.5px var(--font-ui);letter-spacing:0;white-space:nowrap;cursor:pointer}
.uitleg-keuze button.aan{background:var(--inkt);color:var(--grond)}
.stap-teller{
  flex:0 0 auto;font-size:11.5px;font-weight:700;letter-spacing:.02em;
  text-transform:none;font-family:var(--font-ui);color:var(--dof);margin-bottom:8px;
}
#stapKop{flex:0 0 auto}
/* Titelkaart: alleen de kop, groot in het midden. */
#modalUitleg .vel.titelkaart #stapKop{flex:1;display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;text-align:center;margin:0;padding:0;font-size:44px;line-height:1.1}
.uitleg-merk{display:none;height:34px;width:auto;max-width:60%}
#modalUitleg .vel.titelkaart .uitleg-merk-donker{display:block}
html[data-thema="licht"] #modalUitleg .vel.titelkaart .uitleg-merk-donker{display:none}
html[data-thema="licht"] #modalUitleg .vel.titelkaart .uitleg-merk-licht{display:block}
#modalUitleg .vel.titelkaart .stap-teller,#modalUitleg .vel.titelkaart .stap-beeld,#modalUitleg .vel.titelkaart .stap-tekst{display:none}
.stap-beeld{
  flex:0 0 214px;display:flex;align-items:center;justify-content:center;
  background:var(--kaart-2);border:1px solid var(--lijn-zacht);border-radius:16px;
  padding:16px;margin-bottom:14px;overflow:hidden;
}
.stap-beeld .hb{max-height:100%}
/* ── Het regelboek ──
   Alle regelsoorten in een venster: links de lijst, rechts het voorbeeld en
   de uitleg. Vijftien kaartjes doorbladeren liet niet zien wat er te vinden
   was; een lijst wel. Op een smal scherm staan ze onder elkaar. */
#modalRegelboek .vel{max-width:min(1060px,96vw);width:100%;height:min(720px,100%);
  display:flex;flex-direction:column;overflow:hidden;text-align:left;padding:20px}
.boek-kop{flex:0 0 auto;padding-right:46px;margin-bottom:12px}
.boek-kop h3{margin:0;font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.1;color:var(--inkt)}
.boek-kop p{margin:3px 0 0;color:var(--dof);font:600 12.5px var(--font-ui)}
.boek-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,232px) minmax(0,1fr);gap:18px}
.boek-lijst{overflow:auto;display:flex;flex-direction:column;gap:2px;padding-right:6px;border-right:1px solid var(--lijn-zacht)}
.boek-lijst button{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
  padding:9px 11px;border-radius:10px;color:var(--inkt);font:700 13.5px var(--font-ui)}
.boek-lijst button:hover{background:var(--kaart-2)}
/* De lijst in groepen die open en dicht kunnen: de kop is een knop met een
   pijltje; de groep van de gekozen soort staat open. */
.boek-groepvak{display:flex;flex-direction:column;gap:2px}
.boek-lijst button.boek-groep{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 10px 6px;font:700 12px var(--font-ui);letter-spacing:.02em;color:var(--dof);background:none;border-radius:0}
.boek-lijst button.boek-groep:hover{color:var(--inkt);background:none}
.boek-groep svg{width:14px;height:14px;flex:0 0 auto;transition:transform .18s}
.boek-groepvak.dicht .boek-groep svg{transform:rotate(-90deg)}
.boek-groepvak.dicht .boek-groep-items{display:none}
.boek-groep-items{display:flex;flex-direction:column;gap:2px}
.boek-lijst button.aan{background:var(--inkt);color:var(--grond)}
.boek-uitleg{overflow:auto;padding-right:4px}
.boek-titel{margin:0 0 10px;font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1.15;color:var(--inkt)}
.boek-beeld{display:flex;align-items:center;justify-content:center;padding:14px;margin-bottom:14px;
  background:var(--kaart-2);border:1px solid var(--lijn-zacht);border-radius:16px}
.boek-beeld .hb{width:210px}
.boek-tekst{color:var(--inkt-2,var(--inkt));font-size:14.5px;line-height:1.6}
.boek-tekst p{margin:0 0 9px}
.boek-tekst p:last-child{margin-bottom:0}
@media (max-width:720px){
  #modalRegelboek .vel{padding:16px}
  .boek-body{grid-template-columns:1fr;gap:10px}
  .boek-lijst{flex:0 0 auto;max-height:26vh;border-right:0;border-bottom:1px solid var(--lijn-zacht);padding:0 0 6px}
  .boek-beeld .hb{width:170px}
}
/* De ingang naar het boek: naast de twee tabbladen, en in de balk. */
.uitleg-kies-rij{flex:0 0 auto;display:flex;align-items:center;gap:8px;margin:0 42px 12px 0}
.keuze-boek{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;
  border:1px solid var(--lijn);background:var(--kaart-2);color:var(--inkt);font:700 12px var(--font-ui);cursor:pointer}
.keuze-boek:hover{border-color:var(--accent-lijn)}
.keuze-boek svg{width:15px;height:15px;display:block}
@media (max-width:430px){ .keuze-boek .lbl{display:none} .keuze-boek{padding:0 10px} }
/* De voorbeeldzaak: een eigen knop, los van het doorklikken. Op een breed
   scherm naast Alle regels; op een telefoon past dat niet in die rij en staat
   hij onder de stappen. */
a.keuze-boek{text-decoration:none}
.keuze-boek.voorbeeld svg,.voorbeeld-los svg{color:var(--accent)}
.voorbeeld-los{display:none;align-self:center;align-items:center;gap:7px;margin-top:12px;padding:8px 14px;
  border:1px solid var(--lijn);border-radius:999px;background:var(--kaart-2);color:var(--inkt);
  font:700 12px var(--font-ui);text-decoration:none}
.voorbeeld-los svg{width:15px;height:15px}
.voorbeeld-los:hover,.keuze-boek.voorbeeld:hover{border-color:var(--accent-lijn)}
@media (max-width:720px){ .keuze-boek.voorbeeld{display:none} .voorbeeld-los{display:flex} }
/* Op een breed scherm staan er drie dingen naast de tabbladen; het venster
   wordt daarvoor breder, en de tabbladen worden nooit smaller dan hun naam. */
@media (min-width:721px){
  #modalUitleg .vel{max-width:590px}
  .uitleg-keuze{min-width:max-content}
  .uitleg-keuze button{padding:0 12px}
}
.boek-knop svg{width:18px;height:18px}
.help-rollen{display:flex;gap:26px;justify-content:center;align-items:center}
.help-rollen .hr{display:flex;flex-direction:column;align-items:center;gap:8px}
.help-rollen .hr-p{position:relative;width:52px;height:74px;display:block}
.help-rollen .hr-v{position:absolute;inset:0}
.help-rollen .hr-v svg{width:100%;height:100%;display:block}
.help-rollen .hr-c{position:absolute;left:9.8%;top:19.4%;width:80.4%;height:56.25%;border-radius:50%;background:#F3F0FA;border:2px solid #2A2118}
.help-rollen b{font:700 12px var(--font-ui);color:var(--inkt-2)}
.stap-tekst{
  flex:1;min-height:0;overflow:auto;
  color:var(--inkt-2);font-size:14.5px;line-height:1.6;
}
.stap-tekst p{margin:0 0 9px}
.stap-tekst p:last-child{margin-bottom:0}
.stap-tekst b{color:var(--inkt)}
.stap-voet{flex:0 0 auto;display:flex;align-items:center;gap:10px;margin-top:16px}
.stap-bolletjes{display:flex;flex-wrap:wrap;gap:4px;flex:1;justify-content:center;min-width:0;padding:0 4px}
.stap-bolletjes i{width:6px;height:6px;border-radius:50%;background:var(--lijn);font-style:normal;transition:background .2s;cursor:pointer}
.stap-bolletjes i.aan{background:var(--accent)}
.stap-voet .knop{padding:9px 13px;white-space:nowrap;flex:0 0 auto}
.stap-voet .knop[disabled]{opacity:.35;cursor:default;border-color:var(--lijn)}

/* het voorbeeldbordje — bewust koel, zo ziet het spelbord er ook uit */
.hb{display:grid;gap:3px;width:150px}
.hb-c{
  position:relative;aspect-ratio:1;border-radius:5px;background:#E7E0D2;
  box-shadow:inset 0 0 0 1px rgba(90,70,40,.18);
  display:flex;align-items:center;justify-content:center;
}
.hb-c.blok{background:#6B5B45;box-shadow:inset 0 0 0 1px rgba(40,28,14,.35)}
.hb-c.leeg{background:none;box-shadow:none}
.hb-c.licht{box-shadow:0 0 0 2px var(--accent)}
.hb-c.gebied{background:#DCCFAE}
.hb-c i{
  width:82%;height:82%;border-radius:50%;font-style:normal;
  display:flex;align-items:center;justify-content:center;
  font:800 13px var(--font-ui);box-shadow:0 0 0 1.3px #1D2036;
}
.hb-c u{text-decoration:none;font:800 13px var(--font-ui);opacity:.9}
.hb-c .kruis{color:#B3413D;font:800 22px/1 var(--font-ui);text-shadow:0 0 2px rgba(255,250,240,.6)}
/* Kleine bewegingen die laten zien wat je doet. */
.hb-c.tik::after{content:"";position:absolute;inset:-3px;border-radius:8px;border:2px solid var(--accent-vlak);
  animation:hbTik 1.8s ease-out infinite}
@keyframes hbTik{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1)}60%,100%{opacity:0;transform:scale(1.25)}}
.hb-c.druk::after{content:"";position:absolute;inset:-3px;border-radius:8px;border:2px solid var(--accent-vlak);
  animation:hbDruk 2.2s ease-in-out infinite}
@keyframes hbDruk{0%{opacity:.15;transform:scale(.86)}55%{opacity:1;transform:scale(1)}75%,100%{opacity:0;transform:scale(1)}}
.hb-c .kruis.komt{animation:hbKruis 2.2s ease-out infinite both}
/* Een kring die opent: alleen de bolletjes, zonder inhoud. */
.hb-ring{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:3}
.hb-ring i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--kaart);border:2px solid var(--accent);box-shadow:0 2px 5px rgba(0,0,0,.3);
  transform:rotate(var(--a)) translate(34px) scale(0);animation:hbRing 3s ease-out infinite}
@keyframes hbRing{0%{transform:rotate(var(--a)) translate(34px) scale(0);opacity:0}18%{transform:rotate(var(--a)) translate(34px) scale(1);opacity:1}72%{transform:rotate(var(--a)) translate(34px) scale(1);opacity:1}86%,100%{transform:rotate(var(--a)) translate(34px) scale(0);opacity:0}}
/* Notitie of plaats: kleine letter in de hoek en grote pion om de beurt. */
.hb-c.wissel u.hoek{position:absolute;left:4px;top:2px;font-size:11px;animation:hbKlein 4s ease-in-out infinite}
.hb-c.wissel i{animation:hbGroot 4s ease-in-out infinite}
@keyframes hbKlein{0%,42%{opacity:.95;transform:scale(1)}50%,92%{opacity:0;transform:scale(.6)}100%{opacity:.95;transform:scale(1)}}
@keyframes hbGroot{0%,42%{opacity:0;transform:scale(.5)}50%,92%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.5)}}
@keyframes hbKruis{0%,8%{opacity:0;transform:scale(.4)}22%{opacity:1;transform:scale(1)}88%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.hb-c.gebied.g-nw{box-shadow:inset 3px 3px 0 #2A2118,inset 0 0 0 1px rgba(28,33,64,.13)}
.hb-c.gebied.g-no{box-shadow:inset -3px 3px 0 #2A2118,inset 0 0 0 1px rgba(28,33,64,.13)}
.hb-c.gebied.g-zw{box-shadow:inset 3px -3px 0 #2A2118,inset 0 0 0 1px rgba(28,33,64,.13)}
.hb-c.gebied.g-zo{box-shadow:inset -3px -3px 0 #2A2118,inset 0 0 0 1px rgba(28,33,64,.13)}
.hb-c.gebied.goud.g-nw{box-shadow:inset 3px 3px 0 #C9A227,inset 0 0 0 1px rgba(28,33,64,.13)}
.hb-c.gebied.goud.g-no{box-shadow:inset -3px 3px 0 #C9A227,inset 0 0 0 1px rgba(28,33,64,.13)}
.hb-c.gebied.goud.g-zw{box-shadow:inset 3px -3px 0 #C9A227,inset 0 0 0 1px rgba(28,33,64,.13)}
.hb-c.gebied.goud.g-zo{box-shadow:inset -3px -3px 0 #C9A227,inset 0 0 0 1px rgba(28,33,64,.13)}
/* Zichtregels in de uitleg: een vak in het zicht licht op, een muur is een
   dikke rand aan één kant, een deur een gouden latje in die rand, een hoog
   object (boom, standbeeld) krijgt een topje zodat je ziet dat het uitsteekt,
   en een mat is een object waar iemand op kan zitten. */
.hb-c.diervak{background:#E6D9BE}
.hb-c .hb-dier{width:74%;height:74%;display:block;color:#5A4A33}
.hb-c .hb-dier svg{width:100%;height:100%;display:block}
.hb-c.zicht{background:#F2DFA8}
.hb-c.mat{background:#D2B98E}
.hb-c.hoog{background:#4E5D3C;box-shadow:inset 0 0 0 1px rgba(20,30,10,.4)}
.hb-c .top{color:#BFD9A6;font:800 15px/1 var(--font-ui,inherit)}
.hb-c.m-n{box-shadow:inset 0 3px 0 #2A2118,inset 0 0 0 1px rgba(90,70,40,.18)}
.hb-c.m-z{box-shadow:inset 0 -3px 0 #2A2118,inset 0 0 0 1px rgba(90,70,40,.18)}
.hb-c.m-w{box-shadow:inset 3px 0 0 #2A2118,inset 0 0 0 1px rgba(90,70,40,.18)}
.hb-c.m-o{box-shadow:inset -3px 0 0 #2A2118,inset 0 0 0 1px rgba(90,70,40,.18)}
/* De kijklijnen in een zichtvoorbeeld: goud als het zicht er is, rood
   gestreept als er iets in de weg staat. De lijn loopt van hart naar hart. */
.hb{position:relative}
.hb-lijnen{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;overflow:visible}
.hb-lijnen .hl{stroke:#C9A227;stroke-width:2.4;stroke-linecap:round;vector-effect:non-scaling-stroke}
.hb-lijnen .hl.nee{stroke:#DC4A46;stroke-dasharray:3.5 3}
.hb-c.deur::before{content:"";position:absolute;background:#C9A227;border-radius:2px;z-index:2}
.hb-c.d-w::before{left:-1px;top:22%;bottom:22%;width:5px}
.hb-c.d-o::before{right:-1px;top:22%;bottom:22%;width:5px}
.hb-c.d-n::before{top:-1px;left:22%;right:22%;height:5px}
.hb-c.d-z::before{bottom:-1px;left:22%;right:22%;height:5px}

.help-rollen{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.help-rollen .hr{
  display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  background:var(--kaart);border:1px solid var(--lijn);
  font:700 13px var(--font-ui);color:var(--inkt);
}
.help-rollen .stip{width:12px;height:12px;border-radius:4px;box-shadow:0 0 0 1.3px rgba(236,234,224,.4)}

/* ---------- zelf maken: één knop, vast onderaan het scherm ------ */
.zelf-voet{
  position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  padding:14px 0 calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--lijn-zacht);margin-top:2px;
}
/* De kleurschakelaar staat links in dezelfde voet: hij hoort bij de app,
   niet bij het kiezen van een zaak. */
.hoek-knoppen{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:45;
  display:flex;flex-direction:column;gap:8px}
.hoek-knoppen .thema-knop{box-shadow:0 4px 14px rgba(42,33,24,.18)}
.thema-knop{
  width:38px;height:38px;padding:0;border-radius:999px;
  border:1.5px solid var(--inkt-rand);background:var(--kaart);box-shadow:none;
  display:inline-flex;align-items:center;justify-content:center;
  transition:border-color .15s;
}
.thema-knop:hover{border-color:var(--accent-lijn)}
/* Volledig scherm: alleen waar de browser het kent, en niet op een telefoon --
   die vult het scherm zelf al. */
.volledig-knop svg{width:17px;height:17px}
.volledig-knop.aan{background:var(--inkt);border-color:var(--inkt);color:var(--grond)}
@media (max-width:760px){ .volledig-knop{display:none!important} }
.thema-knop i{
  width:15px;height:15px;border-radius:50%;display:block;
  background:linear-gradient(135deg,var(--accent-vlak) 50%, var(--inkt) 50%);
}
.zelf-voet .knop{color:var(--inkt-2)}
.zelf-voet .knop svg{color:var(--accent)}

/* ---------- upload en bouwrij (in het venster) ---------- */
.upload-zone{
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  border:1.5px dashed var(--accent-lijn);border-radius:16px;padding:26px 20px;
  background:var(--accent-zacht);cursor:pointer;transition:background .15s,border-color .15s;
}
.upload-zone:hover,.upload-zone.slepen{background:rgba(193,95,60,.16);border-color:var(--accent)}
.upload-zone svg{width:26px;height:26px;color:var(--accent)}
.upload-zone b{font-size:14px;color:var(--inkt)}
.upload-zone span{font-size:12.5px;color:var(--dof)}
.upload-zone input{display:none}
.upload-fout{margin-top:12px;color:var(--fout);font-size:12.5px;font-weight:700;text-align:center}
.of-lijn{
  display:flex;align-items:center;gap:12px;margin:16px 0;
  color:var(--dof);font:700 12px var(--font-ui);letter-spacing:.02em;text-transform:none;
}
.of-lijn::before,.of-lijn::after{content:"";flex:1;height:1px;background:var(--lijn-zacht)}
.bouw-rij{
  display:flex;align-items:center;gap:12px;width:100%;text-decoration:none;
  background:var(--kaart-2);border:1px solid var(--lijn);border-radius:14px;padding:13px 14px;
  transition:border-color .15s;
}
.bouw-rij:hover{border-color:var(--accent-lijn)}
.bouw-rij .ic{flex:0 0 auto;width:36px;height:36px;border-radius:10px;
  background:var(--kaart);border:1px solid var(--lijn);
  display:flex;align-items:center;justify-content:center;color:var(--inkt-2)}
.bouw-rij .ic svg{width:17px;height:17px}
.bouw-rij .tekst{flex:1;min-width:0}
.bouw-rij b{display:block;font-size:13.5px;color:var(--inkt)}
.bouw-rij span{display:block;font-size:12px;color:var(--dof);line-height:1.45}
.bouw-rij .pijl{color:var(--dof);display:flex}
.bouw-rij .pijl svg{width:14px;height:14px}

/* ── De zaak als tegel op een breed scherm ──
   Deze regels staan bewust achteraan: ze delen hun gewicht met de basisregels
   van .level-rij hierboven, en dan wint wie het laatst komt. */
@media (min-width:1100px) and (min-height:600px){
  /* Nummer en formaat op één regel, daaronder de titel met de zwaarte.
     Geen pijl: een tegel is in zijn geheel de knop. */
  .level-rij{display:grid;grid-template-columns:auto minmax(0,1fr);
    grid-template-rows:auto auto;gap:9px 11px;align-items:start;padding:14px}
  .level-rij .zaak-nr{grid-column:1;grid-row:1;width:36px;height:36px;border-radius:10px;font-size:14px}
  .level-rij .midden{grid-column:1/-1;grid-row:2}
  .level-rij h3{font-size:16.5px;line-height:1.25}
  .level-rij .onder{margin-top:5px}
}
/* Schuifbalken in de stijl van het spel: een smalle inktstreep, geen grijze
   systeembalk. Op een aanraakscherm of een klein scherm geen balk. */
*{scrollbar-width:thin;scrollbar-color:var(--inkt-rand) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--inkt-rand);border-radius:999px;border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background-color:var(--inkt)}
@media (pointer:coarse),(max-width:760px){
  *{scrollbar-width:none}
  *::-webkit-scrollbar{display:none;width:0;height:0}
}
</style>
</head>
<body>

<div class="balk">
  <div class="balk-in">
    <div class="balk-links"></div>
    <div class="balk-rechts">
      <!-- Eén knop voor alles wat niet dagelijks is: eigen level, alle regels,
           de uitleg en de voorbeeldzaak. Zo blijft de bovenrand rustig. -->
      <div class="drop meer-drop" id="meerDrop">
        <button class="vraag-knop meer-knop" id="btnMeer" type="button" aria-haspopup="true" aria-expanded="false" title="Meer" aria-label="Meer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"><path d="M7 8.5h10M7 12h10M7 15.5h10"/></svg>
        </button>
        <div class="drop-menu meer-menu" id="meerMenu">
          <button type="button" id="btnUitleg">Zo speel je</button>
          <button type="button" id="btnRegelboekBalk">Alle regels</button>
          <a id="btnVoorbeeldBalk" href="#">Speel de voorbeeldzaak</a>
          <div class="drop-streep"></div>
          <button type="button" id="btnZelf">Eigen level spelen of bouwen</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Dag/nacht en volledig scherm staan los van de balk, rechtsonder in het
     scherm, zodat ze op elke pagina op dezelfde plek zitten. -->
<div class="hoek-knoppen">
  <button class="thema-knop volledig-knop" id="btnVolledig" type="button" title="Volledig scherm" aria-label="Volledig scherm" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5.6A1.6 1.6 0 0 1 5.6 4H9M15 4h3.4A1.6 1.6 0 0 1 20 5.6V9M20 15v3.4a1.6 1.6 0 0 1-1.6 1.6H15M9 20H5.6A1.6 1.6 0 0 1 4 18.4V15"/></svg>
  </button>
  <button class="thema-knop" id="btnThema" type="button" title="Wissel tussen licht en donker" aria-label="Wissel tussen licht en donker"><i></i></button>
</div>

<main>
  <header class="titelblok">
    <!-- Vijf keer tikken op het merk zet de proefstand aan of uit. Hij hoort
         bij het bouwen en niet bij het spelen, dus staat hij nergens als knop;
         wie hem nodig heeft weet hem te vinden. Staat hij aan, dan zegt het
         merk dat ook. -->
    <div class="merk" id="merkTik">
      <img class="beeldmerk" src="../assets/brand/icon.png" alt="">
      <img class="woordmerk woordmerk-donker" src="../assets/brand/logo-dark.png" alt="ClueBoard">
      <img class="woordmerk woordmerk-licht" src="../assets/brand/logo.png" alt="ClueBoard">
      <span class="proef-merk">Proefstand</span>
    </div>
  </header>

  <div class="campagne-balk" id="campagneBalk">
    <div class="cb-hero" id="cbBeeld">
      <button class="vraag-knop" id="btnCampagnes" type="button" title="Terug naar de campagnes" aria-label="Terug naar de campagnes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.6 5.6L8.2 12l6.4 6.4"/></svg>
      </button>
      <div class="cb-tekst"><span class="cb-tag" id="cbStijl"></span><h2 id="cbNaam"></h2></div>
      <div class="ck-stand" id="cbStand"></div>
    </div>
  </div>

  <!-- Filteren als één regel tekst boven de lijst: geen knoppen maar
       woorden, het gekozene onderstreept in inkt. -->
  <div class="filter-plak">
    <button class="filter-woord" id="alleKnop" type="button">Alle zaken</button>
    <button class="filter-woord" id="openKnop" type="button" title="Alleen zaken die nog open staan">Open</button>
    <button class="filter-woord" id="bezigKnop" type="button" title="Alleen zaken waar je middenin zit" hidden>Mee bezig</button>
    <div class="drop" id="filterDrop">
      <button class="filter-woord" id="filterKnop" type="button" aria-haspopup="true" aria-expanded="false" title="Filter op niveau">
        <span id="filterLabel">Niveau</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="drop-menu" id="filterMenu"></div>
    </div>
    <div class="lijst-teller" id="levelTeller"></div>
  </div>

  <div class="level-list" id="levelList"><p class="leeg-melding">Zaken laden…</p></div>

  <!-- Zelf spelen of bouwen is voor de meeste bezoekers niet de eerste
       stap: één rustige knop aan het eind van de lijst, de rest in een
       venster. -->
</main>

<!-- ============ Uitleg in stappen ============ -->
<div class="modal" id="modalUitleg">
  <div class="sluier" data-sluit></div>
  <div class="vel">
    <button class="sluit" data-sluit aria-label="Sluiten">✕</button>
    <div class="uitleg-kies-rij">
      <div class="uitleg-keuze" id="uitlegKeuze">
        <button type="button" data-set="spelen" class="aan">Zo speel je</button>
        <button type="button" data-set="regels">Basis spelregels</button>
      </div>
      <button class="keuze-boek" id="btnRegelboek" type="button" title="Alle regelsoorten op een rij"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 6.6h10.4M9.2 12h10.4M9.2 17.4h10.4"/><circle cx="4.9" cy="6.6" r="1.35" fill="currentColor" stroke="none"/><circle cx="4.9" cy="12" r="1.35" fill="currentColor" stroke="none"/><circle cx="4.9" cy="17.4" r="1.35" fill="currentColor" stroke="none"/></svg><span class="lbl">Alle regels</span></button>
      <a class="keuze-boek voorbeeld" id="btnVoorbeeld" href="#" title="Speel de voorbeeldzaak"></a>
    </div>
    <div class="stap-teller" id="stapTeller"></div>
    <div class="vel-kop" id="stapKop"></div>
    <div class="stap-beeld" id="stapBeeld"></div>
    <div class="stap-tekst" id="stapTekst"></div>
    <div class="stap-voet">
      <button class="knop" id="stapTerug">← Vorige</button>
      <div class="stap-bolletjes" id="stapBolletjes"></div>
      <button class="knop vol" id="stapVerder">Volgende →</button>
    </div>
    <a class="voorbeeld-los" id="btnVoorbeeldLos" href="#"></a>
  </div>
</div>

<!-- ============ Alle regels: lijst links, uitleg rechts ============ -->
<div class="modal" id="modalRegelboek">
  <div class="sluier" data-sluit></div>
  <div class="vel">
    <button class="sluit" data-sluit aria-label="Sluiten">✕</button>
    <div class="boek-kop">
      <h3>Alle regels</h3>
      <p>Elke soort aanwijzing die in een zaak kan staan, met een voorbeeld.</p>
    </div>
    <div class="boek-body">
      <nav class="boek-lijst" id="boekLijst"></nav>
      <div class="boek-uitleg" id="boekUitleg"></div>
    </div>
  </div>
</div>

<!-- ============ Zelf maken: upload + builder ============ -->
<div class="modal" id="modalZelf">
  <div class="sluier" data-sluit></div>
  <div class="vel">
    <button class="sluit" data-sluit aria-label="Sluiten">✕</button>
    <div class="vel-kop">Zelf aan de slag</div>
    <label class="upload-zone" id="uploadZone" for="uploadInput">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4M12 4l-4.5 4.5M12 4l4.5 4.5"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/>
      </svg>
      <b>Speel een eigen level</b>
      <span>Sleep een JSON-bestand hierheen, of klik om te kiezen</span>
      <input type="file" id="uploadInput" accept=".json,application/json">
    </label>
    <div class="upload-fout" id="uploadFout" hidden></div>
    <div class="of-lijn">of</div>
    <a class="bouw-rij" href="../builder/index.html">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20h16"/><path d="M6.5 16.5 15.7 7.3a2.1 2.1 0 0 1 3 3l-9.2 9.2L5 20z"/>
      </svg></span>

/* ============================================================
   Kleurthema: donker (wijnrood met goud) of licht (papier met oker).
   De keuze blijft op dit apparaat bewaard; de titelbalk van de
   geïnstalleerde webapp kleurt mee via de theme-color meta.
   ============================================================ */
/* De kleur die de statusbalk van de telefoon krijgt. Dit is niet de kale
   --grond: over alles heen ligt de korrel-en-vignetlaag van body::after, en
   die verschuift de kleur een paar stappen. Opgemeten aan de bovenrand van het
   werkelijke scherm, want een verschil van twee stappen is op een donkere
   telefoon al een zichtbare naad. */
const THEMA_KLEUR = { donker:"#24191A", licht:"#F0EEE7" };
const THEMA_STANDAARD = "licht";
const THEMA_SLEUTEL = "clueboard:menuThema";
function zetThema(naam){
  const t = THEMA_KLEUR[naam] ? naam : THEMA_STANDAARD;
  /* Donker is de basis en staat al in :root; alleen licht zet een
     data-attribuut, zodat er niets omslaat voordat de stijl er is. */
  if (t === "licht") document.documentElement.dataset.thema = "licht";
  else document.documentElement.removeAttribute("data-thema");
  /* Een nieuwe tag in plaats van de oude bijwerken: als webapp leest de
     browser de balkkleur bij het opstarten uit en kijkt daarna niet meer naar
     dezelfde tag, waardoor de balk bij het wisselen bleef staan. */
  const meta = $("#themeColorMeta");
  if(meta){
    const nieuw = document.createElement("meta");
    nieuw.name = "theme-color"; nieuw.id = "themeColorMeta";
    nieuw.content = THEMA_KLEUR[t];
    meta.parentNode.replaceChild(nieuw, meta);
  }
  try{ localStorage.setItem(THEMA_SLEUTEL, t); }catch(e){}
}
(function initThema(){
  let t = THEMA_STANDAARD;
  try{ t = localStorage.getItem(THEMA_SLEUTEL) || THEMA_STANDAARD; }catch(e){}
  zetThema(t);
})();
$("#btnThema").addEventListener("click",()=>{
  zetThema(document.documentElement.dataset.thema === "licht" ? "donker" : "licht");
});


/* ---------- modals ---------- */
function openModal(id){ $(id).classList.add("open"); }
function sluitModal(el){ el.closest(".modal").classList.remove("open"); window.scrollTo(0,0); }
/* De pagina scrolt zelf nooit: de lijst schuift in zijn eigen vak. Toch kan
   een telefoonbrowser het document een stukje omhoog duwen, bijvoorbeeld
   als je in een venster doorschuift tot voorbij het eind; dan staat de
   bovenste rij met knoppen buiten beeld. Zodra dat gebeurt, gaat hij terug
   naar nul, ook als de pagina uit de cache terugkomt. */
function naarBoven(){
  if(window.scrollY||document.documentElement.scrollTop||document.body.scrollTop) window.scrollTo(0,0);
  document.documentElement.scrollTop=0; document.body.scrollTop=0;
  /* Het zichtbare venster kan los van de pagina verschoven zijn (iOS bij
     het in- en uitklappen van de werkbalk); ook dat hoort op nul. */
  if(window.visualViewport && window.visualViewport.offsetTop>0) window.scrollTo(0,0);
}
window.addEventListener("scroll",naarBoven,{passive:true});
window.addEventListener("resize",naarBoven);
window.addEventListener("pageshow",naarBoven);
window.addEventListener("load",naarBoven);
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",naarBoven);
  window.visualViewport.addEventListener("scroll",naarBoven);
}
document.addEventListener("click", e=>{
  const s=e.target.closest("[data-sluit]");
  if(s) sluitModal(s);
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") document.querySelectorAll(".modal.open").forEach(m=>m.classList.remove("open"));

/* ============================================================
   Hoe speel je? — korte, simpele stappen, van zaak tot ontknoping.
   ============================================================ */
/* Dezelfde letterkleuren als in de assetbank (V4-palet): A C01, B C02, C C03,
   D C04, en het slachtoffer C13. Het menu is zelfstandig, dus ze staan hier
   uitgeschreven; wijzig ze samen met manifest.personColors. */
const HB_KLEUREN = { A:"#D0A24E", B:"#5B93C2", C:"#8C6FA9", D:"#D98B4A", V:"#B6544A" };
function letterInkt(hex){
  const h=hex.replace("#","");
  const lum=0.2126*parseInt(h.slice(0,2),16)+0.7152*parseInt(h.slice(2,4),16)+0.0722*parseInt(h.slice(4,6),16);
  return lum>140 ? "#1D2036" : "#FFFFFF";
}
function helpBord(regels, opt){
  const o=opt||{};
  /* Het beeldvak in de uitleg heeft een vaste hoogte; een bord met meer
     rijen krijgt dus kleinere vakjes in plaats van een hoger venster. */
  const rijen=regels.length, kolommen=regels[0].length, kier=3;
  const cel=Math.min(42, Math.floor((186-(rijen-1)*kier)/rijen));
  const breedte=kolommen*cel+(kolommen-1)*kier;
  let h='<div class="hb" style="width:'+breedte+'px;grid-template-columns:repeat('+kolommen+',1fr)">';
  regels.forEach((rij,y)=>{
    [...rij].forEach((c,x)=>{
      const licht=(o.licht||[]).some(p=>p[0]===x&&p[1]===y);
      const geb=(o.gebied||[]).find(p=>p[0]===x&&p[1]===y);
      const tik=(o.tik||[]).some(p=>p[0]===x&&p[1]===y);
      const ring=(o.ring||[]).some(p=>p[0]===x&&p[1]===y);
      const wissel=(o.wissel||[]).find(p=>p[0]===x&&p[1]===y);
      const druk=(o.druk||[]).some(p=>p[0]===x&&p[1]===y);
      /* Voor de zichtregels: een vak in het zicht, een muur aan een kant, een
         deur in die muur, en een mat (een object waar iemand op kan). */
      const zicht=(o.zicht||[]).some(p=>p[0]===x&&p[1]===y);
      const mat=(o.mat||[]).some(p=>p[0]===x&&p[1]===y);
      const muur=(o.muur||[]).filter(p=>p[0]===x&&p[1]===y).map(p=>" m-"+p[2]).join("");
      const deur=(o.deur||[]).filter(p=>p[0]===x&&p[1]===y).map(p=>" deur d-"+p[2]).join("");
      let cls="hb-c"+(licht?" licht":"")+(geb?" gebied "+geb[2]:"")+(tik?" tik":"")+(druk?" druk":"")+(ring?" ring":"")+(wissel?" wissel":"")
        +(zicht?" zicht":"")+(mat?" mat":"")+muur+deur;
      let inner="";
      if(c==="#") cls+=" blok";
      else if(c==="^"){ cls+=" blok hoog"; inner='<b class="top">\u25b2</b>'; }
      else if(c==="@"){ cls+=" diervak"; inner=HB_DIER; }
      else if(c==="_") cls+=" leeg";
      else if(c==="x"||c==="X"){
        const vertraag=(o.golf?x*150:0);
        inner='<b class="kruis'+(c==="X"?" komt":"")+'"'+(vertraag?' style="animation-delay:'+vertraag+'ms"':"")+'>×</b>';
      }
      else if(/[A-Z]/.test(c)){
        const k=HB_KLEUREN[c]||"#8A93A6";
        inner='<i style="background:'+k+';color:'+letterInkt(k)+'">'+c+'</i>';
      } else if(/[a-z]/.test(c)){
        const k=HB_KLEUREN[c.toUpperCase()]||"#8A93A6";
        inner='<u style="color:'+k+'">'+c.toUpperCase()+'</u>';
      }
      /* Een kring die opent, alleen de bolletjes; en de wissel tussen de
         kleine letter in de hoek (notitie) en de grote pion (plaats). */
      if(ring) inner+='<span class="hb-ring">'+[0,1,2,3,4,5].map(i=>'<i style="--a:'+(i*60-90)+'deg;animation-delay:'+(i*70)+'ms"></i>').join("")+'</span>';
      if(wissel){ const km=/background:(#[0-9a-fA-F]{6})/.exec(inner); inner+='<u class="hoek"'+(km?' style="color:'+km[1]+'"':'')+'>'+wissel[2]+'</u>'; }
      h+='<span class="'+cls+'">'+inner+'</span>';
    });
  });
  /* De kijklijnen van de zichtregels, van hart naar hart van een vak. */
  if((o.lijn||[]).length){
    const mx=x=>((x+0.5)/kolommen*100).toFixed(2), my=y=>((y+0.5)/rijen*100).toFixed(2);
    h+='<svg class="hb-lijnen" viewBox="0 0 100 100" preserveAspectRatio="none">'
      +o.lijn.map(l=>'<line class="hl'+(l[4]==="nee"?" nee":"")+'" x1="'+mx(l[0])
          +'" y1="'+my(l[1])+'" x2="'+mx(l[2])+'" y2="'+my(l[3])+'"/>').join("")
      +'</svg>';
  }
  return h+"</div>";
}

}

function tekenUitleg(){

  if(s.titel){
    $("#stapKop").innerHTML='<img class="uitleg-merk uitleg-merk-donker" src="../assets/brand/logo-dark.png" alt="ClueBoard">'
      +'<img class="uitleg-merk uitleg-merk-licht" src="../assets/brand/logo.png" alt="ClueBoard"><span></span>';
    $("#stapKop span").textContent=s.titel;
  } else $("#stapKop").textContent=s.kop;
  $("#stapBeeld").innerHTML=s.titel?"":s.beeld;      /* eigen vaste inhoud, geen levelinvoer */
  $("#stapTekst").innerHTML=s.titel?"":s.tekst;      /* idem */

/* ── Het regelboek ──────────────────────────────────────
   Alle regelsoorten in een venster: links de lijst, rechts het voorbeeld en
   de uitleg. Dezelfde tabel als in de player. */
let boekSel="plek";
const BOEK_OPEN=new Set();
function boekFamilies(){ return REGEL_FAMILIES.filter(f=>f.inLijst!==false); }
function tekenRegelboek(){
  const fams=boekFamilies();
  const f=fams.find(x=>x.id===boekSel)||fams[0];
  if(!f) return;
  boekSel=f.id;
  /* De lijst in groepen die open en dicht kunnen. De groep van de gekozen
     soort gaat open als er nog niets openstaat; verder blijft de keuze van
     de speler staan. Soorten zonder groep staan los onderaan. */
  const groepen = [];
  fams.forEach(x => {
    const g = x.groep || "";
    let last = groepen[groepen.length - 1];
    if (!last || last.naam !== g){ last = { naam:g, items:[] }; groepen.push(last); }
    last.items.push(x);
  });
  const eigen = groepen.find(g => g.items.some(x => x.id === f.id));
  if (eigen && eigen.naam && !BOEK_OPEN.size) BOEK_OPEN.add(eigen.naam);
  $("#boekLijst").innerHTML = groepen.map(g => {
    const knoppen = g.items.map(x => '<button type="button" data-fam="' + x.id + '"' + (x.id === f.id ? ' class="aan"' : '') + '>'
      + String(x.kop) + '</button>').join("");
    if (!g.naam) return knoppen;
    const open = BOEK_OPEN.has(g.naam);
    return '<div class="boek-groepvak' + (open ? '' : ' dicht') + '">'
      + '<button type="button" class="boek-groep" data-groep="' + String(g.naam) + '" aria-expanded="' + open + '">'
      + String(g.naam) + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>'
      + '<div class="boek-groep-items">' + knoppen + '</div></div>';
  }).join("");
  $("#boekUitleg").innerHTML='<h4 class="boek-titel">'+String(f.kop)+'</h4>'
    +'<div class="boek-beeld">'+f.beeld()+'</div>'
    +'<div class="boek-tekst">'+f.tekst.map(t=>'<p>'+t+'</p>').join("")+'</div>';
  const aan=$("#boekLijst").querySelector(".aan");
  if(aan) aan.scrollIntoView({block:"nearest"});
}
function openRegelboek(famId){
  if(famId){ boekSel=famId; const f=REGEL_FAMILIES.find(x=>x.id===famId); if(f && f.groep) BOEK_OPEN.add(f.groep); }
  tekenRegelboek();
  openModal("#modalRegelboek");
}
$("#boekLijst").addEventListener("click",e=>{
  const k=e.target.closest("button[data-groep]");
  if(k){ const g=k.dataset.groep; if(BOEK_OPEN.has(g)) BOEK_OPEN.delete(g); else BOEK_OPEN.add(g); tekenRegelboek(); return; }
  const b=e.target.closest("button[data-fam]");
  if(!b) return;
  boekSel=b.dataset.fam;
  tekenRegelboek();
  const u=$("#boekUitleg");
  if(u){ u.scrollTop=0; if(window.innerWidth<=720) u.scrollIntoView({block:"nearest",behavior:"smooth"}); }
});

/* ── Volledig scherm ────────────────────────────────────
   Eén knop in de balk: het menu en het spel dat je erna opent vullen dan het
   hele beeld. De stand komt van de browser, dus Escape en F11 komen hier ook
   voorbij. */
(function(){
  const knop=$("#btnVolledig"), el=document.documentElement;
  if(!knop) return;
  const kan=!!(el.requestFullscreen||el.webkitRequestFullscreen);
  const aan=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const teken=()=>{ knop.hidden=!kan; knop.classList.toggle("aan",aan());
    knop.setAttribute("aria-pressed",aan()?"true":"false"); };
  knop.addEventListener("click",()=>{
    try{
      if(aan()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
      else { (el.requestFullscreen||el.webkitRequestFullscreen).call(el); }
    }catch(e){}
    setTimeout(teken,120);
  });
  document.addEventListener("fullscreenchange",teken);
  document.addEventListener("webkitfullscreenchange",teken);
  teken();
})();
$("#btnUitleg").addEventListener("click",()=>{ zetUitlegSet("spelen"); openModal("#modalUitleg"); });
$("#stapTerug").addEventListener("click",()=>{ if(uitlegStap>0){ uitlegStap--; tekenUitleg(); } });
$("#stapVerder").addEventListener("click",()=>{

    if(deel[i]) uitlegStap=UITLEG_STAPPEN.indexOf(deel[i]);
